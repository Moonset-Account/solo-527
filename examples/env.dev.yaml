name: 用户服务 - 开发环境
description: 开发环境测试配置
baseUrl: http://localhost:3000
variables:
  BASE_URL: http://localhost:3000
  API_TOKEN: dev-token-placeholder-please-replace
  TIMESTAMP: __TIMESTAMP__
  DB_NAME: user_service_dev
  LOG_LEVEL: debug
auth:
  type: bearer
  token: dev-token-placeholder-please-replace
headers:
  X-Environment: development
  X-Debug: "true"
timeoutMs: 15000
retry:
  maxAttempts: 2
  delayMs: 1000
  backoffMultiplier: 1.5
