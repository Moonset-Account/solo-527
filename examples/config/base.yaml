app:
  name: "platform-service"
  version: "1.0.0"
  environment: "base"
  debug: false
  logLevel: "info"

server:
  host: "0.0.0.0"
  port: 8080
  protocol: "http"
  cors:
    enabled: true
    origins:
      - "http://localhost:3000"

database:
  type: "postgresql"
  host: "localhost"
  port: 5432
  name: "app_db"
  username: "dbuser"
  password: "CHANGE_ME_IN_ENV"
  pool:
    min: 2
    max: 10
    idleTimeout: 30000

features:
  - name: "auth"
    enabled: true
  - name: "metrics"
    enabled: true
  - name: "cache"
    enabled: false

cache:
  type: "memory"
  ttl: 300

logging:
  format: "text"
  outputs:
    - type: "console"
      level: "info"

security:
  sessionTimeout: 1800
  rateLimit:
    enabled: false
