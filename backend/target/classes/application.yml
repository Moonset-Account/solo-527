server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gym-management

  datasource:
    url: jdbc:h2:mem:gymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: gym-management-secret-key-for-jwt-token-generation-2024-very-long-secret-key-that-is-at-least-64-bytes-for-hs512-algorithm
  expiration: 86400000

logging:
  level:
    com.gym: DEBUG
    org.springframework.security: DEBUG
