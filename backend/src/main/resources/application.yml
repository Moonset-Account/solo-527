server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pm_workstation?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.pm.workstation: DEBUG
    org.hibernate.SQL: DEBUG

app:
  reminder:
    comment-timeout-hours: 24
    cron-check-remind: "0 */5 * * * *"
    cron-check-unreplied: "0 */10 * * * *"
  import:
    max-batch-size: 500
    template-path: /templates/requirement_import_template.xlsx
