server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: workorder-center

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/property_workorder
    username: postgres
    password: postgres

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.property.workorder.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 物业工单中心API
    description: 公寓住户报修工单管理系统接口文档
    version: 1.0.0
    concat: property-admin

callback:
  retry:
    max-attempts: 5
    initial-interval: 60000
    multiplier: 2.0
    max-interval: 86400000
