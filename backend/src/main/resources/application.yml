server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: email-generator

  datasource:
    url: jdbc:postgresql://localhost:5432/email_generator
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

email:
  generator:
    batch-size: 100
    cache-ttl: 3600

logging:
  level:
    com.emailgenerator: debug
    org.springframework.web: info
