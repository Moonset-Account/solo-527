server:
  port: 8080

spring:
  application:
    name: expense-approval

  datasource:
    url: jdbc:postgresql://localhost:5432/expense_approval
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

jwt:
  secret: your-super-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  prefix: Bearer

file:
  storage:
    upload-path: ./uploads/
    allowed-extensions: .jpg,.jpeg,.png,.gif,.pdf,.doc,.docx,.xls,.xlsx,.txt
    max-file-size: 10485760

scheduling:
  timeout-check:
    cron: "0 */30 * * * ?"
    interval-minutes: 30
  reminder:
    cron: "0 0 9 * * ?"
    time: "09:00"
  cache-evict:
    cron: "0 0 2 * * ?"
