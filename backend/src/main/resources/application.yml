server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: decoration-crm

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/decoration_crm?stringtype=unspecified
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.decoration.crm.entity
  type-handlers-package: com.decoration.crm.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: null

jwt:
  secret: decoration-crm-secret-key-for-jwt-token-generation-2024
  expiration: 86400000
  header: Authorization
  prefix: Bearer

logging:
  level:
    com.decoration.crm: debug
    org.springframework.security: info
