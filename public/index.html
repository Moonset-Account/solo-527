<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手术室耗材备包系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF', success: '#00B42A', warning: '#FF7D00', danger: '#F53F3F' } } } }
    </script>
    <style>
        .sidebar-item.active { background-color: rgba(22, 93, 255, 0.1); color: #165DFF; border-left: 3px solid #165DFF; }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slideIn { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app"></div>
    <script>
        // ========== 全局状态 ==========
        const API_BASE = '/api';
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        let authToken = localStorage.getItem('authToken');
        let currentView = 'dashboard';
        let unreadCount = 0;

        const menuItems = [
            { id: 'dashboard', icon: 'fa fa-tachometer', label: '仪表盘', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'schedules', icon: 'fa fa-calendar', label: '手术排班', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'packages', icon: 'fa fa-box', label: '耗材备包', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'returns', icon: 'fa fa-undo', label: '退包盘点', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'inventory', icon: 'fa fa-cubes', label: '库存管理', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'notifications', icon: 'fa fa-bell', label: '通知中心', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
        ];

        const roleMap = {
            admin: '系统管理员', head_nurse: '护士长', nurse: '手术室护士', equipment: '设备科'
        };

        // ========== 工具函数 ==========
        async function api(url, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
            const res = await fetch(`${API_BASE}${url}`, { ...options, headers });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || '请求失败');
            return data;
        }

        function formatDate(date, withTime = true) {
            if (!date) return '-';
            const d = new Date(date);
            const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
            if (withTime) {
                const h = String(d.getHours()).padStart(2,'0'), min = String(d.getMinutes()).padStart(2,'0');
                return `${y}-${m}-${day} ${h}:${min}`;
            }
            return `${y}-${m}-${day}`;
        }

        function getStatusLabel(s) {
            const m = {draft:'草稿',pending_review:'待审核',reviewed:'已审核',confirmed:'已确认',distributed:'已发放',used:'已使用',returned:'已退回',cancelled:'已取消',scheduled:'已排班',completed:'已完成',pending:'待核验',normal:'正常',expired:'已过期',submitted:'已提交',approved:'已审核'};
            return m[s] || s;
        }

        function getStatusColor(s) {
            const m = {draft:'bg-gray-200 text-gray-600',pending_review:'bg-orange-100 text-orange-600',reviewed:'bg-blue-100 text-blue-600',confirmed:'bg-green-100 text-green-600',distributed:'bg-blue-100 text-blue-600',used:'bg-gray-200 text-gray-600',returned:'bg-gray-200 text-gray-600',cancelled:'bg-red-100 text-red-600',scheduled:'bg-blue-100 text-blue-600',completed:'bg-green-100 text-green-600',pending:'bg-orange-100 text-orange-600',normal:'bg-green-100 text-green-600',expired:'bg-red-100 text-red-600',submitted:'bg-blue-100 text-blue-600',approved:'bg-green-100 text-green-600'};
            return m[s] || 'bg-gray-200 text-gray-600';
        }

        function showToast(msg, type='success') {
            const c = {success:'bg-green-500',error:'bg-red-500',warning:'bg-orange-500',info:'bg-blue-500'};
            const icons = {success:'fa-check-circle',error:'fa-times-circle',warning:'fa-exclamation-triangle',info:'fa-info-circle'};
            const t = document.createElement('div');
            t.className = `fixed top-4 right-4 ${c[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-slideIn`;
            t.innerHTML = `<div class="flex items-center gap-2"><i class="fa ${icons[type]}"></i><span>${msg}</span></div>`;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; }, 2700);
            setTimeout(() => t.remove(), 3000);
        }

        function showModal(content) {
            closeModal();
            const m = document.createElement('div');
            m.id = 'app-modal';
            m.className = 'fixed inset-0 z-50 flex items-center justify-center modal-backdrop';
            m.innerHTML = `<div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[85vh] overflow-y-auto">${content}</div>`;
            m.onclick = (e) => { if(e.target === m) m.remove(); };
            document.body.appendChild(m);
            return m;
        }

        function closeModal() {
            const m = document.getElementById('app-modal');
            if (m) m.remove();
        }

        function logout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            renderApp();
        }

        function navigateTo(view) { 
            currentView = view; 
            renderApp(); 
        }

        // ========== 登录页面 ==========
        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100">
                    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fa fa-medkit text-white text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-gray-800">手术室耗材备包系统</h1>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">用户名</label>
                                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" value="nurse1">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">密码</label>
                                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" value="123456">
                            </div>
                            <button type="submit" id="loginBtn" class="w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-blue-600 transition-colors">登 录</button>
                        </form>
                        <div class="mt-6 pt-4 border-t border-gray-100">
                            <p class="text-xs text-gray-400 mb-2">测试账号（密码均为 123456）：</p>
                            <div class="text-xs text-gray-500 space-y-1">
                                <p>admin - 系统管理员 | headnurse - 护士长 | nurse1 - 手术室护士</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>登录中...';
            
            try {
                const res = await api('/auth/login', { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        username: document.getElementById('username').value, 
                        password: document.getElementById('password').value 
                    }) 
                });
                currentUser = res.user;
                authToken = res.token;
                localStorage.setItem('authToken', authToken);
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showToast('登录成功', 'success');
                setTimeout(() => renderApp(), 300);
            } catch(err) { 
                showToast(err.message, 'error'); 
                btn.disabled = false;
                btn.innerHTML = '登 录';
            }
        }

        // ========== 主布局 ==========
        function renderLayout(content) {
            const allowedMenus = menuItems.filter(m => m.roles.includes(currentUser.role));
            const userName = currentUser.realName || currentUser.real_name || currentUser.username;
            
            return `
                <div class="flex h-screen">
                    <aside class="w-60 bg-white shadow-sm flex flex-col">
                        <div class="p-4 border-b border-gray-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
                                    <i class="fa fa-medkit text-white"></i>
                                </div>
                                <div><h1 class="font-bold text-gray-800 text-sm">耗材备包系统</h1></div>
                            </div>
                        </div>
                        <nav class="flex-1 py-4 overflow-y-auto">
                            ${allowedMenus.map(m => `
                                <div class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-gray-50 text-gray-600 ${currentView===m.id?'active':''}" onclick="navigateTo('${m.id}')">
                                    <i class="fa ${m.icon} w-5 text-center"></i>
                                    <span class="text-sm">${m.label}</span>
                                    ${m.id === 'notifications' && unreadCount > 0 ? 
                                        `<span class="ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">${unreadCount}</span>` : ''}
                                </div>
                            `).join('')}
                        </nav>
                        <div class="p-4 border-t border-gray-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                    <span class="text-primary font-medium">${userName.charAt(0)}</span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-medium text-gray-700 truncate">${userName}</p>
                                    <p class="text-xs text-gray-400">${roleMap[currentUser.role]}</p>
                                </div>
                                <button onclick="logout()" class="text-gray-400 hover:text-red-500" title="退出登录">
                                    <i class="fa fa-sign-out"></i>
                                </button>
                            </div>
                        </div>
                    </aside>
                    <main class="flex-1 overflow-y-auto">${content}</main>
                </div>
            `;
        }

        // ========== 仪表盘 ==========
        async function renderDashboard() {
            try {
                const [pkg, sch, notif] = await Promise.all([
                    api('/packages?pageSize=5'), api('/schedules?pageSize=10'), api('/notifications?unread=true&pageSize=5')
                ]);
                const today = new Date().toISOString().split('T')[0];
                const todaySch = (sch.data || []).filter(s => s.scheduled_start_time && s.scheduled_start_time.startsWith(today));
                const pending = (pkg.data || []).filter(p => p.status === 'pending_review');
                unreadCount = (notif.data || []).length;

                return `
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <h2 class="text-xl font-bold text-gray-800">仪表盘</h2>
                                <p class="text-gray-400 text-sm mt-1">欢迎回来，${currentUser.realName || currentUser.real_name || currentUser.username}</p>
                            </div>
                            <div class="text-sm text-gray-400">${formatDate(new Date())}</div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">今日手术</p><p class="text-2xl font-bold text-gray-800 mt-1">${todaySch.length}</p></div>
                                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center"><i class="fa fa-calendar text-primary text-xl"></i></div>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">待审核备包</p><p class="text-2xl font-bold text-orange-500 mt-1">${pending.length}</p></div>
                                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center"><i class="fa fa-clock-o text-orange-500 text-xl"></i></div>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">总备包数</p><p class="text-2xl font-bold text-gray-800 mt-1">${pkg.total || 0}</p></div>
                                    <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa fa-file-text-o text-gray-500 text-xl"></i></div>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">未读通知</p><p class="text-2xl font-bold text-primary mt-1">${unreadCount}</p></div>
                                    <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center"><i class="fa fa-bell text-primary text-xl"></i></div>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="bg-white rounded-lg shadow-sm">
                                <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                                    <h3 class="font-medium text-gray-700">今日手术排班</h3>
                                    <button onclick="navigateTo('schedules')" class="text-sm text-primary hover:underline">查看全部</button>
                                </div>
                                <div class="divide-y divide-gray-50">
                                    ${todaySch.length>0 ? todaySch.map(s=>`
                                        <div class="p-4 flex items-center gap-4 hover:bg-gray-50 cursor-pointer" onclick="viewSchedule('${s.id}')">
                                            <div class="w-1 h-12 bg-primary rounded-full"></div>
                                            <div class="flex-1 min-w-0">
                                                <p class="font-medium text-gray-700 truncate">${s.surgery_type_name || s.surgery_type_id || '未命名'}</p>
                                                <p class="text-sm text-gray-400">${s.patient_name} · ${s.surgeon_name || '主刀医生'}</p>
                                            </div>
                                            <span class="status-badge ${getStatusColor(s.status)}">${getStatusLabel(s.status)}</span>
                                        </div>
                                    `).join('') : '<div class="p-8 text-center text-gray-400">今日暂无手术</div>'}
                                </div>
                            </div>
                            <div class="bg-white rounded-lg shadow-sm">
                                <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                                    <h3 class="font-medium text-gray-700">最近备包记录</h3>
                                    <button onclick="navigateTo('packages')" class="text-sm text-primary hover:underline">查看全部</button>
                                </div>
                                <div class="divide-y divide-gray-50">
                                    ${(pkg.data || []).length>0 ? pkg.data.map(p=>`
                                        <div class="p-4 flex items-center gap-4 hover:bg-gray-50 cursor-pointer" onclick="viewPackage('${p.id}')">
                                            <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center"><i class="fa fa-box text-primary"></i></div>
                                            <div class="flex-1 min-w-0">
                                                <p class="font-medium text-gray-700 truncate">${p.package_name || p.package_no}</p>
                                                <p class="text-sm text-gray-400">${p.preparer_name || '未知'} · ${formatDate(p.created_at)}</p>
                                            </div>
                                            <span class="status-badge ${getStatusColor(p.status)}">${getStatusLabel(p.status)}</span>
                                        </div>
                                    `).join('') : '<div class="p-8 text-center text-gray-400">暂无记录</div>'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch(err) { 
                return `<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`; 
            }
        }

        // ========== 手术排班 ==========
        async function renderSchedules() {
            try {
                const res = await api('/schedules?pageSize=20');
                const schedules = res.data || [];
                return `
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <h2 class="text-xl font-bold text-gray-800">手术排班</h2>
                                <p class="text-gray-400 text-sm mt-1">管理手术排班和术式安排</p>
                            </div>
                            ${['admin','head_nurse'].includes(currentUser.role) ? 
                                `<button onclick="showAddScheduleModal()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-600 transition-colors">
                                    <i class="fa fa-plus mr-2"></i>新增排班
                                </button>` : ''}
                        </div>
                        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-50 text-gray-600">
                                    <tr>
                                        <th class="px-4 py-3 text-left">排班编号</th>
                                        <th class="px-4 py-3 text-left">术式</th>
                                        <th class="px-4 py-3 text-left">患者</th>
                                        <th class="px-4 py-3 text-left">主刀医生</th>
                                        <th class="px-4 py-3 text-left">手术间</th>
                                        <th class="px-4 py-3 text-left">计划时间</th>
                                        <th class="px-4 py-3 text-left">状态</th>
                                        <th class="px-4 py-3 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${schedules.length === 0 ? 
                                        `<tr><td colspan="8" class="px-4 py-8 text-center text-gray-400">暂无排班记录</td></tr>` : 
                                        schedules.map(s => `
                                            <tr class="border-t hover:bg-gray-50">
                                                <td class="px-4 py-3 font-mono text-xs">${s.schedule_no}</td>
                                                <td class="px-4 py-3">${s.surgery_type_name || s.surgery_type_id || '-'}</td>
                                                <td class="px-4 py-3">${s.patient_name}</td>
                                                <td class="px-4 py-3">${s.surgeon_name || '-'}</td>
                                                <td class="px-4 py-3">${s.room_name || s.operating_room_id || '-'}</td>
                                                <td class="px-4 py-3 text-gray-500">${formatDate(s.scheduled_start_time)}</td>
                                                <td class="px-4 py-3"><span class="status-badge ${getStatusColor(s.status)}">${getStatusLabel(s.status)}</span></td>
                                                <td class="px-4 py-3 text-center">
                                                    <button onclick="viewSchedule('${s.id}')" class="text-primary hover:underline text-xs mr-2">详情</button>
                                                    ${['admin','head_nurse','nurse'].includes(currentUser.role) ? 
                                                        `<button onclick="quickCreatePackage('${s.id}')" class="text-green-600 hover:underline text-xs mr-2">备包</button>` : ''}
                                                    ${['admin','head_nurse'].includes(currentUser.role) && s.status === 'scheduled' ? 
                                                        `<button onclick="cancelSchedule('${s.id}')" class="text-red-500 hover:underline text-xs">取消</button>` : ''}
                                                </td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch(err) { 
                return `<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`; 
            }
        }

        async function showAddScheduleModal() {
            try {
                const [rooms, types] = await Promise.all([api('/inventory/operating-rooms'), api('/inventory/surgery-types')]);
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                const defaultStart = now.toISOString().slice(0, 16);
                now.setHours(now.getHours() + 1);
                const defaultEnd = now.toISOString().slice(0, 16);
                
                showModal(`
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-semibold">新增手术排班</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times"></i></button>
                        </div>
                        <form onsubmit="submitSchedule(event)" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">术式 *</label>
                                    <select id="sch_surgery_type_id" class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" required>
                                        <option value="">-- 请选择术式 --</option>
                                        ${(types.data || []).map(t => `<option value="${t.id}">${t.name} (${t.department || ''})</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">手术间 *</label>
                                    <select id="sch_operating_room_id" class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" required>
                                        <option value="">-- 请选择手术间 --</option>
                                        ${(rooms.data || []).filter(r=>r.status==='available').map(r => `<option value="${r.id}">${r.room_name || r.room_no} (${r.floor || ''})</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">患者姓名 *</label>
                                    <input type="text" id="sch_patient_name" class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">主刀医生</label>
                                    <input type="text" id="sch_surgeon_name" class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-600 mb-1">开始时间 *</label>
                                    <input type="datetime-local" id="sch_start" value="${defaultStart}" class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" required>
                                </div>
                                <div>

        async function loadReturnPackageItems(packageId) {
            const container = document.getElementById('ret_items_container');
            const listDiv = document.getElementById('ret_items_list');
            if (!packageId) { container.style.display = 'none'; returnItemsState = []; return; }
            
            try {
                const res = await api(`/packages/${packageId}`);
                const items = res.data?.items || res.items || [];
                returnItemsState = items.map(item => ({
                    packageItemId: item.id,
                    itemName: item.item_name || item.supply_item_id,
                    maxReturnable: (item.quantity_prepared || 0) - (item.quantity_used || 0) - (item.quantity_returned || 0),
                    quantityReturned: 0,
                    checked: false
                })).filter(i => i.maxReturnable > 0);
                
                if (returnItemsState.length === 0) {
                    listDiv.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">该备包无可退回耗材</div>';
                } else {
                    listDiv.innerHTML = returnItemsState.map((item, idx) => `
                        <div class="flex items-center gap-3 p-3 border-b hover:bg-gray-50">
                            <input type="checkbox" id="ret_item_${idx}" onchange="toggleReturnItem(${idx}, this.checked)" class="rounded">
                            <label for="ret_item_${idx}" class="flex-1 cursor-pointer">
                                <span class="text-sm font-medium">${item.itemName}</span>
                                <span class="text-xs text-gray-400 ml-2">可退: ${item.maxReturnable}</span>
                            </label>
                            <input type="number" id="ret_qty_${idx}" min="0" max="${item.maxReturnable}" value="0" 
                                   onchange="updateReturnQty(${idx}, this.value)"
                                   class="w-20 px-2 py-1 border rounded text-sm text-center" ${item.checked ? '' : 'disabled'}>
                        </div>
                    `).join('');
                }
                container.style.display = 'block';
            } catch(err) { showToast(err.message, 'error'); }
        }

        function toggleReturnItem(idx, checked) {
            returnItemsState[idx].checked = checked;
            const qtyInput = document.getElementById(`ret_qty_${idx}`);
            if (checked) {
                qtyInput.disabled = false;
                qtyInput.value = returnItemsState[idx].maxReturnable;
                returnItemsState[idx].quantityReturned = returnItemsState[idx].maxReturnable;
            } else {
                qtyInput.disabled = true;
                qtyInput.value = 0;
                returnItemsState[idx].quantityReturned = 0;
            }
        }

        function updateReturnQty(idx, val) {
            const qty = Math.min(Math.max(0, parseInt(val) || 0), returnItemsState[idx].maxReturnable);
            returnItemsState[idx].quantityReturned = qty;
            document.getElementById(`ret_qty_${idx}`).value = qty;
        }

                                                <td class="px-4 py-3 text-gray-500">${i.specification || '-'}</td>
                                                <td class="px-4 py-3 text-center font-mono text-xs">${i.batch_no || '-'}</td>
                                                <td class="px-4 py-3 text-center">${formatDate(i.expiry_date, false)}</td>
                                                <td class="px-4 py-3 text-right font-medium ${i.quantity <= 10 ? 'text-orange-500' : ''}">${i.quantity || 0}</td>
                                                <td class="px-4 py-3 text-center">
                                                    ${i.is_high_value ? '<span class="text-red-500 text-xs bg-red-50 px-2 py-0.5 rounded">高值</span>' : '<span class="text-gray-500 text-xs">普通</span>'}
                                                </td>
                                                <td class="px-4 py-3 text-center">
                                                    <span class="status-badge ${getStatusColor(i.status)}">${getStatusLabel(i.status)}</span>
                                                </td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch(err) { 
                return `<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`; 
            }
        }

        // ========== 通知中心 ==========
        async function renderNotifications() {
            try {
                const res = await api('/notifications?pageSize=20');
                const notifications = res.data || [];
                return `
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <h2 class="text-xl font-bold text-gray-800">通知中心</h2>
                                <p class="text-gray-400 text-sm mt-1">系统通知和提醒消息</p>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${notifications.length === 0 ? 
                                `<div class="bg-white p-8 rounded-lg text-center text-gray-400">暂无通知</div>` : 
                                notifications.map(n => `
                                    <div class="bg-white rounded-lg shadow-sm p-4 ${!n.is_read ? 'border-l-4 border-primary' : ''}">
                                        <div class="flex items-start justify-between">
                                            <div class="flex-1">
                                                <div class="flex items-center gap-2 mb-1">
                                                    ${!n.is_read ? '<span class="w-2 h-2 bg-primary rounded-full"></span>' : ''}
                                                    <h4 class="font-medium text-gray-800">${n.title}</h4>
                                                </div>
                                                <p class="text-sm text-gray-600">${n.content || n.message}</p>
                                                <p class="text-xs text-gray-400 mt-2">${formatDate(n.created_at)}</p>
                                            </div>
                                            ${!n.is_read ? `<button onclick="markNotificationRead('${n.id}')" class="text-primary text-xs hover:underline">标记已读</button>` : ''}
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                `;
            } catch(err) { 
                return `<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`; 
            }
        }

        async function markNotificationRead(id) {
            try {
                await api(`/notifications/${id}/read`, { method: 'POST' });
                showToast('已标记为已读', 'success');
                renderApp();
            } catch(err) { showToast(err.message, 'error'); }
        }

        // ========== 主渲染函数 ==========
        async function renderApp() {
            const app = document.getElementById('app');
            
            if (!authToken || !currentUser) {
                app.innerHTML = renderLogin();
                return;
            }

            let content = '<div class="p-8 text-center"><i class="fa fa-spinner fa-spin text-primary text-2xl"></i><p class="mt-2 text-gray-500">加载中...</p></div>';
            app.innerHTML = renderLayout(content);

            try {
                switch(currentView) {
                    case 'dashboard':
                        content = await renderDashboard();
                        break;
                    case 'schedules':
                        content = await renderSchedules();
                        break;
                    case 'packages':
                        content = await renderPackages();
                        break;
                    case 'returns':
                        content = await renderReturns();
                        break;
                    case 'inventory':
                        content = await renderInventory();
                        break;
                    case 'notifications':
                        content = await renderNotifications();
                        break;
                    default:
                        content = await renderDashboard();
                }
                app.innerHTML = renderLayout(content);
            } catch(err) {
                app.innerHTML = renderLayout(`<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`);
            }
        }

        // ========== 页面初始化 ==========
        renderApp();
    </script>
</body>
</html>
