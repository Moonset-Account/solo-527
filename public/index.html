<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手术室耗材备包系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF', success: '#00B42A', warning: '#FF7D00', danger: '#F53F3F' } } } }
    </script>
    <style>
        .sidebar-item.active { background-color: rgba(22, 93, 255, 0.1); color: #165DFF; border-left: 3px solid #165DFF; }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .step-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app"></div>
    <script>
        const API_BASE = '/api';
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        let authToken = localStorage.getItem('authToken');
        let currentPage = 'dashboard';
        let currentView = 'dashboard';
        let unreadCount = 0;
        let selectedPackageId = null;
        
        const menuItems = [
            { id: 'dashboard', icon: 'fa fa-tachometer', label: '仪表盘', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'schedules', icon: 'fa fa-calendar', label: '手术排班', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'packages', icon: 'fa fa-box', label: '耗材备包', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'returns', icon: 'fa fa-undo', label: '退包盘点', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'inventory', icon: 'fa fa-cubes', label: '库存管理', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
            { id: 'reconciliations', icon: 'fa fa-balance-scale', label: '月度对账', roles: ['admin', 'head_nurse', 'equipment'] },
            { id: 'importExport', icon: 'fa fa-exchange', label: '导入导出', roles: ['admin', 'head_nurse', 'equipment'] },
            { id: 'notifications', icon: 'fa fa-bell', label: '通知中心', roles: ['admin', 'head_nurse', 'nurse', 'equipment'] },
        ];

        const roleMap = {
            admin: '系统管理员',
            head_nurse: '护士长',
            nurse: '手术室护士',
            equipment: '设备科'
        };

        async function api(url, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
            const res = await fetch(`${API_BASE}${url}`, { ...options, headers });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || '请求失败');
            return data;
        }

        function formatDate(date, withTime = true) {
            if (!date) return '-';
            const d = new Date(date);
            const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
            if (withTime) {
                const h = String(d.getHours()).padStart(2,'0'), min = String(d.getMinutes()).padStart(2,'0');
                return `${y}-${m}-${day} ${h}:${min}`;
            }
            return `${y}-${m}-${day}`;
        }

        function getStatusLabel(s) {
            const m = {draft:'草稿',pending_review:'待审核',reviewed:'已审核',confirmed:'已确认',distributed:'已发放',used:'已使用',returned:'已退回',cancelled:'已取消',scheduled:'已排班',completed:'已完成',pending:'待核验',normal:'正常',expired:'已过期'};
            return m[s] || s;
        }

        function getStatusColor(s) {
            const m = {draft:'bg-gray-200 text-gray-600',pending_review:'bg-orange-100 text-orange-600',reviewed:'bg-blue-100 text-blue-600',confirmed:'bg-green-100 text-green-600',distributed:'bg-blue-100 text-blue-600',used:'bg-gray-200 text-gray-600',returned:'bg-gray-200 text-gray-600',cancelled:'bg-red-100 text-red-600',scheduled:'bg-blue-100 text-blue-600',completed:'bg-green-100 text-green-600',pending:'bg-orange-100 text-orange-600',normal:'bg-green-100 text-green-600',expired:'bg-red-100 text-red-600'};
            return m[s] || 'bg-gray-200 text-gray-600';
        }

        function showToast(msg, type='success') {
            const c = {success:'bg-green-500',error:'bg-red-500',warning:'bg-orange-500',info:'bg-blue-500'};
            const t = document.createElement('div');
            t.className = `fixed top-4 right-4 ${c[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-all transform translate-x-full`;
            t.innerHTML = `<div class="flex items-center gap-2"><i class="fa fa-${type==='success'?'check-circle':'exclamation-circle'}"></i><span>${msg}</span></div>`;
            document.body.appendChild(t);
            setTimeout(()=>t.classList.remove('translate-x-full'), 10);
            setTimeout(()=>{t.classList.add('translate-x-full'); setTimeout(()=>t.remove(), 300);}, 3000);
        }

        function showModal(content) {
            const m = document.createElement('div');
            m.className = 'fixed inset-0 z-50 flex items-center justify-center modal-backdrop';
            m.innerHTML = `<div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto">${content}</div>`;
            m.onclick = (e) => { if(e.target===m) m.remove(); };
            document.body.appendChild(m);
            return m;
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100">
                    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fa fa-medkit text-white text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-gray-800">手术室耗材备包系统</h1>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">用户名</label>
                                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" value="nurse1">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">密码</label>
                                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300" value="123456">
                            </div>
                            <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-blue-600">登 录</button>
                        </form>
                        <div class="mt-6 pt-4 border-t border-gray-100">
                            <p class="text-xs text-gray-400 mb-2">测试账号（密码均为 123456）：</p>
                            <div class="text-xs text-gray-500 space-y-1">
                                <p>admin - 系统管理员 | headnurse - 护士长 | nurse1 - 手术室护士 | equipment1 - 设备科</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            try {
                const res = await api('/auth/login', { method:'POST', body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
                currentUser = res.user;
                authToken = res.token;
                localStorage.setItem('authToken', authToken);
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showToast('登录成功');
                renderApp();
            } catch(err) { showToast(err.message, 'error'); }
        }

        function handleLogout() {
            authToken = null; currentUser = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            renderApp();
        }

        function logout() {
            handleLogout();
        }

        function renderLayout(content) {
            const menus = [
                {id:'dashboard',icon:'fa-tachometer',label:'仪表盘',roles:['admin','head_nurse','nurse','equipment']},
                {id:'schedules',icon:'fa-calendar',label:'手术排班',roles:['admin','head_nurse','nurse','equipment']},
                {id:'packages',icon:'fa-box',label:'耗材备包',roles:['admin','head_nurse','nurse','equipment']},
                {id:'returns',icon:'fa-undo',label:'退包盘点',roles:['admin','head_nurse','nurse','equipment']},
                {id:'inventory',icon:'fa-cubes',label:'库存管理',roles:['admin','head_nurse','nurse','equipment']},
                {id:'reconciliations',icon:'fa-balance-scale',label:'月度对账',roles:['admin','head_nurse','equipment']},
                {id:'import-export',icon:'fa-exchange',label:'导入导出',roles:['admin','head_nurse','equipment']},
            ];
            const allowed = menus.filter(m => m.roles.includes(currentUser.role));
            const roleNames = {admin:'系统管理员',head_nurse:'护士长',nurse:'手术室护士',equipment:'设备科'};
            
            return `
                <div class="flex h-screen">
                    <aside class="w-60 bg-white shadow-sm flex flex-col">
                        <div class="p-4 border-b border-gray-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
                                    <i class="fa fa-medkit text-white"></i>
                                </div>
                                <div><h1 class="font-bold text-gray-800 text-sm">耗材备包系统</h1></div>
                            </div>
                        </div>
                        <nav class="flex-1 py-4 overflow-y-auto">
                            ${allowed.map(m => `<div class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-gray-50 text-gray-600 ${currentPage===m.id?'active':''}" onclick="navigateTo('${m.id}')"><i class="fa ${m.icon} w-5 text-center"></i><span class="text-sm">${m.label}</span></div>`).join('')}
                        </nav>
                        <div class="p-4 border-t border-gray-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                    <span class="text-primary font-medium">${currentUser.realName.charAt(0)}</span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-medium text-gray-700 truncate">${currentUser.realName}</p>
                                    <p class="text-xs text-gray-400">${roleNames[currentUser.role]}</p>
                                </div>
                                <button onclick="handleLogout()" class="text-gray-400 hover:text-red-500"><i class="fa fa-sign-out"></i></button>
                            </div>
                        </div>
                    </aside>
                    <main class="flex-1 overflow-y-auto">${content}</main>
                </div>
            `;
        }

        function navigateTo(page) { currentPage = page; selectedPackageId = null; renderApp(); }

        async function renderDashboard() {
            try {
                const [pkg, sch] = await Promise.all([api('/packages?pageSize=5'), api('/schedules?pageSize=10')]);
                const today = new Date().toISOString().split('T')[0];
                const todaySch = sch.data.filter(s => s.scheduled_start_time.startsWith(today));
                const pending = pkg.data.filter(p => p.status === 'pending_review');

                return `
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <div><h2 class="text-xl font-bold text-gray-800">仪表盘</h2><p class="text-gray-400 text-sm mt-1">欢迎回来，${currentUser.realName}</p></div>
                            <div class="text-sm text-gray-400">${formatDate(new Date())}</div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">今日手术</p><p class="text-2xl font-bold text-gray-800 mt-1">${todaySch.length}</p></div>
                                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center"><i class="fa fa-calendar text-primary text-xl"></i></div>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">待审核备包</p><p class="text-2xl font-bold text-orange-500 mt-1">${pending.length}</p></div>
                                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center"><i class="fa fa-clock-o text-orange-500 text-xl"></i></div>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">总备包数</p><p class="text-2xl font-bold text-gray-800 mt-1">${pkg.total||0}</p></div>
                                    <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa fa-file-text-o text-gray-500 text-xl"></i></div>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-lg shadow-sm">
                                <div class="flex items-center justify-between">
                                    <div><p class="text-gray-400 text-sm">手术间数</p><p class="text-2xl font-bold text-gray-800 mt-1">6</p></div>
                                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center"><i class="fa fa-hospital-o text-green-500 text-xl"></i></div>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="bg-white rounded-lg shadow-sm">
                                <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                                    <h3 class="font-medium text-gray-700">今日手术排班</h3>
                                    <button onclick="navigateTo('schedules')" class="text-sm text-primary hover:underline">查看全部</button>
                                </div>
                                <div class="divide-y divide-gray-50">
                                    ${todaySch.length>0 ? todaySch.map(s=>`
                                        <div class="p-4 flex items-center gap-4 hover:bg-gray-50">
                                            <div class="w-1 h-12 bg-primary rounded-full"></div>
                                            <div class="flex-1 min-w-0">
                                                <p class="font-medium text-gray-700 truncate">${s.surgery_type_name||'未命名'}</p>
                                                <p class="text-sm text-gray-400">${s.patient_name} · ${s.surgeon_name}</p>
                                            </div>
                                            <span class="status-badge ${getStatusColor(s.status)}">${getStatusLabel(s.status)}</span>
                                        </div>
                                    `).join('') : '<div class="p-8 text-center text-gray-400">今日暂无手术</div>'}
                                </div>
                            </div>
                            <div class="bg-white rounded-lg shadow-sm">
                                <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                                    <h3 class="font-medium text-gray-700">最近备包记录</h3>
                                    <button onclick="navigateTo('packages')" class="text-sm text-primary hover:underline">查看全部</button>
                                </div>
                                <div class="divide-y divide-gray-50">
                                    ${pkg.data.length>0 ? pkg.data.map(p=>`
                                        <div class="p-4 flex items-center gap-4 hover:bg-gray-50">
                                            <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center"><i class="fa fa-box text-primary"></i></div>
                                            <div class="flex-1 min-w-0">
                                                <p class="font-medium text-gray-700 truncate">${p.package_name}</p>
                                                <p class="text-sm text-gray-400">${p.preparer_name||'未知'} · ${formatDate(p.created_at)}</p>
                                            </div>
                                            <span class="status-badge ${getStatusColor(p.status)}">${getStatusLabel(p.status)}</span>
                                        </div>
                                    `).join('') : '<div class="p-8 text-center text-gray-400">暂无记录</div>'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch(err) { return `<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`; }
        }

        async function renderSchedules() {
            try {
                const [sch, rooms, types] = await Promise.all([api('/schedules?pageSize=50'), api('/inventory/operating-rooms'), api('/inventory/surgery-types')]);
                window._rooms = rooms.data; window._types = types.data;
                
                return `
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <div><h2 class="text-xl font-bold text-gray-800">手术排班</h2></div>
                            ${['admin','head_nurse'].includes(currentUser.role) ? `<button onclick="showCreateScheduleModal()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-600 flex items-center gap-2"><i class="fa fa-plus"></i>新增排班</button>` : ''}
                        </div>
                        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">排班编号</th>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">术式</th>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">手术间</th>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">患者</th>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">主刀</th>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">时间</th>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">状态</th>
                                        <th class="px-4 py-3 text-left text-xs text-gray-400">操作</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${sch.data.map(s=>`
                                        <tr class="hover:bg-gray-50">
                                            <td class="px-4 py-3 font-mono text-gray-500">${s.schedule_no}</td>
                                            <td class="px-4 py-3">${s.surgery_type_name||'-'}</td>
                                            <td class="px-4 py-3">${s.room_name||'-'}</td>
                                            <td class="px-4 py-3">${s.patient_name}</td>
                                            <td class="px-4 py-3">${s.surgeon_name}</td>
                                            <td class="px-4 py-3 text-gray-500">${formatDate(s.scheduled_start_time)}</td>
                                            <td class="px-4 py-3"><span class="status-badge ${getStatusColor(s.status)}">${getStatusLabel(s.status)}</span></td>
                                            <td class="px-4 py-3">
                                                <div class="flex gap-2">
                                                    <button onclick="viewSchedule('${s.id}')" class="text-primary hover:underline text-xs">详情</button>
                                                    ${['admin','head_nurse'].includes(currentUser.role) && s.status!=='cancelled' && s.status!=='completed' ? `<button onclick="cancelSchedule('${s.id}')" class="text-red-500 hover:underline text-xs">取消</button>` : ''}
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch(err) { return `<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`; }
        }

        function showCreateScheduleModal() {
            const rooms = window._rooms || [], types = window._types || [];
            showModal(`
                <div class="p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-gray-800">新增手术排班</h3>
                        <button onclick="this.closest('.modal-backdrop').remove()" class="text-gray-400"><i class="fa fa-times"></i></button>
                    </div>
                    <form onsubmit="submitSchedule(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-xs text-gray-500">术式 *</label>
                                <select id="surgeryTypeId" required class="w-full px-3 py-2 border rounded text-sm">
                                    <option value="">请选择</option>${types.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
                                </select>
                            </div>
                            <div><label class="text-xs text-gray-500">手术间 *</label>
                                <select id="operatingRoomId" required class="w-full px-3 py-2 border rounded text-sm">
                                    <option value="">请选择</option>${rooms.map(r=>`<option value="${r.id}">${r.room_name}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-xs text-gray-500">患者姓名 *</label><input id="patientName" required class="w-full px-3 py-2 border rounded text-sm"></div>
                            <div><label class="text-xs text-gray-500">主刀医生 *</label><input id="surgeonName" required class="w-full px-3 py-2 border rounded text-sm"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-xs text-gray-500">开始时间 *</label><input type="datetime-local" id="scheduledStartTime" required class="w-full px-3 py-2 border rounded text-sm"></div>
                            <div><label class="text-xs text-gray-500">结束时间 *</label><input type="datetime-local" id="scheduledEndTime" required class="w-full px-3 py-2 border rounded text-sm"></div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="this.closest('.modal-backdrop').remove()" class="px-4 py-2 border rounded text-sm text-gray-500">取消</button>
                            <button type="submit" class="px-4 py-2 bg-primary text-white rounded text-sm">创建</button>
                        </div>
                    </form>
                </div>
            `);
        }

        async function submitSchedule(e) {
            e.preventDefault();
            try {
                await api('/schedules', { method:'POST', body: JSON.stringify({
                    surgeryTypeId: document.getElementById('surgeryTypeId').value,
                    operatingRoomId: document.getElementById('operatingRoomId').value,
                    patientName: document.getElementById('patientName').value,
                    surgeonName: document.getElementById('surgeonName').value,
                    scheduledStartTime: document.getElementById('scheduledStartTime').value,
                    scheduledEndTime: document.getElementById('scheduledEndTime').value,
                })});
                showToast('创建成功');
                document.querySelector('.modal-backdrop').remove();
                renderApp();
            } catch(err) { showToast(err.message, 'error'); }
        }

        async function viewSchedule(id) {
            try {
                const res = await api(`/schedules/${id}`);
                const s = res.data;
                showModal(`
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-gray-800">排班详情</h3>
                            <button onclick="this.closest('.modal-backdrop').remove()" class="text-gray-400"><i class="fa fa-times"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-sm mb-4">

        async function submitReturn(e, packageId) {
            e.preventDefault();
            try {
                const qtyInputs = document.querySelectorAll('.ret-qty');
                const items = [];
                qtyInputs.forEach(input => {
                    const qty = parseInt(input.value);
                    if (qty > 0) {
                        items.push({
                            packageItemId: input.dataset.itemId,
                            supplyItemId: input.dataset.supply,
                            batchId: input.dataset.batch,
                            quantityReturned: qty,
                            condition: 'good',
                            isRestockable: true
                        });
                    }
                });
                if (items.length === 0) { showToast('请选择退回的耗材', 'warning'); return; }
                await api('/returns', {method:'POST',body:JSON.stringify({

                })});
                showToast('退包已提交');
                document.querySelector('.modal-backdrop').remove();
                currentPage = 'returns'; renderApp();
            } catch(err) { showToast(err.message, 'error'); }
        }

        async function renderView() {

                switch(currentView) {
                    case 'dashboard': content = await renderDashboard(); break;
                    case 'schedules': content = await renderSchedules(); break;
                    case 'packages': content = await renderPackages(); break;
                    case 'returns': content = await renderReturns(); break;
                    case 'inventory': content = await renderInventory(); break;
                    case 'reconciliations': content = await renderReconciliations(); break;
                    case 'importExport': content = await renderImportExport(); break;
                    case 'notifications': content = await renderNotifications(); break;
                    default: content = await renderDashboard();
                }
                mainContent.innerHTML = content;
            } catch(err) {
                mainContent.innerHTML = `<div class="p-6"><div class="bg-white p-8 rounded-lg text-center text-red-400">加载失败: ${err.message}</div></div>`;
            }
        }

        function navigateTo(view) {
            currentView = view;
            renderApp();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-green-500', error: 'bg-red-500', 
                warning: 'bg-yellow-500', info: 'bg-blue-500'
            };
            const icons = {
                success: 'fa-check-circle', error: 'fa-times-circle',
                warning: 'fa-exclamation-triangle', info: 'fa-info-circle'
            };
            const toast = document.createElement('div');
            toast.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center animate-slideIn`;
            toast.innerHTML = `<i class="fas ${icons[type]} mr-2"></i>${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showModal(title, content, actions = []) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-40" onclick="if(event.target===this)closeModal()">
                    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full mx-4 max-h-[80vh] overflow-auto">
                        <div class="flex items-center justify-between p-4 border-b">
                            <h3 class="text-lg font-semibold">${title}</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="p-4">${content}</div>
                        <div class="flex justify-end gap-2 p-4 border-t bg-gray-50">
                            ${actions.map(a => `<button onclick="${a.action}" class="${a.class || 'px-4 py-2 rounded text-sm'}">${a.label}</button>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function formatDate(dateStr, showTime = true) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            const date = d.toISOString().slice(0,10);
            if (!showTime) return date;
            return `${date} ${d.toTimeString().slice(0,5)}`;
        }

        async function checkNotifications() {
            if (!currentUser) return;
            try {
                const res = await api('/notifications?unread=true&pageSize=10');
                const notifications = res.data || [];
                unreadCount = notifications.length;
                if (unreadCount > 0 && currentView !== 'notifications') {
                    notifications.slice(0, 2).forEach(n => {
                        showToast(n.message, 'info');
                    });
                }
            } catch(e) {}
        }

        setInterval(checkNotifications, 60000);
        renderApp();
