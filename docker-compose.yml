version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: email-generator-postgres
    environment:
      POSTGRES_DB: email_generator
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - email-generator-network

  redis:
    image: redis:7-alpine
    container_name: email-generator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - email-generator-network

volumes:
  postgres-data:
  redis-data:

networks:
  email-generator-network:
    driver: bridge
