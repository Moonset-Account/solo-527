version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dental_clinic
      POSTGRES_USER: dental_user
      POSTGRES_PASSWORD: dental_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=dental_clinic
      - DB_USER=dental_user
      - DB_PASSWORD=dental_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    command: celery -A dental_clinic worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DB_NAME=dental_clinic
      - DB_USER=dental_user
      - DB_PASSWORD=dental_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
    depends_on:
      - db
      - redis

  celery_beat:
    build: ./backend
    command: celery -A dental_clinic beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DB_NAME=dental_clinic
      - DB_USER=dental_user
      - DB_PASSWORD=dental_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
