version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: reagent-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: reagent
    volumes:
      - ./data/mongodb:/data/db

  redis:
    image: redis:7
    container_name: reagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - ./data/redis:/data
