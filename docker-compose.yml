# ========================================
# 仓库SKU周转与滞销分析 - Docker Compose 部署
# Apache Superset + ClickHouse + PostgreSQL + Redis
# ========================================

version: '3.8'

x-superset-env: &superset-env
  SUPERSET_ENV: production
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-inventory-analysis-superset-secret-key}
  SUPERSET_META_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-25}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-superset@example.com}

services:
  # ========================================
  # PostgreSQL - 业务库 + Superset元数据库
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: inventory
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  # ========================================
  # ClickHouse - OLAP分析引擎
  # ========================================
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: inventory-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: inventory_analysis
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config:/etc/clickhouse-server/config.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "${CH_HTTP_PORT:-8123}:8123"
      - "${CH_TCP_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  # ========================================
  # Redis - 缓存 + Celery Broker
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  # ========================================
  # Superset - 初始化
  # ========================================
  superset-init:
    image: apache/superset:3.0.0
    container_name: inventory-superset-init
    command: >
      bash -c "
        superset db upgrade &&
        superset init &&
        superset fab create-admin \
          --username ${SUPERSET_ADMIN_USER:-admin} \
          --password ${SUPERSET_ADMIN_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --email admin@example.com || true
      "
    environment:
      <<: *superset-env
    volumes:
      - ./superset/config:/app/pythonpath
      - superset_home:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inventory-network

  # ========================================
  # Superset - Web服务
  # ========================================
  superset:
    image: apache/superset:3.0.0
    container_name: inventory-superset
    restart: unless-stopped
    command: ["gunicorn", "-w", "4", "-k", "gevent", "--timeout", "120", "--bind", "0.0.0.0:8088", "superset.app:create_app()"]
    environment:
      <<: *superset-env
    volumes:
      - ./superset/config:/app/pythonpath
      - ./superset/dashboards:/app/dashboards
      - superset_home:/app/superset_home
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - inventory-network

  # ========================================
  # Superset - Celery Worker
  # ========================================
  superset-worker:
    image: apache/superset:3.0.0
    container_name: inventory-superset-worker
    restart: unless-stopped
    command: ["celery", "--app", "superset.tasks.celery_app:app", "worker", "--pool", "prefork", "-O", "fair", "--loglevel", "INFO"]
    environment:
      <<: *superset-env
    volumes:
      - ./superset/config:/app/pythonpath
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - inventory-network

  # ========================================
  # Superset - Celery Beat (定时任务)
  # ========================================
  superset-beat:
    image: apache/superset:3.0.0
    container_name: inventory-superset-beat
    restart: unless-stopped
    command: ["celery", "--app", "superset.tasks.celery_app:app", "beat", "--loglevel", "INFO"]
    environment:
      <<: *superset-env
    volumes:
      - ./superset/config:/app/pythonpath
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - inventory-network

  # ========================================
  # ETL 任务执行器 (可选，用于手动同步)
  # ========================================
  etl-runner:
    image: python:3.11-slim
    container_name: inventory-etl-runner
    working_dir: /opt/etl
    command: ["tail", "-f", "/dev/null"]
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: inventory
      PG_USER: postgres
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_DATABASE: inventory_analysis
      CH_USER: default
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./etl:/opt/etl
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - inventory-network

  # ========================================
  # Airflow (可选，用于复杂调度)
  # ========================================
  # 如需启用Airflow，取消下面的注释并配置

  # airflow-webserver:
  #   image: apache/airflow:2.7.0
  #   container_name: inventory-airflow-webserver
  #   command: webserver
  #   ...

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  redis_data:
    driver: local
  superset_home:
    driver: local

networks:
  inventory-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
