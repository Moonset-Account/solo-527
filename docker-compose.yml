version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: item-closure-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: item-closure
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7
    container_name: item-closure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: item-closure-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/item-closure
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-secret-key-here-change-in-production
      JWT_EXPIRES_IN: 2h
      JWT_REFRESH_EXPIRES_IN: 7d
      UPLOAD_DIR: ./uploads
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: item-closure-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongodb_data:
  redis_data:
