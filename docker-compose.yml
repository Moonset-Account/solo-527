version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharm-trace-db
    environment:
      POSTGRES_USER: ${DB_USER:-pharmadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pharmadmin123}
      POSTGRES_DB: ${DB_NAME:-pharm_trace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pharmadmin} -d ${DB_NAME:-pharm_trace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharm-trace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharm-trace-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-pharmadmin}
      - DB_PASSWORD=${DB_PASSWORD:-pharmadmin123}
      - DB_NAME=${DB_NAME:-pharm_trace}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharm-trace-celery-worker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-pharmadmin}
      - DB_PASSWORD=${DB_PASSWORD:-pharmadmin123}
      - DB_NAME=${DB_NAME:-pharm_trace}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_worker.celery worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharm-trace-celery-beat
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-pharmadmin}
      - DB_PASSWORD=${DB_PASSWORD:-pharmadmin123}
      - DB_NAME=${DB_NAME:-pharm_trace}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_worker.celery beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharm-trace-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    command: yarn dev

volumes:
  postgres_data:
  redis_data:
