<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset"
  >
    <div class="sidenav-header">
      <h2>租赁管理系统</h2>
    </div>
    <div class="sidenav-menu">
      <mat-accordion class="menu-accordion">
        <mat-expansion-panel
          *ngFor="let group of menuGroups"
          [expanded]="group.expanded"
          class="menu-group"
        >
          <mat-expansion-panel-header class="group-header">
            <mat-panel-title class="group-title">
              {{ group.title }}
            </mat-panel-title>
          </mat-expansion-panel-header>
          <mat-nav-list class="menu-list">
            <a
              mat-list-item
              *ngFor="let item of group.items"
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="menu-item"
              (click)="onMenuItemClick(drawer)"
            >
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          </mat-nav-list>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="isHandset"
      >
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span class="toolbar-title">租赁管理系统</span>
      <span class="spacer"></span>
      <button mat-icon-button>
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-icon-button>
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
