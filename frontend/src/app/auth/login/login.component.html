<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <mat-icon class="login-icon">security</mat-icon>
      <mat-card-title>IT账号巡检任务站</mat-card-title>
      <mat-card-subtitle>请登录您的账号</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>用户名</mat-label>
          <input matInput formControlName="username" placeholder="请输入用户名" />
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="form.get('username')?.hasError('required')">请输入用户名</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>密码</mat-label>
          <input matInput type="password" formControlName="password" placeholder="请输入密码" />
          <mat-icon matSuffix>lock</mat-icon>
          <mat-error *ngIf="form.get('password')?.hasError('required')">请输入密码</mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="error">
          <mat-icon>error</mat-icon>
          {{ error }}
        </div>

        <button mat-raised-button color="primary" type="submit" class="full-width login-btn" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20" class="btn-spinner"></mat-spinner>
          <span *ngIf="!loading">登 录</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
