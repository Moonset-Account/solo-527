<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav [mode]="'side'" [opened]="true" class="app-sidenav">
    <div class="sidenav-header">
      <mat-icon class="sidenav-logo">security</mat-icon>
      <span class="sidenav-title">IT账号巡检</span>
    </div>
    <mat-nav-list>
      @for (item of filteredNavItems; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-btn" [matTooltip]="'切换菜单'">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">IT账号巡检任务站</span>
      <span class="spacer"></span>
      <span class="user-info" *ngIf="currentUser">
        <mat-icon>person</mat-icon>
        {{ currentUser.displayName }}
      </span>
      <button mat-icon-button [matTooltip]="'退出登录'" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
