<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>连锁口腔处方收费台系统</mat-card-title>
      <mat-card-subtitle>请登录您的账户</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>用户名</mat-label>
          <input matInput formControlName="username" placeholder="请输入用户名" required>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            请输入用户名
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>密码</mat-label>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" placeholder="请输入密码" required>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            请输入密码
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width login-button"
          [disabled]="loginForm.invalid || loading">
          <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
          <span *ngIf="!loading">登 录</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <p class="footer-text">© 2024 连锁口腔管理系统 v1.0</p>
    </mat-card-footer>
  </mat-card>
</div>
