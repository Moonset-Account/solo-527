<div class="container">
  <app-page-header [title]="isEdit ? '编辑催办任务' : '新增催办任务'"></app-page-header>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="reminderForm" (ngSubmit)="onSubmit()" class="form-container">
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>任务类型</mat-label>
            <mat-select formControlName="type" required>
              <mat-option *ngFor="let type of typeOptions" [value]="type.value">{{ type.label }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>关联ID</mat-label>
            <input matInput formControlName="relatedId" type="number" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>患者ID</mat-label>
            <input matInput formControlName="patientId" type="number" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>患者姓名</mat-label>
            <input matInput formControlName="patientName" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>联系电话</mat-label>
            <input matInput formControlName="patientPhone" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>负责人ID</mat-label>
            <input matInput formControlName="assignedTo" type="number" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>负责人姓名</mat-label>
            <input matInput formControlName="assignedToName" required>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>任务标题</mat-label>
          <input matInput formControlName="title" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>任务内容</mat-label>
          <textarea matInput formControlName="content" rows="4" required></textarea>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>优先级</mat-label>
            <mat-select formControlName="priority" required>
              <mat-option *ngFor="let priority of priorityOptions" [value]="priority.value">{{ priority.label }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>截止日期</mat-label>
            <input matInput [matDatepicker]="dueDatePicker" formControlName="dueDate" required>
            <mat-datepicker-toggle matSuffix [for]="dueDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #dueDatePicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" *ngIf="isEdit">
            <mat-label>状态</mat-label>
            <mat-select formControlName="status">
              <mat-option *ngFor="let status of statusOptions" [value]="status.value">{{ status.label }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>备注</mat-label>
          <textarea matInput formControlName="remarks" rows="3"></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" (click)="onCancel()">取消</button>
          <button
            *ngIf="isEdit && reminder?.status !== 'completed' && reminder?.status !== 'cancelled'"
            mat-raised-button
            color="accent"
            type="button"
            (click)="onSendReminder()">
            <mat-icon>send</mat-icon>
            发送提醒
          </button>
          <button
            *ngIf="isEdit && reminder?.status !== 'completed' && reminder?.status !== 'cancelled'"
            mat-raised-button
            color="primary"
            type="button"
            (click)="onComplete()">
            <mat-icon>check_circle</mat-icon>
            标记完成
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="reminderForm.invalid">
            {{ isEdit ? '更新' : '创建' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
