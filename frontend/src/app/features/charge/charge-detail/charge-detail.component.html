<div class="container">
  <app-page-header [title]="isView ? '查看收费详情' : (isEdit ? '编辑收费' : '新增收费')"></app-page-header>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="chargeForm" (ngSubmit)="onSubmit()" class="form-container">
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>患者ID</mat-label>
            <input matInput formControlName="patientId" type="number" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>患者姓名</mat-label>
            <input matInput formControlName="patientName" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>关联处方ID</mat-label>
            <input matInput formControlName="prescriptionId" type="number">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>支付方式</mat-label>
            <mat-select formControlName="paymentMethod" required>
              <mat-option *ngFor="let method of paymentMethods" [value]="method.value">{{ method.label }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="form-row" *ngIf="isEdit || isView">
          <mat-form-field appearance="outline">
            <mat-label>状态</mat-label>
            <mat-select formControlName="status">
              <mat-option *ngFor="let status of statusOptions" [value]="status.value">{{ status.label }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-divider style="margin: 16px 0;"></mat-divider>

        <div class="items-header">
          <h3>收费项目</h3>
          <button
            *ngIf="!isView"
            mat-raised-button
            color="primary"
            type="button"
            (click)="addItem()">
            <mat-icon>add</mat-icon>
            添加项目
          </button>
        </div>

        <div formArrayName="items">
          <div
            *ngFor="let item of items.controls; let i = index"
            [formGroupName]="i"
            class="item-row">
            <div class="item-row-header">
              <span>项目 {{ i + 1 }}</span>
              <button
                *ngIf="!isView"
                mat-icon-button
                color="warn"
                type="button"
                (click)="removeItem(i)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>

            <div class="form-row">
              <mat-form-field appearance="outline">
                <mat-label>项目名称</mat-label>
                <input matInput formControlName="itemName" required>
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>项目类型</mat-label>
                <mat-select formControlName="itemType" required>
                  <mat-option *ngFor="let type of itemTypes" [value]="type.value">{{ type.label }}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <div class="form-row">
              <mat-form-field appearance="outline">
                <mat-label>数量</mat-label>
                <input matInput formControlName="quantity" type="number" min="1" required>
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>单价 (¥)</mat-label>
                <input matInput formControlName="unitPrice" type="number" min="0" step="0.01" required>
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>折扣 (%)</mat-label>
                <input matInput formControlName="discount" type="number" min="0" max="100" step="0.1">
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>应收 (¥)</mat-label>
                <input matInput formControlName="totalPrice" readonly>
              </mat-form-field>

              <mat-form-field appearance="outline">
                <mat-label>实收 (¥)</mat-label>
                <input matInput formControlName="actualPrice" readonly>
              </mat-form-field>
            </div>
          </div>
        </div>

        <mat-divider style="margin: 16px 0;"></mat-divider>

        <div class="summary-section">
          <div class="summary-row">
            <span class="summary-label">应收总额：</span>
            <span class="summary-value">¥{{ totalAmount.toFixed(2) }}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">优惠金额：</span>
            <span class="summary-value discount">-¥{{ discountAmount.toFixed(2) }}</span>
          </div>
          <div class="summary-row total">
            <span class="summary-label">实收总额：</span>
            <span class="summary-value">¥{{ actualAmount.toFixed(2) }}</span>
          </div>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>备注</mat-label>
          <textarea matInput formControlName="remarks" rows="3"></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" (click)="onCancel()">取消</button>
          <button
            *ngIf="isEdit && charge?.status === 'paid'"
            mat-raised-button
            color="accent"
            type="button"
            (click)="onCheckAccuracy()">
            <mat-icon>check_circle</mat-icon>
            准确性检查
          </button>
          <button
            *ngIf="!isView"
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="chargeForm.invalid || items.length === 0">
            {{ isEdit ? '更新' : '创建' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
