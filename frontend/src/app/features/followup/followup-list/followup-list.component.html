<div class="container">
  <div class="page-header">
    <h1 class="page-title">随访管理</h1>
    <div class="header-actions">
      <button mat-raised-button color="accent" (click)="onGenerateFollowUps()">
        <mat-icon>auto_awesome</mat-icon>
        自动生成
      </button>
      <button mat-raised-button color="primary" routerLink="new">
        <mat-icon>add</mat-icon>
        新增随访
      </button>
    </div>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="filterForm" (ngSubmit)="onSearch()" class="filter-bar">
        <mat-form-field appearance="outline">
          <mat-label>患者姓名</mat-label>
          <input matInput formControlName="patientName" placeholder="请输入患者姓名">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>治疗类型</mat-label>
          <input matInput formControlName="treatmentType" placeholder="请输入治疗类型">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>随访类型</mat-label>
          <mat-select formControlName="followUpType">
            <mat-option value="">全部</mat-option>
            <mat-option *ngFor="let type of followUpTypeOptions" [value]="type.value">{{ type.label }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>状态</mat-label>
          <mat-select formControlName="status">
            <mat-option value="">全部</mat-option>
            <mat-option *ngFor="let status of statusOptions" [value]="status.value">{{ status.label }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>开始日期</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate">
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>结束日期</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate">
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>

        <div class="filter-actions">
          <button mat-raised-button color="primary" type="submit">
            <mat-icon>search</mat-icon>
            查询
          </button>
          <button mat-button type="button" (click)="onReset()">
            <mat-icon>refresh</mat-icon>
            重置
          </button>
        </div>
      </form>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" matSort class="full-width">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
          </ng-container>

          <ng-container matColumnDef="patientName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>患者姓名</th>
            <td mat-cell *matCellDef="let element">{{ element.patientName }}</td>
          </ng-container>

          <ng-container matColumnDef="treatmentType">
            <th mat-header-cell *matHeaderCellDef>治疗类型</th>
            <td mat-cell *matCellDef="let element">{{ element.treatmentType }}</td>
          </ng-container>

          <ng-container matColumnDef="followUpType">
            <th mat-header-cell *matHeaderCellDef>随访类型</th>
            <td mat-cell *matCellDef="let element">
              <app-status-badge [status]="element.followUpType"></app-status-badge>
            </td>
          </ng-container>

          <ng-container matColumnDef="followUpDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>随访日期</th>
            <td mat-cell *matCellDef="let element">{{ element.followUpDate }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>状态</th>
            <td mat-cell *matCellDef="let element">
              <app-status-badge [status]="element.status"></app-status-badge>
            </td>
          </ng-container>

          <ng-container matColumnDef="assignedToName">
            <th mat-header-cell *matHeaderCellDef>负责人</th>
            <td mat-cell *matCellDef="let element">{{ element.assignedToName }}</td>
          </ng-container>

          <ng-container matColumnDef="attempts">
            <th mat-header-cell *matHeaderCellDef>联系次数</th>
            <td mat-cell *matCellDef="let element">{{ element.attempts }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>操作</th>
            <td mat-cell *matCellDef="let element">
              <div class="action-buttons">
                <button
                  mat-icon-button
                  color="primary"
                  (click)="onEdit(element.id)"
                  matTooltip="查看/编辑">
                  <mat-icon>edit</mat-icon>
                </button>
                <button
                  *ngIf="element.status !== 'completed' && element.status !== 'cancelled'"
                  mat-icon-button
                  color="accent"
                  (click)="onRecordContact(element.id)"
                  matTooltip="记录联系">
                  <mat-icon>phone</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <mat-paginator
        [length]="total"
        [pageSize]="pageSize"
        [pageIndex]="page - 1"
        [pageSizeOptions]="[10, 20, 50, 100]"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
