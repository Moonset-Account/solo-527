version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: expense-postgres
    environment:
      POSTGRES_DB: expense_approval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - expense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    container_name: expense-redis
    command: redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - expense-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    container_name: expense-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expense_approval
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-here}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - expense-network

  frontend:
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    container_name: expense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - expense-network

volumes:
  postgres-data:
  redis-data:

networks:
  expense-network:
    driver: bridge
