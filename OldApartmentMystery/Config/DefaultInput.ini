; -------- 输入映射（供 Enhanced Input 使用，具体在 IMC_Player.uasset 中定义） --------
; 移动:   W/A/S/D → Move (Axis2D)
; 视角:   MouseXY → Look (Axis2D)
; 交互:   E / 鼠标左键 → Interact (Action)
; 笔记本: N → ToggleNotebook (Action)
; 物品:   I → ToggleInventory (Action)
; 暂停:   ESC → Pause (Action)
; 数字0-9 → Digit0~Digit9 (Action) 用于谜题输入
; 取消:   鼠标右键 → Back (Action) 关闭 UI / 放弃谜题
