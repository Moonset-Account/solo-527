{% extends "admin_base.html" %}
{% block title %}触达任务{% endblock %}
{% block page_title %}📣 触达任务管理{% endblock %}
{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center">
    <div class="flex gap-3 flex-wrap">
        <input id="f-kw" placeholder="搜索任务名/编码" class="px-3 py-2 border rounded-lg text-sm w-64">
        <select id="f-status" class="px-3 py-2 border rounded-lg text-sm">
            <option value="">全部状态</option><option value="draft">草稿</option><option value="approved">已审批</option>
            <option value="running">进行中</option><option value="completed">已完成</option><option value="cancelled">已取消</option>
        </select>
        <button onclick="load()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">查询</button>
    </div>
    <button onclick="showForm()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm">+ 新建触达任务</button>
</div>
<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b"><tr>
            <th class="px-4 py-3 text-left">编码</th><th class="px-4 py-3 text-left">任务名称</th>
            <th class="px-4 py-3 text-center">类型</th><th class="px-4 py-3 text-center">渠道</th>
            <th class="px-4 py-3 text-center">目标/已发</th><th class="px-4 py-3 text-right">转化率</th>
            <th class="px-4 py-3 text-right">预估成本</th><th class="px-4 py-3 text-center">冲突</th>
            <th class="px-4 py-3 text-center">状态</th><th class="px-4 py-3 text-center">操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="10" class="text-center py-12 text-gray-400">加载中...</td></tr></tbody>
    </table>
</div>
<script>
const statusMap={draft:['草稿','bg-gray-100 text-gray-600'],approved:['已审批','bg-blue-100 text-blue-600'],
    pending:['待审批','bg-yellow-100 text-yellow-600'],running:['进行中','bg-green-100 text-green-600'],
    completed:['已完成','bg-purple-100 text-purple-600'],cancelled:['已取消','bg-red-100 text-red-500']};
const typeMap={coupon:'发券',points:'积分',benefit:'权益',sms:'短信',push:'推送',wechat:'微信'};
async function load(){
    const kw=document.getElementById('f-kw').value;const st=document.getElementById('f-status').value;
    let url='/api/reach-tasks?limit=100';if(kw)url+=`&keyword=${encodeURIComponent(kw)}`;if(st)url+=`&status=${st}`;
    const r=await fetch(url,{credentials:'include'});if(!r.ok)return;const list=await r.json();
    document.getElementById('tbody').innerHTML=list.length?list.map(t=>{const [slabel,scls]=statusMap[t.status]||[t.status,'bg-gray-100'];return`
        <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-3 font-mono">${t.code}</td>
            <td class="px-4 py-3 font-medium">${t.name}</td>
            <td class="px-4 py-3 text-center">${typeMap[t.task_type]||t.task_type}</td>
            <td class="px-4 py-3 text-center text-xs text-gray-500">${(t.channels||[]).join('/')||'-'}</td>
            <td class="px-4 py-3 text-center">${t.sent_count||0} / ${t.target_count||0}</td>
            <td class="px-4 py-3 text-right font-medium ${t.conversion_rate>0.05?'text-green-600':''}">${(t.conversion_rate*100).toFixed(2)}%</td>
            <td class="px-4 py-3 text-right">¥${(t.estimated_budget||0).toFixed(2)}</td>
            <td class="px-4 py-3 text-center">${t.is_conflict_checked?'<span class="text-green-500">✓</span>':'<span class="text-red-500" title="存在冲突">⚠</span>'}</td>
            <td class="px-4 py-3 text-center"><span class="text-xs px-2 py-0.5 rounded ${scls}">${slabel}</span></td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                ${t.status==='draft'?`<button onclick="approveTask(${t.id})" class="text-green-500 hover:underline mr-2">审批</button>`:''}
                ${t.status==='approved'?`<button onclick="startTask(${t.id})" class="text-blue-500 hover:underline mr-2">启动</button>`:''}
                <button onclick="showDetail(${t.id})" class="text-gray-500 hover:underline mr-2">详情</button>
                <button onclick="showVersions(${t.id})" class="text-blue-500 hover:underline">历史</button>
            </td>
        </tr>`;}).join(''):'<tr><td colspan="10" class="text-center py-12 text-gray-400">暂无数据</td></tr>';
}
async function showDetail(id){
    const r=await fetch(`/api/reach-tasks/${id}`,{credentials:'include'});if(!r.ok)return;const t=await r.json();
    const [slabel,scls]=statusMap[t.status]||[t.status,'bg-gray-100'];
    openModal('任务详情 - '+t.name,`
        <div class="space-y-3 text-sm">
            <div class="grid grid-cols-2 gap-3">
                <div><div class="text-gray-400">编码</div><div class="font-mono">${t.code}</div></div>
                <div><div class="text-gray-400">状态</div><div><span class="text-xs px-2 py-0.5 rounded ${scls}">${slabel}</span></div></div>
                <div><div class="text-gray-400">类型</div><div>${typeMap[t.task_type]||t.task_type}</div></div>
                <div><div class="text-gray-400">渠道</div><div>${(t.channels||[]).join('、')||'-'}</div></div>
            </div>
            <div><div class="text-gray-400">人群ID</div><div>${t.crowd_id}</div></div>
            ${t.remark?`<div><div class="text-gray-400">备注</div><div class="bg-yellow-50 p-2 rounded">${t.remark}</div></div>`:''}
            <div class="bg-blue-50 p-3 rounded">
                <div class="font-medium mb-2">📊 效果数据</div>
                <div class="grid grid-cols-4 gap-2 text-center">
                    <div><div class="text-xs text-gray-400">目标</div><div class="font-bold">${t.target_count||0}</div></div>
                    <div><div class="text-xs text-gray-400">发送</div><div class="font-bold text-blue-600">${t.sent_count||0}</div></div>
                    <div><div class="text-xs text-gray-400">点击</div><div class="font-bold text-green-600">${t.clicked_count||0}</div></div>
                    <div><div class="text-xs text-gray-400">转化</div><div class="font-bold text-purple-600">${t.converted_count||0}</div></div>
                </div>
                <div class="mt-2 text-center text-xs">转化率: <span class="font-bold text-orange-600">${(t.conversion_rate*100).toFixed(2)}%</span> · 成本: ¥${(t.actual_cost||0).toFixed(2)}</div>
            </div>
            <div class="text-xs text-gray-400 grid grid-cols-2 gap-2">
                <div>创建: ${fmt(t.created_at)}</div><div>审批: ${fmt(t.approved_at)}</div>
                <div>启动: ${fmt(t.started_at)}</div><div>完成: ${fmt(t.completed_at)}</div>
            </div>
            <div id="task-attachments"></div><div id="task-notes"></div>
        </div>`);
    setTimeout(()=>{loadAttachments('reach_task',id,'task-attachments');loadNotes('reach_task',id,'task-notes');},100);
}
async function loadAttachments(type,id,elId){
    const r=await fetch(`/api/attachments?entity_type=${type}&entity_id=${id}`,{credentials:'include'});if(!r.ok)return;const list=await r.json();if(!list.length)return;
    document.getElementById(elId).innerHTML=`<div class="pt-3 border-t"><div class="text-sm font-medium mb-2">📎 附件</div><div class="flex flex-wrap gap-2">${list.map(a=>`<a href="${a.download_url}" class="bg-gray-100 px-3 py-2 rounded-lg text-xs hover:bg-gray-200">📄 ${a.file_name}</a>`).join('')}</div></div>`;
}
async function loadNotes(type,id,elId){
    const r=await fetch(`/api/notes?entity_type=${type}&entity_id=${id}`,{credentials:'include'});if(!r.ok)return;const list=await r.json();if(!list.length)return;
    document.getElementById(elId).innerHTML=`<div class="pt-3 border-t"><div class="text-sm font-medium mb-2">💬 备注</div><div class="space-y-2">${list.map(n=>`<div class="bg-blue-50 p-2 rounded text-xs"><div>${n.content}</div><div class="text-gray-400 mt-1">${fmt(n.created_at)}</div></div>`).join('')}</div></div>`;
}
function showForm(){
    fetch('/api/crowds?limit=100',{credentials:'include'}).then(r=>r.json()).then(crowds=>{
        fetch('/api/coupons?limit=100',{credentials:'include'}).then(r=>r.json()).then(coupons=>{
            openModal('新建触达任务',`
                <div class="space-y-3">
                    <div><label class="text-sm text-gray-600">任务名称*</label><input id="t-name" class="w-full px-3 py-2 border rounded text-sm"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-sm text-gray-600">任务类型*</label>
                            <select id="t-type" class="w-full px-3 py-2 border rounded text-sm">
                                <option value="coupon">发复购券</option><option value="points">积分奖励</option>
                                <option value="benefit">权益发放</option><option value="sms">短信触达</option><option value="wechat">微信触达</option>
                            </select></div>
                        <div><label class="text-sm text-gray-600">目标人群*</label>
                            <select id="t-crowd" class="w-full px-3 py-2 border rounded text-sm">${crowds.map(c=>`<option value="${c.id}">${c.name} (${c.actual_count}人)</option>`).join('')}</select></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-sm text-gray-600">关联券模板</label>
                            <select id="t-coupon" class="w-full px-3 py-2 border rounded text-sm"><option value="">--无--</option>${coupons.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
                        <div><label class="text-sm text-gray-600">积分奖励</label><input id="t-points" type="number" class="w-full px-3 py-2 border rounded text-sm" value="0"></div>
                    </div>
                    <div><label class="text-sm text-gray-600">渠道(多选逗号分隔，sms/wechat/push/email)</label>
                        <input id="t-channels" class="w-full px-3 py-2 border rounded text-sm" value="sms,wechat"></div>
                    <div><label class="text-sm text-gray-600">预估成本(元)</label><input id="t-budget" type="number" step="0.01" class="w-full px-3 py-2 border rounded text-sm" value="0"></div>
                    <div><label class="text-sm text-gray-600">备注</label><textarea id="t-remark" rows="2" class="w-full px-3 py-2 border rounded text-sm"></textarea></div>
                    <button onclick="submitForm()" class="w-full py-2 bg-blue-600 text-white rounded-lg">创建</button>
                </div>`);});});
}
async function submitForm(){
    const body={name:document.getElementById('t-name').value,task_type:document.getElementById('t-type').value,
        crowd_id:parseInt(document.getElementById('t-crowd').value),
        coupon_template_id:parseInt(document.getElementById('t-coupon').value)||null,
        points_reward:parseInt(document.getElementById('t-points').value)||0,
        channels:document.getElementById('t-channels').value.split(/[,，\s]+/).filter(Boolean),
        estimated_budget:parseFloat(document.getElementById('t-budget').value)||0,
        remark:document.getElementById('t-remark').value};
    const r=await fetch('/api/reach-tasks',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    if(r.ok){showToast('创建成功','success');closeModal();load();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
async function approveTask(id){
    if(!confirm('确认审批通过该任务？'))return;
    const r=await fetch(`/api/reach-tasks/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',
        body:JSON.stringify({status:'approved',change_summary:'审批通过'})});
    if(r.ok){showToast('审批成功','success');load();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
async function startTask(id){
    if(!confirm('确认启动该触达任务？'))return;
    const r=await fetch(`/api/reach-tasks/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',
        body:JSON.stringify({status:'running',change_summary:'启动任务'})});
    if(r.ok){showToast('已启动','success');load();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
async function showVersions(id){const r=await fetch(`/api/reach-tasks/versions/${id}`,{credentials:'include'});if(!r.ok)return;const v=await r.json();
    openModal('历史版本',`<div class="space-y-3 max-h-96 overflow-y-auto">${v.map(x=>`
        <div class="p-3 bg-gray-50 rounded border-l-4 border-blue-400">
            <div class="flex justify-between text-sm"><span class="font-medium">v${x.version} - ${x.name||''}</span><span class="text-gray-400">${fmt(x.created_at)}</span></div>
            <div class="text-xs text-gray-500 mt-1">${x.change_summary||''}</div>
        </div>`).join('')||'<div class="text-gray-400 text-center py-6">暂无版本</div>'}</div>`);}
load();
</script>
{% endblock %}
