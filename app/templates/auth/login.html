<div class="login-container">
    <div class="login-card">
        <h1>🌾 青禾运维工单台</h1>
        <p class="subtitle">IT账号运维工单管理系统</p>
        {% if error %}
        <div class="error-msg">用户名或密码错误，请重试</div>
        {% endif %}
        <form action="/auth/login" method="post" hx-post="/auth/login">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">登 录</button>
        </form>
    </div>
</div>
