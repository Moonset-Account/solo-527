<tr class="hover:bg-blue-50/40 {% if loop.index is even %}bg-gray-50/50{% endif %}" data-invoice-id="{{ inv.id }}">
  <td class="px-4 py-3 font-medium text-gray-900">{{ inv.company_name }}</td>
  <td class="px-4 py-3 text-gray-600 font-mono text-xs">{{ inv.tax_id or '-' }}</td>
  <td class="px-4 py-3">
    {% if inv.is_default %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">默认</span>
    {% else %}
    <span class="text-gray-400 text-xs">否</span>
    {% endif %}
  </td>
  <td class="px-4 py-3">
    {% if inv.is_active %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">启用</span>
    {% else %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">停用</span>
    {% endif %}
  </td>
  <td class="px-4 py-3">
    <div class="flex items-center gap-2">
      {% if not inv.is_default %}
      <button hx-post="/billing/htmx/invoices/{{ inv.id }}/default"
        hx-target="closest tr"
        hx-swap="outerHTML"
        class="text-xs px-2 py-1 rounded border border-blue-300 text-blue-600 hover:bg-blue-50">
        设为默认
      </button>
      {% endif %}
      <button hx-post="/billing/htmx/invoices/{{ inv.id }}/toggle"
        hx-target="closest tr"
        hx-swap="outerHTML"
        class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">
        {{ '停用' if inv.is_active else '启用' }}
      </button>
    </div>
  </td>
</tr>
