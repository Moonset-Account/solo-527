{% extends "base.html" %}

{% block nav_revenue %}active bg-solar-500/15 text-solar-400{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-gray-800">收益核算</h2>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form class="flex flex-wrap gap-4 items-end" id="revenue-filter">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">电站</label>
                <input type="text" name="station_id" value="{{ selected_station_id if selected_station_id else '' }}" placeholder="输入电站ID" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none w-56">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">开始日期</label>
                <input type="date" name="start_date" value="{{ start_date if start_date else '' }}" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">结束日期</label>
                <input type="date" name="end_date" value="{{ end_date if end_date else '' }}" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <button type="button" onclick="loadRevenueData()" class="bg-solar-500 hover:bg-solar-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">查询</button>
        </form>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 card-hover">
            <p class="text-xs font-medium text-gray-500 mb-1">总发电量</p>
            <p class="text-2xl font-bold text-gray-800"><span data-field="total_generation">--</span> <span class="text-sm font-normal text-gray-400">kWh</span></p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 card-hover">
            <p class="text-xs font-medium text-gray-500 mb-1">总收入</p>
            <p class="text-2xl font-bold text-solar-500" data-field="total_revenue">¥--</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 card-hover">
            <p class="text-xs font-medium text-gray-500 mb-1">补贴收入</p>
            <p class="text-2xl font-bold text-blue-500" data-field="subsidy_revenue">¥--</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 card-hover">
            <p class="text-xs font-medium text-gray-500 mb-1">平均日收益</p>
            <p class="text-2xl font-bold text-amber-500" data-field="avg_daily_revenue">¥--</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 card-hover">
            <p class="text-xs font-medium text-gray-500 mb-1">最大尖峰负荷</p>
            <p class="text-2xl font-bold text-red-500"><span data-field="max_peak_load">--</span> <span class="text-sm font-normal text-gray-400">kW</span></p>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="border-b border-gray-200">
            <nav class="flex -mb-px">
                <button onclick="switchRevenueTab('records')" id="tab-records" class="rev-tab px-6 py-3 text-sm font-medium border-b-2 border-solar-500 text-solar-600">收益记录</button>
                <button onclick="switchRevenueTab('peak')" id="tab-peak" class="rev-tab px-6 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">尖峰负荷</button>
                <button onclick="switchRevenueTab('energy')" id="tab-energy" class="rev-tab px-6 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">能耗曲线</button>
            </nav>
        </div>

        <div id="panel-records" class="p-6">
            <div id="revenue-records">
                <p class="text-center text-gray-400 py-8">请选择电站和日期范围后查询收益记录</p>
            </div>
        </div>

        <div id="panel-peak" class="p-6 hidden">
            <div id="peak-load-data">
                <p class="text-center text-gray-400 py-8">请选择电站和日期范围后查询尖峰负荷数据</p>
            </div>
        </div>

        <div id="panel-energy" class="p-6 hidden">
            <div class="mb-4 flex flex-wrap gap-3 items-end" id="energy-curve-filter">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">开始时间</label>
                    <input type="datetime-local" id="energy-start-time" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">结束时间</label>
                    <input type="datetime-local" id="energy-end-time" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">间隔(分钟)</label>
                    <select id="energy-interval" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="60">60</option>
                    </select>
                </div>
                <button type="button" onclick="loadEnergyCurve()" class="bg-solar-500 hover:bg-solar-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">查询曲线</button>
            </div>
            <div id="energy-curve-area">
                <p class="text-center text-gray-400 py-8">请选择时间范围后查询能耗曲线</p>
            </div>

            <div class="mt-8 border-t border-gray-200 pt-6">
                <h4 class="text-sm font-semibold text-gray-700 mb-3">批量能耗查询（多电站）</h4>
                <form hx-post="/revenue/batch-energy" hx-target="#batch-energy-result" hx-swap="innerHTML" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">电站ID列表(逗号分隔)</label>
                        <input type="text" name="station_ids" required placeholder="uuid1,uuid2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">开始时间</label>
                        <input type="datetime-local" name="start_time" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">结束时间</label>
                        <input type="datetime-local" name="end_time" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                    </div>
                    <div class="md:col-span-3 flex justify-end">
                        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium transition">批量查询能耗</button>
                    </div>
                </form>
                <div id="batch-energy-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">收益计算</h3>
        <form hx-post="/revenue/calculate" hx-target="#calc-result" hx-swap="innerHTML" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">电站ID</label>
                <input type="text" name="station_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">记录日期</label>
                <input type="date" name="record_date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">发电量(kWh)</label>
                <input type="number" name="generation_kwh" step="0.01" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">用电量(kWh)</label>
                <input type="number" name="consumption_kwh" step="0.01" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">上网电量(kWh)</label>
                <input type="number" name="grid_feed_kwh" step="0.01" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">尖峰负荷(kW)</label>
                <input type="number" name="peak_load_kw" step="0.01" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div class="md:col-span-3 flex justify-end">
                <button type="submit" class="bg-solar-500 hover:bg-solar-600 text-white px-6 py-2 rounded-lg text-sm font-medium transition">计算收益</button>
            </div>
        </form>
        <div id="calc-result" class="mt-4"></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">批量查询</h3>
        <form hx-post="/revenue/batch-query" hx-target="#batch-result" hx-swap="innerHTML" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">电站ID列表(逗号分隔)</label>
                <input type="text" name="station_ids" required placeholder="uuid1,uuid2,uuid3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">开始日期</label>
                <input type="date" name="start_date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">结束日期</label>
                <input type="date" name="end_date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div class="md:col-span-3 flex justify-end">
                <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium transition">批量查询</button>
            </div>
        </form>
        <div id="batch-result" class="mt-4"></div>
    </div>
</div>

<script>
function getFilterParams() {
    var form = document.getElementById('revenue-filter');
    return {
        station_id: form.querySelector('[name="station_id"]').value,
        start_date: form.querySelector('[name="start_date"]').value,
        end_date: form.querySelector('[name="end_date"]').value
    };
}

function switchRevenueTab(tab) {
    ['records', 'peak', 'energy'].forEach(function(t) {
        document.getElementById('panel-' + t).classList.add('hidden');
        document.getElementById('tab-' + t).classList.remove('border-solar-500', 'text-solar-600');
        document.getElementById('tab-' + t).classList.add('border-transparent', 'text-gray-500');
    });
    document.getElementById('panel-' + tab).classList.remove('hidden');
    document.getElementById('tab-' + tab).classList.remove('border-transparent', 'text-gray-500');
    document.getElementById('tab-' + tab).classList.add('border-solar-500', 'text-solar-600');

    var f = getFilterParams();
    if (f.station_id && f.start_date && f.end_date) {
        var params = 'station_id=' + encodeURIComponent(f.station_id) + '&start_date=' + encodeURIComponent(f.start_date) + '&end_date=' + encodeURIComponent(f.end_date);
        if (tab === 'records') {
            htmx.ajax('GET', '/revenue/records?' + params, '#revenue-records');
        } else if (tab === 'peak') {
            htmx.ajax('GET', '/revenue/peak-load?' + params, '#peak-load-data');
        }
    }
}

function loadRevenueData() {
    var f = getFilterParams();
    if (!f.station_id || !f.start_date || !f.end_date) return;
    var params = 'station_id=' + encodeURIComponent(f.station_id) + '&start_date=' + encodeURIComponent(f.start_date) + '&end_date=' + encodeURIComponent(f.end_date);
    htmx.ajax('GET', '/revenue/records?' + params, '#revenue-records');
    htmx.ajax('GET', '/revenue/peak-load?' + params, '#peak-load-data');

    var startTime = f.start_date + 'T00:00';
    var endTime = f.end_date + 'T23:59';
    document.getElementById('energy-start-time').value = startTime;
    document.getElementById('energy-end-time').value = endTime;

    htmx.ajax('GET', '/revenue/api/summary?' + params).then(function(){}).catch(function(){});
    fetch('/revenue/api/summary?' + params)
        .then(function(r){ return r.json(); })
        .then(function(d) {
            document.querySelector('[data-field="total_generation"]').textContent = parseFloat(d.total_generation).toLocaleString();
            document.querySelector('[data-field="total_revenue"]').textContent = '¥' + parseFloat(d.total_revenue).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
            document.querySelector('[data-field="subsidy_revenue"]').textContent = '¥' + (parseFloat(d.total_revenue) * 0.15).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
            document.querySelector('[data-field="avg_daily_revenue"]').textContent = '¥' + parseFloat(d.avg_daily_revenue).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
            document.querySelector('[data-field="max_peak_load"]').textContent = parseFloat(d.max_peak_load).toLocaleString();
        }).catch(function(){});
}

function loadEnergyCurve() {
    var f = getFilterParams();
    var startTime = document.getElementById('energy-start-time').value;
    var endTime = document.getElementById('energy-end-time').value;
    var interval = document.getElementById('energy-interval').value;
    if (!f.station_id || !startTime || !endTime) return;
    var params = 'station_id=' + encodeURIComponent(f.station_id) + '&start_time=' + encodeURIComponent(startTime.replace('T', ' ')) + '&end_time=' + encodeURIComponent(endTime.replace('T', ' ')) + '&interval_minutes=' + interval;
    htmx.ajax('GET', '/revenue/energy-curve?' + params, '#energy-curve-area');
}
</script>
{% endblock %}
