{% extends "base.html" %}
{% block title %}积分权益{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-b from-amber-50 to-white">
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800">⭐ 积分权益</h1>
            <a href="/mall" class="text-sm text-gray-500">← 返回商城</a>
        </div>
        <div class="max-w-4xl mx-auto px-4 pb-3">
            <div class="flex space-x-8">
                <a href="/mall" class="pb-2 text-gray-500 hover:text-gray-800">积分商城</a>
                <a href="/my-coupons" class="pb-2 text-gray-500 hover:text-gray-800">复购券</a>
                <a href="/my-benefits" class="pb-2 tab-active">积分权益</a>
                <a href="/my-redemptions" class="pb-2 text-gray-500 hover:text-gray-800">兑换记录</a>
            </div>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="grid md:grid-cols-2 gap-4" id="benefits-list">
            <div class="col-span-full text-center py-12 text-gray-400">加载中...</div>
        </div>
        <h2 class="text-lg font-bold mt-8 mb-4 text-gray-800">我的权益记录</h2>
        <div id="my-benefits-list" class="space-y-3"></div>
    </main>
</div>
<script>
async function loadBenefits(){
    const r=await fetch('/api/benefits?limit=50',{credentials:'include'});if(!r.ok)return;
    const list=await r.json();
    const html=list.map(b=>`
        <div class="bg-white rounded-2xl p-5 shadow-sm hover:shadow transition">
            <div class="flex justify-between items-start mb-2">
                <div class="flex items-center space-x-2">
                    <span class="text-2xl">${b.benefit_type==='birthday'?'🎂':b.benefit_type==='vip'?'👑':'🎁'}</span>
                    <h3 class="font-bold text-gray-800">${b.name}</h3>
                </div>
                <span class="bg-amber-100 text-amber-600 px-3 py-1 rounded-full text-sm font-bold">${b.points_required} 积分</span>
            </div>
            <p class="text-sm text-gray-500 mb-3">${b.description||''}</p>
            <div class="flex justify-between items-center">
                <span class="text-xs text-gray-400">价值 ¥${b.value_amount||0} · 库存 ${b.stock}</span>
                <button onclick="claimBenefit(${b.id})" class="px-4 py-1.5 bg-gradient-to-r from-amber-400 to-orange-500 text-white text-sm rounded-full">领取权益</button>
            </div>
        </div>`).join('');
    document.getElementById('benefits-list').innerHTML=html||'<div class="col-span-full text-center py-8 text-gray-400">暂无权益</div>';
    const mr=await fetch('/api/my-benefits',{credentials:'include'});
    if(mr.ok){const mb=await mr.json();
        document.getElementById('my-benefits-list').innerHTML=mb.map(x=>{const b=x.benefit||{};return`
            <div class="bg-white rounded-xl p-4 flex justify-between items-center">
                <div class="flex items-center space-x-3"><span class="text-xl">⭐</span>
                    <div><div class="font-medium text-sm">${b.name||'权益'}</div><div class="text-xs text-gray-400">${new Date(x.received_at).toLocaleString()}</div></div>
                </div>
                <span class="text-xs px-2 py-0.5 rounded-full ${x.status==='active'?'bg-green-100 text-green-600':'bg-gray-100 text-gray-500'}">${x.status==='active'?'有效':'已使用'}</span>
            </div>`;}).join('')||'<div class="text-center py-6 text-gray-400 text-sm">暂无领取记录</div>';
    }
}
async function claimBenefit(id){
    showToast('功能开发中...','info');
}
loadBenefits();
</script>
{% endblock %}
