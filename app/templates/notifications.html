{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">🔔 通知中心</h1>
            <p class="text-gray-500 mt-1">查看和管理系统通知消息</p>
        </div>
        <button onclick="markAllRead()" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700 transition-colors">
            全部标记已读
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">通知总数</p>
                    <p class="text-2xl font-bold text-gray-800 mt-1" id="stat-total">-</p>
                </div>
                <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-2xl">
                    📬
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">未读通知</p>
                    <p class="text-2xl font-bold text-red-600 mt-1" id="stat-unread">-</p>
                </div>
                <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center text-2xl">
                    🔴
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">已读通知</p>
                    <p class="text-2xl font-bold text-green-600 mt-1" id="stat-read">-</p>
                </div>
                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center text-2xl">
                    ✅
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="p-5 border-b border-gray-100 flex items-center gap-2">
            <button onclick="switchTab('all')" id="tab-all" class="px-4 py-2 rounded-lg text-sm font-medium bg-primary-100 text-primary-700 transition-colors">
                全部通知
            </button>
            <button onclick="switchTab('unread')" id="tab-unread" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
                未读通知
            </button>
            <button onclick="switchTab('read')" id="tab-read" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
                已读通知
            </button>
        </div>

        <div id="notification-list" class="divide-y divide-gray-100">
            <div class="p-12 text-center text-gray-400">
                <div class="animate-spin w-8 h-8 border-2 border-primary-500 border-t-transparent rounded-full mx-auto mb-3"></div>
                加载中...
            </div>
        </div>

        <div class="px-5 py-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500" id="pagination-info">
            <span>共 0 条记录</span>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const authHeaders = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
    let currentTab = 'all';

    function getNotificationTypeClass(type) {
        const typeMap = {
            'alert': 'bg-red-100 text-red-700',
            'harvest': 'bg-green-100 text-green-700',
            'batch': 'bg-blue-100 text-blue-700',
            'subsidy': 'bg-yellow-100 text-yellow-700',
            'sorting': 'bg-orange-100 text-orange-700',
            'system': 'bg-purple-100 text-purple-700'
        };
        return typeMap[type] || 'bg-gray-100 text-gray-700';
    }

    function getNotificationTypeText(type) {
        const typeMap = {
            'alert': '告警',
            'harvest': '采收',
            'batch': '批次',
            'subsidy': '补贴',
            'sorting': '分选',
            'system': '系统'
        };
        return typeMap[type] || type;
    }

    function getNotificationTypeIcon(type) {
        const iconMap = {
            'alert': '⚠️',
            'harvest': '🌱',
            'batch': '📦',
            'subsidy': '💰',
            'sorting': '⚖️',
            'system': '🔔'
        };
        return iconMap[type] || '📬';
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
        if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
        if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
        
        return date.toLocaleString('zh-CN', { 
            year: 'numeric', 
            month: '2-digit', 
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function loadStats() {
        Promise.all([
            fetch('/api/reports/notifications?page_size=1', { headers: authHeaders }).then(r => r.json()).then(d => document.getElementById('stat-total').textContent = d.pagination?.total || 0).catch(() => {}),
            fetch('/api/reports/notifications/unread', { headers: authHeaders }).then(r => r.json()).then(d => {
                const unread = d.data?.length || d.pagination?.total || 0;
                document.getElementById('stat-unread').textContent = unread;
                const total = parseInt(document.getElementById('stat-total').textContent) || 0;
                document.getElementById('stat-read').textContent = Math.max(0, total - unread);
            }).catch(() => {})
        ]);
    }

    function switchTab(tab) {
        currentTab = tab;
        
        document.getElementById('tab-all').className = tab === 'all' 
            ? 'px-4 py-2 rounded-lg text-sm font-medium bg-primary-100 text-primary-700 transition-colors'
            : 'px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors';
        document.getElementById('tab-unread').className = tab === 'unread' 
            ? 'px-4 py-2 rounded-lg text-sm font-medium bg-primary-100 text-primary-700 transition-colors'
            : 'px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors';
        document.getElementById('tab-read').className = tab === 'read' 
            ? 'px-4 py-2 rounded-lg text-sm font-medium bg-primary-100 text-primary-700 transition-colors'
            : 'px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors';
        
        loadNotifications();
    }

    function markAsRead(id) {
        fetch(`/api/reports/notifications/${id}/read`, {
            method: 'POST',
            headers: authHeaders
        })
        .then(r => {
            if (r.ok) {
                showToast('已标记为已读', 'success');
                loadNotifications();
                loadStats();
            } else {
                showToast('操作失败', 'error');
            }
        })
        .catch(() => showToast('网络错误', 'error'));
    }

    function markAllRead() {
        fetch('/api/reports/notifications/read-all', {
            method: 'POST',
            headers: authHeaders
        })
            .then(r => r.json())
            .then(data => {
                const count = data.mark_read_count || 0;
                if (count > 0) {
                    showToast(`已将 ${count} 条通知标记为已读`, 'success');
                } else {
                    showToast('没有未读通知', 'info');
                }
                loadNotifications();
                loadStats();
            })
            .catch(() => showToast('网络错误', 'error'));
    }

    function loadNotifications() {
        const container = document.getElementById('notification-list');
        container.innerHTML = `
            <div class="p-12 text-center text-gray-400">
                <div class="animate-spin w-8 h-8 border-2 border-primary-500 border-t-transparent rounded-full mx-auto mb-3"></div>
                加载中...
            </div>
        `;

        let url;
        if (currentTab === 'unread') {
            url = '/api/reports/notifications/unread';
        } else {
            url = '/api/reports/notifications?page_size=50';
        }

        fetch(url, { headers: authHeaders })
            .then(r => r.json())
            .then(data => {
                let notifications = data.data || [];
                
                if (currentTab === 'read') {
                    notifications = notifications.filter(n => n.is_read);
                }

                if (notifications.length === 0) {
                    container.innerHTML = `
                        <div class="p-12 text-center text-gray-400">
                            <div class="text-5xl mb-3">📭</div>
                            暂无通知
                        </div>
                    `;
                } else {
                    container.innerHTML = notifications.map(n => `
                        <div class="p-5 hover:bg-gray-50 transition-colors ${n.is_read ? 'bg-white' : 'bg-primary-50/30'}">
                            <div class="flex items-start gap-4">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl flex-shrink-0 ${getNotificationTypeClass(n.notification_type)}">
                                    ${getNotificationTypeIcon(n.notification_type)}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between gap-2">
                                        <div class="flex items-center gap-2">
                                            <h4 class="font-medium text-gray-800">${n.title || '通知'}</h4>
                                            ${!n.is_read ? '<span class="w-2 h-2 bg-red-500 rounded-full flex-shrink-0"></span>' : ''}
                                        </div>
                                        <span class="px-2 py-0.5 text-xs font-medium rounded ${getNotificationTypeClass(n.notification_type)}">
                                            ${getNotificationTypeText(n.notification_type)}
                                        </span>
                                    </div>
                                    <p class="text-sm text-gray-600 mt-1">${n.content || n.message || ''}</p>
                                    <div class="flex items-center justify-between mt-3">
                                        <span class="text-xs text-gray-400">${formatDate(n.created_at)}</span>
                                        ${!n.is_read ? `
                                            <button onclick="markAsRead(${n.id})" class="text-xs text-primary-600 hover:text-primary-700 font-medium">
                                                标记已读
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }

                document.getElementById('pagination-info').innerHTML = `<span>共 ${notifications.length} 条记录</span>`;
            })
            .catch(() => {
                container.innerHTML = `
                    <div class="p-12 text-center text-gray-400">加载失败</div>
                `;
            });
    }

    loadStats();
    loadNotifications();
</script>
{% endblock %}
