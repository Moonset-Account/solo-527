{% extends "layout.html" %}
{% set active_page = 'messages' %}
{% set page_title = '消息中心' %}
{% block main_content %}

<div class="filter-bar" id="message-filters">
    <select name="type"
            hx-get="/api/messages?page=1&limit=10"
            hx-trigger="change"
            hx-target="#messages-container"
            hx-swap="innerHTML"
            hx-include="#message-filters">
        <option value="">全部类型</option>
        <option value="info">通知</option>
        <option value="warning">警告</option>
        <option value="alert">告警</option>
    </select>
    <select name="is_read"
            hx-get="/api/messages?page=1&limit=10"
            hx-trigger="change"
            hx-target="#messages-container"
            hx-swap="innerHTML"
            hx-include="#message-filters">
        <option value="">全部状态</option>
        <option value="false">未读</option>
        <option value="true">已读</option>
    </select>
    <div style="margin-left: auto;">
        <button class="btn btn-default"
                hx-post="/api/messages/read-all"
                hx-target="#messages-container"
                hx-swap="innerHTML"
                hx-on::after-request="showToast('已全部标记为已读', 'success');">全部标记已读</button>
        <span class="badge badge-warning" style="margin-left: 8px;" id="unread-count">0 条未读</span>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3>消息列表</h3>
        <span id="total-count">共 0 条</span>
    </div>
    <div id="messages-container"
         hx-get="/api/messages?page=1&limit=10"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="empty-state">加载中...</div>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/messages/unread-count')
        .then(res => res.json())
        .then(data => {
            document.getElementById('unread-count').textContent = data.count + ' 条未读';
        });
});

document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.elt.getAttribute('hx-post') && 
        (evt.detail.elt.getAttribute('hx-post').includes('/read') || 
         evt.detail.elt.getAttribute('hx-post').includes('/read-all'))) {
        fetch('/api/messages/unread-count')
            .then(res => res.json())
            .then(data => {
                document.getElementById('unread-count').textContent = data.count + ' 条未读';
            });
    }
});
</script>
{% endblock %}
