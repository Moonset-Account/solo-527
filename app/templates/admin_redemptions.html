{% extends "admin_base.html" %}
{% block title %}兑换订单{% endblock %}
{% block page_title %}📦 兑换订单管理{% endblock %}
{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex gap-3 flex-wrap">
    <select id="f-status" class="px-3 py-2 border rounded-lg text-sm">
        <option value="">全部状态</option>
        <option value="submitted">待处理</option><option value="processed">处理中</option>
        <option value="shipped">已发货</option><option value="completed">已完成</option><option value="cancelled">已取消</option>
    </select>
    <button onclick="load()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">查询</button>
</div>
<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b"><tr>
            <th class="px-4 py-3 text-left">订单号</th><th class="px-4 py-3 text-left">商品</th>
            <th class="px-4 py-3 text-right">数量</th><th class="px-4 py-3 text-right">消耗积分</th>
            <th class="px-4 py-3 text-right">成本</th><th class="px-4 py-3 text-left">收货人</th>
            <th class="px-4 py-3 text-center">状态</th><th class="px-4 py-3 text-left">下单时间</th>
            <th class="px-4 py-3 text-center">操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="9" class="text-center py-12 text-gray-400">加载中...</td></tr></tbody>
    </table>
</div>
<script>
const statusMap={submitted:['待处理','bg-yellow-100 text-yellow-600'],processed:['处理中','bg-blue-100 text-blue-600'],
    shipped:['已发货','bg-purple-100 text-purple-600'],completed:['已完成','bg-green-100 text-green-600'],
    cancelled:['已取消','bg-red-100 text-red-500']};
async function load(){
    const s=document.getElementById('f-status').value;let url='/api/redemptions?limit=100';if(s)url+=`&status=${s}`;
    const r=await fetch(url,{credentials:'include'});if(!r.ok)return;const list=await r.json();
    document.getElementById('tbody').innerHTML=list.length?list.map(o=>{const [sl,sc]=statusMap[o.status]||[o.status,'bg-gray-100'];
        const it=o.items&&o.items[0]?o.items[0]:{};return`
        <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-3 font-mono">${o.order_no}</td>
            <td class="px-4 py-3">${it.product_name||'商品'}</td>
            <td class="px-4 py-3 text-right">${o.quantity||1}</td>
            <td class="px-4 py-3 text-right font-bold text-orange-600">${o.points_consumed.toLocaleString()}</td>
            <td class="px-4 py-3 text-right">¥${(o.cost_amount||0).toFixed(2)}</td>
            <td class="px-4 py-3">${o.receiver_name||'-'}<div class="text-xs text-gray-400">${o.receiver_phone||''}</div></td>
            <td class="px-4 py-3 text-center"><span class="text-xs px-2 py-0.5 rounded ${sc}">${sl}</span></td>
            <td class="px-4 py-3 text-gray-500">${fmt(o.created_at)}</td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <button onclick="showDetail(${o.id})" class="text-blue-500 hover:underline mr-2">详情</button>
                ${o.status==='submitted'?`<button onclick="updateStatus(${o.id},'processed')" class="text-green-500 hover:underline mr-2">处理</button>`:''}
                ${o.status==='processed'?`<button onclick="showShip(${o.id})" class="text-purple-500 hover:underline mr-2">发货</button>`:''}
                ${['submitted','processed'].includes(o.status)?`<button onclick="updateStatus(${o.id},'cancelled')" class="text-red-500 hover:underline">取消</button>`:''}
            </td>
        </tr>`;}).join(''):'<tr><td colspan="9" class="text-center py-12 text-gray-400">暂无数据</td></tr>';
}
async function showDetail(id){
    const r=await fetch(`/api/redemptions/${id}`,{credentials:'include'});if(!r.ok)return;const o=await r.json();
    const [sl,sc]=statusMap[o.status]||[o.status,'bg-gray-100'];const it=o.items&&o.items[0]?o.items[0]:{};
    openModal('订单详情 - '+o.order_no,`
        <div class="space-y-3 text-sm">
            <div class="flex justify-between"><span>订单号：<span class="font-mono">${o.order_no}</span></span><span class="text-xs px-2 py-0.5 rounded ${sc}">${sl}</span></div>
            <div class="bg-gray-50 p-3 rounded flex gap-3"><div class="w-16 h-16 bg-white rounded flex items-center justify-center text-2xl">🎁</div>
                <div><div class="font-medium">${it.product_name||'商品'}</div><div class="text-xs text-gray-500">数量 ${o.quantity||1} · ${o.points_consumed}积分</div></div></div>
            <div class="grid grid-cols-2 gap-3"><div>收货人：${o.receiver_name||'-'}</div><div>电话：${o.receiver_phone||'-'}</div>
                <div class="col-span-2">地址：${o.receiver_address||'-'}</div></div>
            ${o.logistics_company?`<div class="bg-blue-50 p-3 rounded"><div class="text-blue-600 font-medium mb-1">物流信息</div>${o.logistics_company} ${o.tracking_no?'运单号: '+o.tracking_no:''}</div>`:''}
            ${o.remark?`<div class="bg-yellow-50 p-3 rounded">备注：${o.remark}</div>`:''}
            <div class="text-xs text-gray-400">
                下单: ${fmt(o.created_at)}<br>处理: ${fmt(o.processed_at)}<br>发货: ${fmt(o.shipped_at)}<br>完成: ${fmt(o.completed_at)}
            </div>
            <div id="ord-attachments"></div><div id="ord-notes"></div>
        </div>`);
    setTimeout(()=>{loadExtra('redemption_order',id);},100);
}
async function loadExtra(type,id){
    const ar=await fetch(`/api/attachments?entity_type=${type}&entity_id=${id}`,{credentials:'include'});
    if(ar.ok){const al=await ar.json();if(al.length)document.getElementById('ord-attachments').innerHTML=`<div class="pt-3 border-t"><div class="font-medium mb-2">📎 附件</div>${al.map(a=>`<a href="${a.download_url}" class="block bg-gray-100 px-3 py-2 rounded text-xs mb-1">📄 ${a.file_name}</a>`).join('')}</div>`;}
    const nr=await fetch(`/api/notes?entity_type=${type}&entity_id=${id}`,{credentials:'include'});
    if(nr.ok){const nl=await nr.json();if(nl.length)document.getElementById('ord-notes').innerHTML=`<div class="pt-3 border-t"><div class="font-medium mb-2">💬 备注</div>${nl.map(n=>`<div class="bg-blue-50 p-2 rounded text-xs mb-1"><div>${n.content}</div><div class="text-gray-400 mt-1">${fmt(n.created_at)}</div></div>`).join('')}</div>`;}
}
function showShip(id){openModal('订单发货',`
    <div class="space-y-3">
        <div><label class="text-sm text-gray-600">物流公司</label><input id="ship-company" class="w-full px-3 py-2 border rounded text-sm"></div>
        <div><label class="text-sm text-gray-600">运单号</label><input id="ship-no" class="w-full px-3 py-2 border rounded text-sm"></div>
        <button onclick="submitShip(${id})" class="w-full py-2 bg-purple-600 text-white rounded-lg">确认发货</button>
    </div>`);}
async function submitShip(id){
    const r=await fetch(`/api/redemptions/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',
        body:JSON.stringify({status:'shipped',logistics_company:document.getElementById('ship-company').value,tracking_no:document.getElementById('ship-no').value})});
    if(r.ok){showToast('发货成功','success');closeModal();load();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
async function updateStatus(id,s){
    if(!confirm(`确认将订单状态改为${statusMap[s]?.[0]||s}？`))return;
    const r=await fetch(`/api/redemptions/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({status:s})});
    if(r.ok){showToast('操作成功','success');load();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
load();
</script>
{% endblock %}
