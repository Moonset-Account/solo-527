{% extends "base.html" %}
{% block title %}登录 - 工程材料供应商准入管理系统{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary to-blue-700">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-building text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">工程材料供应商准入管理系统</h1>
            <p class="text-gray-500 mt-2">请登录以继续</p>
        </div>
        <form id="loginForm" hx-post="/api/login" hx-target="#loginError" hx-swap="innerHTML" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
                           placeholder="请输入用户名">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
                           placeholder="请输入密码">
                </div>
            </div>
            <div id="loginError" class="text-danger text-sm"></div>
            <button type="submit"
                    class="w-full bg-primary hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                <i class="fas fa-sign-in-alt mr-2"></i>
                登 录
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            <p>默认账号: admin / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('htmx:afterRequest', function(evt) {
    const response = evt.detail.xhr;
    if (response.status === 200) {
        const data = JSON.parse(response.responseText);
        if (data.access_token) {
            document.cookie = `access_token=Bearer ${data.access_token}; path=/; max-age=86400`;
            window.location.href = '/dashboard';
        }
    } else {
        const errorDiv = document.getElementById('loginError');
        try {
            const data = JSON.parse(response.responseText);
            errorDiv.innerHTML = `<i class="fas fa-exclamation-circle mr-1"></i>${data.detail || '登录失败，请检查用户名和密码'}`;
        } catch {
            errorDiv.innerHTML = '<i class="fas fa-exclamation-circle mr-1"></i>登录失败，请稍后重试';
        }
    }
});
</script>
{% endblock %}
