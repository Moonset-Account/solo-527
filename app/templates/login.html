{% extends "base.html" %}
{% block title %}会员登录 - 母婴会员中心{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-100 via-pink-50 to-rose-100">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-orange-400 to-pink-500 rounded-2xl mx-auto mb-4 flex items-center justify-center">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">母婴会员中心</h1>
            <p class="text-gray-500 mt-1">积分兑换 · 专属权益 · 复购优惠</p>
        </div>
        <form hx-post="/api/auth/login" hx-target="#error-msg" hx-swap="innerHTML">
            <div id="error-msg"></div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-medium mb-2">用户名 / 手机号</label>
                <input type="text" name="username" required
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition"
                       placeholder="请输入用户名">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2">密码</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition"
                       placeholder="请输入密码">
            </div>
            <button type="submit"
                    class="w-full bg-gradient-to-r from-orange-500 to-pink-500 text-white py-3 rounded-lg font-semibold hover:from-orange-600 hover:to-pink-600 transition shadow-md">
                登 录
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            <a href="/admin/login" class="text-orange-500 hover:underline">运营人员后台入口 →</a>
        </div>
    </div>
</div>
{% endblock %}
