{% extends "layout.html" %}
{% set active_page = 'treatment_cards' %}
{% set page_title = '疗程卡管理' %}
{% block main_content %}

<div class="card">
    <div class="card-header">
        <h3>新开卡</h3>
    </div>
    <form id="treatment-card-form"
          hx-post="/api/treatment-cards"
          hx-target="#treatment-card-table-container"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset(); showToast('开卡成功', 'success');">
        <div class="two-columns">
            <div>
                <div class="form-group">
                    <label>卡号</label>
                    <input type="text" name="card_no" required>
                </div>
                <div class="form-group">
                    <label>顾客</label>
                    <select name="customer_id" required>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }} - {{ c.phone }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>疗程</label>
                    <select name="treatment_id" required>
                        {% for t in treatments %}
                        <option value="{{ t.id }}">{{ t.name }} - ¥{{ t.price }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>总次数</label>
                    <input type="number" name="total_sessions" value="10" required>
                </div>
            </div>
            <div>
                <div class="form-group">
                    <label>购买日期</label>
                    <input type="date" name="purchase_date" value="{{ today }}" required>
                </div>
                <div class="form-group">
                    <label>有效期至</label>
                    <input type="date" name="expiry_date">
                </div>
                <div class="form-group">
                    <label>实付金额</label>
                    <input type="number" name="price_paid" step="0.01">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea name="note" rows="2"></textarea>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-success">+ 确认开卡</button>
    </form>
</div>

<div class="card" style="margin-top: 20px;">
    <div class="card-header">
        <h3>疗程卡列表</h3>
        <span id="total-count">共 {{ total_cards }} 条</span>
    </div>
    <div class="filter-bar" id="treatment-card-filters">
        <input type="text" name="keyword" placeholder="搜索卡号/顾客/手机号..." 
               style="flex: 1; min-width: 200px;"
               hx-get="/api/treatment-cards?page=1&limit=10"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#treatment-card-table-container"
               hx-swap="innerHTML"
               hx-include="#treatment-card-filters">
        <select name="status"
                hx-get="/api/treatment-cards?page=1&limit=10"
                hx-trigger="change"
                hx-target="#treatment-card-table-container"
                hx-swap="innerHTML"
                hx-include="#treatment-card-filters">
            <option value="">全部状态</option>
            <option value="active">有效</option>
            <option value="expired">已过期</option>
            <option value="used_up">已用完</option>
        </select>
        <select name="creator_id"
                hx-get="/api/treatment-cards?page=1&limit=10"
                hx-trigger="change"
                hx-target="#treatment-card-table-container"
                hx-swap="innerHTML"
                hx-include="#treatment-card-filters">
            <option value="">全部负责人</option>
            {% for u in operators %}
            <option value="{{ u.id }}">{{ u.full_name }}</option>
            {% endfor %}
        </select>
        <input type="date" name="start_date"
               hx-get="/api/treatment-cards?page=1&limit=10"
               hx-trigger="change"
               hx-target="#treatment-card-table-container"
               hx-swap="innerHTML"
               hx-include="#treatment-card-filters">
        <input type="date" name="end_date"
               hx-get="/api/treatment-cards?page=1&limit=10"
               hx-trigger="change"
               hx-target="#treatment-card-table-container"
               hx-swap="innerHTML"
               hx-include="#treatment-card-filters">
        <div class="actions">
            <button class="btn btn-sm btn-default"
                    hx-get="/api/treatment-cards?page=1&limit=10"
                    hx-target="#treatment-card-table-container"
                    hx-swap="innerHTML"
                    hx-on:click="document.getElementById('treatment-card-filters').reset();">重置</button>
            <button class="btn btn-sm btn-primary"
                    hx-get="/api/treatment-cards?page=1&limit=10"
                    hx-target="#treatment-card-table-container"
                    hx-swap="innerHTML"
                    hx-include="#treatment-card-filters">搜索</button>
        </div>
    </div>
    <div id="treatment-card-table-container"
         hx-get="/api/treatment-cards?page=1&limit=10"
         hx-trigger="load"
         hx-swap="innerHTML">
        <table>
            <thead>
            <tr>
                <th>卡号</th>
                <th>顾客</th>
                <th>疗程</th>
                <th>总次数</th>
                <th>剩余次数</th>
                <th>购买日期</th>
                <th>有效期</th>
                <th>开卡人</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="10" class="empty-state">加载中...</td></tr>
            </tbody>
        </table>
        <div class="pagination"></div>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script>
</script>
{% endblock %}
