{% extends "base.html" %}

{% block title %}新建工单 - 青禾运维工单台{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📝 新建工单</h1>
    <a href="/work-orders" class="btn btn-outline">← 返回列表</a>
</div>

{% if error %}
<div style="background:var(--danger-light);color:var(--danger);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:14px;">{{ error }}</div>
{% endif %}

<div class="card">
    <form hx-post="/work-orders/create" hx-target="body">
        <div class="form-group">
            <label for="title">工单标题 *</label>
            <input type="text" id="title" name="title" required minlength="2" placeholder="请输入工单标题（至少2个字符）">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
            <div class="form-group">
                <label for="order_type">工单类型 *</label>
                <select id="order_type" name="order_type" required>
                    <option value="fault">故障</option>
                    <option value="account_request">账号申请</option>
                </select>
            </div>
            <div class="form-group">
                <label for="priority">优先级</label>
                <select id="priority" name="priority">
                    <option value="low">低</option>
                    <option value="medium" selected>中</option>
                    <option value="high">高</option>
                    <option value="critical">紧急</option>
                </select>
            </div>
            <div class="form-group">
                <label for="sla_hours">SLA时效(小时)</label>
                <input type="number" id="sla_hours" name="sla_hours" value="24" min="1" step="0.5">
            </div>
        </div>
        <div class="form-group">
            <label for="description">问题描述 *</label>
            <textarea id="description" name="description" required placeholder="请详细描述故障现象或账号申请需求"></textarea>
        </div>
        <div style="display:flex;gap:8px;">
            <button type="submit" class="btn btn-primary">提交工单</button>
            <a href="/work-orders" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}
