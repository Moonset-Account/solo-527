{% extends "layout.html" %}
{% set active_page = 'todos' %}
{% set page_title = '待办事项' %}
{% block main_content %}

<div class="stats-grid">
    <div class="stat-card warning">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">待处理</div>
    </div>
    <div class="stat-card primary">
        <div class="stat-value" id="stat-in-progress">0</div>
        <div class="stat-label">处理中</div>
    </div>
    <div class="stat-card success">
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">已完成</div>
    </div>
    <div class="stat-card danger">
        <div class="stat-value" id="stat-high">0</div>
        <div class="stat-label">高优先级</div>
    </div>
</div>

<div class="filter-bar" id="todo-filters">
    <select name="status"
            hx-get="/api/todos?page=1&limit=10"
            hx-trigger="change"
            hx-target="#todos-container"
            hx-swap="innerHTML"
            hx-include="#todo-filters">
        <option value="">全部状态</option>
        <option value="pending">待处理</option>
        <option value="in_progress">处理中</option>
        <option value="completed">已完成</option>
    </select>
    <select name="priority"
            hx-get="/api/todos?page=1&limit=10"
            hx-trigger="change"
            hx-target="#todos-container"
            hx-swap="innerHTML"
            hx-include="#todo-filters">
        <option value="">全部优先级</option>
        <option value="high">高</option>
        <option value="medium">中</option>
        <option value="low">低</option>
    </select>
    <input type="text" name="keyword" placeholder="搜索待办..." 
           style="flex: 1; min-width: 200px;"
           hx-get="/api/todos?page=1&limit=10"
           hx-trigger="keyup changed delay:500ms"
           hx-target="#todos-container"
           hx-swap="innerHTML"
           hx-include="#todo-filters">
    <div class="actions">
        <button class="btn btn-success"
                hx-on:click="document.getElementById('todo-form').reset(); document.getElementById('modal').style.display = 'flex';">+ 新建待办</button>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3>待办列表</h3>
        <span id="total-count">共 0 条</span>
    </div>
    <div id="todos-container"
         hx-get="/api/todos?page=1&limit=10"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="empty-state">加载中...</div>
    </div>
</div>

<div id="modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">新建待办</h3>
            <button class="modal-close" hx-on:click="document.getElementById('modal').style.display = 'none';">&times;</button>
        </div>
        <form id="todo-form"
              hx-post="/api/todos"
              hx-target="#todos-container"
              hx-swap="innerHTML"
              hx-include="#todo-filters"
              hx-on::after-request="document.getElementById('modal').style.display = 'none'; showToast('创建成功', 'success');">
            <div class="form-group">
                <label>标题</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea name="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>优先级</label>
                <select name="priority">
                    <option value="high">高</option>
                    <option value="medium" selected>中</option>
                    <option value="low">低</option>
                </select>
            </div>
            <div class="form-group">
                <label>截止日期</label>
                <input type="date" name="due_date">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" hx-on:click="document.getElementById('modal').style.display = 'none';">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script>
function loadStats() {
    fetch('/api/todos/statistics')
        .then(res => res.json())
        .then(data => {
            document.getElementById('stat-pending').textContent = data.pending;
            document.getElementById('stat-in-progress').textContent = data.in_progress;
            document.getElementById('stat-completed').textContent = data.completed;
            document.getElementById('stat-high').textContent = data.high_priority;
        });
}

document.addEventListener('DOMContentLoaded', function() {
    loadStats();
});

document.body.addEventListener('htmx:afterRequest', function(evt) {
    const elt = evt.detail.elt;
    if ((elt.getAttribute('hx-post') && elt.getAttribute('hx-post').includes('/todos')) ||
        (elt.getAttribute('hx-post') && elt.getAttribute('hx-post').includes('/complete'))) {
        loadStats();
    }
});
</script>
{% endblock %}
