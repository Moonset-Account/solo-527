{% extends "layout.html" %}
{% set active_page = 'works' %}
{% set page_title = '作品管理' %}
{% block main_content %}

<div class="card">
    <div class="card-header">
        <h3>上传作品</h3>
    </div>
    <form id="work-form"
          hx-post="/api/works"
          hx-target="#works-container"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset(); showToast('上传成功', 'success');">
        <div class="two-columns">
            <div>
                <div class="form-group">
                    <label>作品标题</label>
                    <input type="text" name="title" required>
                </div>
                <div class="form-group">
                    <label>关联疗程</label>
                    <select name="treatment_id">
                        <option value="">无</option>
                        {% for t in treatments %}
                        <option value="{{ t.id }}">{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>封面图</label>
                    <input type="text" name="image_url" placeholder="图片URL">
                </div>
            </div>
            <div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select name="status">
                        <option value="draft">草稿</option>
                        <option value="published">发布</option>
                        <option value="hidden">隐藏</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>排序</label>
                    <input type="number" name="sort_order" value="0">
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-success">+ 上传作品</button>
    </form>
</div>

<div class="card" style="margin-top: 20px;">
    <div class="card-header">
        <h3>作品列表</h3>
        <span id="total-count">共 0 条</span>
    </div>
    <div class="filter-bar" id="works-filters">
        <input type="text" name="keyword" placeholder="搜索标题/描述..."
               style="flex: 1; min-width: 200px;"
               hx-get="/api/works?page=1&limit=6"
               hx-trigger="keyup changed delay:500ms, search"
               hx-target="#works-container"
               hx-swap="innerHTML"
               hx-include="#works-filters">
        <select name="status"
                hx-get="/api/works?page=1&limit=6"
                hx-trigger="change"
                hx-target="#works-container"
                hx-swap="innerHTML"
                hx-include="#works-filters">
            <option value="">全部状态</option>
            <option value="pending">待审核</option>
            <option value="published">已发布</option>
            <option value="draft">草稿</option>
            <option value="hidden">已隐藏</option>
        </select>
        <div class="actions">
            <button class="btn btn-sm btn-default"
                    hx-get="/api/works?page=1&limit=6"
                    hx-target="#works-container"
                    hx-swap="innerHTML"
                    hx-on:click="document.getElementById('works-filters').reset();">重置</button>
            <button class="btn btn-sm btn-primary"
                    hx-get="/api/works?page=1&limit=6"
                    hx-target="#works-container"
                    hx-swap="innerHTML"
                    hx-include="#works-filters">搜索</button>
        </div>
    </div>
    <div id="works-container"
         hx-get="/api/works?page=1&limit=6"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="work-grid">
            <div class="empty-state" style="grid-column: 1/-1;">加载中...</div>
        </div>
        <div class="pagination"></div>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script>
</script>
{% endblock %}
