{% extends "base.html" %}
{% block title %}运营后台登录{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mx-auto mb-4 flex items-center justify-center">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">会员触达运营后台</h1>
            <p class="text-gray-500 mt-1">母婴会员复购营销系统</p>
        </div>
        <form hx-post="/api/auth/login" hx-target="#error-msg" hx-swap="innerHTML">
            <div id="error-msg"></div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-medium mb-2">账号</label>
                <input type="text" name="username" required
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                       placeholder="管理员/运营账号">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2">密码</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                       placeholder="请输入密码">
            </div>
            <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-indigo-700 transition shadow-md">
                登 录 后 台
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            <a href="/login" class="text-blue-500 hover:underline">← 返回会员前台</a>
        </div>
    </div>
</div>
{% endblock %}
