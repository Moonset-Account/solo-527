{% extends "base.html" %}
{% block title %}我的预约 - 宠物洗护预约商城{% endblock %}
{% block content %}
{% include "customer/_sidebar.html" %}
<div class="main-content">
    <h1 class="page-title">📅 我的预约</h1>
    <div class="card">
        <div class="flex justify-between items-center mb-4">
            <h2 style="margin:0;">预约列表</h2>
            <a href="/customer/services" class="btn btn-primary">新建预约</a>
        </div>
        <div id="appointments-list">加载中...</div>
    </div>
</div>
<script>
async function loadAppointments() {
    try {
        const resp = await fetch('/api/appointments?limit=100', { headers: apiHeaders() });
        const appts = await resp.json();
        if (!appts.length) {
            document.getElementById('appointments-list').innerHTML = '<p class="text-gray">暂无预约记录</p>';
            return;
        }
        document.getElementById('appointments-list').innerHTML = `
            <table>
                <thead><tr><th>日期</th><th>时间</th><th>宠物</th><th>服务项目</th><th>金额</th><th>状态</th></tr></thead>
                <tbody>
                    ${appts.map(a => `<tr>
                        <td>${a.appointment_date}</td>
                        <td>${a.start_time}</td>
                        <td>${a.pet_name || '-'}</td>
                        <td>${a.services.map(s => s.service_name).join(', ') || '-'}</td>
                        <td>¥${a.total_price.toFixed(2)}</td>
                        <td><span class="badge badge-${a.status}">${a.status}</span></td>
                    </tr>`).join('')}
                </tbody>
            </table>
        `;
    } catch (e) { console.error(e); }
}
loadAppointments();
</script>
{% endblock %}
