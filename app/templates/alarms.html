{% extends "base.html" %}

{% block nav_alarms %}active bg-solar-500/15 text-solar-400{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-gray-800">告警管理</h2>
        <button onclick="document.getElementById('new-alarm-form').classList.toggle('hidden')" class="bg-solar-500 hover:bg-solar-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            <span>新建告警</span>
        </button>
    </div>

    <div id="new-alarm-form" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">创建告警</h3>
        <form hx-post="/alarms/" hx-target="#alarm-table-body" hx-swap="beforeend" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">电站ID</label>
                <input type="text" name="station_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">设备ID</label>
                <input type="text" name="equipment_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">告警类型</label>
                <input type="text" name="alarm_type" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">级别</label>
                <select name="severity" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                    <option value="critical">紧急</option>
                    <option value="major">严重</option>
                    <option value="minor">一般</option>
                    <option value="info">提示</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                <textarea name="description" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none"></textarea>
            </div>
            <div class="md:col-span-3 flex justify-end space-x-3">
                <button type="button" onclick="document.getElementById('new-alarm-form').classList.add('hidden')" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition">取消</button>
                <button type="submit" class="px-4 py-2 bg-solar-500 hover:bg-solar-600 text-white rounded-lg text-sm font-medium transition">提交</button>
            </div>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form hx-get="/alarms/" hx-target="#alarm-table-body" hx-swap="innerHTML" hx-trigger="change" class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                <select name="status" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                    <option value="">全部状态</option>
                    <option value="pending" {% if filter_status == 'pending' %}selected{% endif %}>待处理</option>
                    <option value="acknowledged" {% if filter_status == 'acknowledged' %}selected{% endif %}>已接收</option>
                    <option value="processing" {% if filter_status == 'processing' %}selected{% endif %}>处理中</option>
                    <option value="resolved" {% if filter_status == 'resolved' %}selected{% endif %}>已解决</option>
                    <option value="closed" {% if filter_status == 'closed' %}selected{% endif %}>已关闭</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">级别</label>
                <select name="severity" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none">
                    <option value="">全部级别</option>
                    <option value="critical" {% if filter_severity == 'critical' %}selected{% endif %}>紧急</option>
                    <option value="major" {% if filter_severity == 'major' %}selected{% endif %}>严重</option>
                    <option value="minor" {% if filter_severity == 'minor' %}selected{% endif %}>一般</option>
                    <option value="info" {% if filter_severity == 'info' %}selected{% endif %}>提示</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">电站</label>
                <input type="text" name="station_id" value="{{ filter_station_id if filter_station_id else '' }}" placeholder="电站ID" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-solar-500 focus:border-solar-500 outline-none w-48">
            </div>
            <button type="submit" class="bg-solar-500 hover:bg-solar-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">筛选</button>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200">
                        <th class="text-left py-3 px-4 font-medium text-gray-600">设备</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-600">告警类型</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-600">级别</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-600">状态</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-600">时间</th>
                        <th class="text-left py-3 px-4 font-medium text-gray-600">操作</th>
                    </tr>
                </thead>
                <tbody id="alarm-table-body">
                    {% for alarm in alarms %}
                    {% include "partials/alarm_row.html" %}
                    {% else %}
                    <tr>
                        <td colspan="6" class="py-12 text-center text-gray-400">
                            <svg class="mx-auto w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <p>暂无告警记录</p>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
