{% extends "base.html" %}

{% block content %}
<div class="space-y-5">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-semibold text-gray-800">套餐规则</h2>
    <button onclick="document.getElementById('add-plan-modal').classList.remove('hidden')"
      class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition-colors">
      + 新增套餐
    </button>
  </div>

  <div id="add-plan-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-800">新增套餐</h3>
        <button onclick="document.getElementById('add-plan-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form hx-post="/plans/htmx/" hx-target="#plan-table-body" hx-swap="beforeend" hx-on::after-request="document.getElementById('add-plan-modal').classList.add('hidden')">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">名称</label>
            <input type="text" name="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入套餐名称">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">编码</label>
            <input type="text" name="code" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入套餐编码">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">价格</label>
              <input type="number" step="0.01" name="price" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="0.00">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">调用限制</label>
              <input type="number" name="call_limit" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="0">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">频率限制</label>
            <input type="number" name="rate_limit" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="0">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
            <textarea name="notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="可选备注"></textarea>
          </div>
        </div>
        <div class="mt-5 flex justify-end gap-3">
          <button type="button" onclick="document.getElementById('add-plan-modal').classList.add('hidden')" class="px-4 py-2 text-sm text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">取消</button>
          <button type="submit" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">确认添加</button>
        </div>
      </form>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-gray-50 text-left text-gray-600">
          <th class="px-4 py-3 font-medium">名称</th>
          <th class="px-4 py-3 font-medium">编码</th>
          <th class="px-4 py-3 font-medium">价格</th>
          <th class="px-4 py-3 font-medium">调用限制</th>
          <th class="px-4 py-3 font-medium">状态</th>
          <th class="px-4 py-3 font-medium">操作</th>
        </tr>
      </thead>
      <tbody id="plan-table-body" class="divide-y divide-gray-100">
      </tbody>
    </table>
    <div id="plan-empty" class="py-12 text-center text-gray-400">暂无数据</div>
  </div>

  <div id="plan-rules-panel"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function statusBadge(isActive) {
    if (isActive) return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">启用</span>';
    return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">停用</span>';
  }

  async function loadPlans() {
    try {
      const resp = await fetch('/plans/api/');
      const plans = await resp.json();
      const tbody = document.getElementById('plan-table-body');
      const empty = document.getElementById('plan-empty');
      if (plans.length === 0) { empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      tbody.innerHTML = plans.map(function(p, i) {
        var bg = i % 2 === 1 ? 'bg-gray-50/50' : '';
        return '<tr class="hover:bg-blue-50/40 ' + bg + '">' +
          '<td class="px-4 py-3 font-medium text-gray-900">' + p.name + '</td>' +
          '<td class="px-4 py-3 text-gray-600">' + p.code + '</td>' +
          '<td class="px-4 py-3 text-gray-600">¥' + (p.price || '0.00') + '</td>' +
          '<td class="px-4 py-3 text-gray-600">' + (p.call_limit || '0') + '</td>' +
          '<td class="px-4 py-3">' + statusBadge(p.is_active) + '</td>' +
          '<td class="px-4 py-3">' +
            '<div class="flex items-center gap-2">' +
              '<button onclick="togglePlan(\'' + p.id + '\')" class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">' + (p.is_active ? '停用' : '启用') + '</button>' +
              '<button onclick="loadPlanRules(\'' + p.id + '\')" class="text-xs px-2 py-1 rounded border border-indigo-300 text-indigo-600 hover:bg-indigo-50">规则</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');
    } catch (e) {
      console.error('加载套餐列表失败', e);
    }
  }

  async function togglePlan(id) {
    try {
      await fetch('/plans/api/' + id + '/toggle', { method: 'POST' });
      loadPlans();
    } catch (e) {
      console.error('切换套餐状态失败', e);
    }
  }

  function loadPlanRules(planId) {
    htmx.ajax('GET', '/plans/' + planId + '/rules', '#plan-rules-panel');
  }

  loadPlans();
</script>
{% endblock %}
