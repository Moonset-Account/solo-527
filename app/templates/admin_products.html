{% extends "admin_base.html" %}
{% block title %}积分商品{% endblock %}
{% block page_title %}🎁 积分商品管理{% endblock %}
{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center">
    <div class="flex gap-3">
        <input id="f-kw" placeholder="搜索商品/SKU" class="px-3 py-2 border rounded-lg text-sm w-64">
        <button onclick="loadProducts()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">查询</button>
    </div>
    <button onclick="showProductForm()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm">+ 新建商品</button>
</div>
<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b"><tr>
            <th class="px-4 py-3 text-left">SKU</th><th class="px-4 py-3 text-left">商品名称</th>
            <th class="px-4 py-3 text-center">分类</th><th class="px-4 py-3 text-right">所需积分</th>
            <th class="px-4 py-3 text-right">成本价</th><th class="px-4 py-3 text-center">库存</th>
            <th class="px-4 py-3 text-center">已兑换</th><th class="px-4 py-3 text-center">状态</th>
            <th class="px-4 py-3 text-center">操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="9" class="text-center py-12 text-gray-400">加载中...</td></tr></tbody>
    </table>
</div>
<script>
async function loadProducts(){
    const kw=document.getElementById('f-kw').value;let url='/api/products?limit=100';if(kw)url+=`&keyword=${encodeURIComponent(kw)}`;
    const r=await fetch(url,{credentials:'include'});if(!r.ok)return;const list=await r.json();
    document.getElementById('tbody').innerHTML=list.length?list.map(p=>`
        <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-3 font-mono">${p.sku}</td>
            <td class="px-4 py-3 font-medium">${p.name} ${p.is_hot?'<span class="text-xs bg-red-100 text-red-500 px-1 rounded">热</span>':''}${p.is_new?'<span class="text-xs bg-blue-100 text-blue-500 px-1 rounded">新</span>':''}</td>
            <td class="px-4 py-3 text-center text-gray-500">${p.category||'-'}</td>
            <td class="px-4 py-3 text-right font-bold text-orange-600">${p.points_required.toLocaleString()}</td>
            <td class="px-4 py-3 text-right">¥${(p.cost_price||0).toFixed(2)}</td>
            <td class="px-4 py-3 text-center ${p.stock<10?'text-red-500':''}">${p.stock}</td>
            <td class="px-4 py-3 text-center">${p.total_exchanged||0}</td>
            <td class="px-4 py-3 text-center">${p.is_active?'<span class="text-green-500 text-xs bg-green-50 px-2 py-0.5 rounded">上架</span>':'<span class="text-gray-500 text-xs bg-gray-100 px-2 py-0.5 rounded">下架</span>'}</td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <button onclick="showVersions(${p.id})" class="text-blue-500 hover:underline mr-2">历史</button>
                <button onclick="showProductForm(${p.id})" class="text-gray-500 hover:underline">编辑</button>
            </td>
        </tr>`).join(''):'<tr><td colspan="9" class="text-center py-12 text-gray-400">暂无数据</td></tr>';
}
function showProductForm(id){
    if(id){fetch(`/api/products/${id}`,{credentials:'include'}).then(r=>r.json()).then(p=>{openModal('编辑商品',formHtml(p));document.getElementById('p-sku').disabled=true;});}
    else{openModal('新建商品',formHtml({}));}
}
function formHtml(p={}){return`
    <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
            <div><label class="text-sm text-gray-600">SKU*</label><input id="p-sku" class="w-full px-3 py-2 border rounded text-sm" value="${p.sku||''}"></div>
            <div><label class="text-sm text-gray-600">分类</label><input id="p-cat" class="w-full px-3 py-2 border rounded text-sm" value="${p.category||''}"></div>
        </div>
        <div><label class="text-sm text-gray-600">商品名称*</label><input id="p-name" class="w-full px-3 py-2 border rounded text-sm" value="${p.name||''}"></div>
        <div class="grid grid-cols-3 gap-3">
            <div><label class="text-sm text-gray-600">所需积分*</label><input id="p-points" type="number" class="w-full px-3 py-2 border rounded text-sm" value="${p.points_required||''}"></div>
            <div><label class="text-sm text-gray-600">原价(元)</label><input id="p-orig" type="number" step="0.01" class="w-full px-3 py-2 border rounded text-sm" value="${p.original_price||0}"></div>
            <div><label class="text-sm text-gray-600">成本价(元)</label><input id="p-cost" type="number" step="0.01" class="w-full px-3 py-2 border rounded text-sm" value="${p.cost_price||0}"></div>
        </div>
        <div class="grid grid-cols-3 gap-3">
            <div><label class="text-sm text-gray-600">库存</label><input id="p-stock" type="number" class="w-full px-3 py-2 border rounded text-sm" value="${p.stock||0}"></div>
            <div><label class="text-sm text-gray-600">每人限兑</label><input id="p-limit" type="number" class="w-full px-3 py-2 border rounded text-sm" value="${p.per_user_limit||1}"></div>
            <div><label class="text-sm text-gray-600">排序</label><input id="p-sort" type="number" class="w-full px-3 py-2 border rounded text-sm" value="${p.sort_order||0}"></div>
        </div>
        <div><label class="text-sm text-gray-600">描述</label><textarea id="p-desc" rows="2" class="w-full px-3 py-2 border rounded text-sm">${p.description||''}</textarea></div>
        <div class="flex gap-4 text-sm">
            <label class="flex items-center gap-1"><input id="p-hot" type="checkbox" ${p.is_hot?'checked':''}>热门</label>
            <label class="flex items-center gap-1"><input id="p-new" type="checkbox" ${p.is_new?'checked':''}>新品</label>
            <label class="flex items-center gap-1"><input id="p-active" type="checkbox" ${p.is_active!==false?'checked':''}>上架</label>
        </div>
        <div><label class="text-sm text-gray-600">变更说明</label><input id="p-summary" class="w-full px-3 py-2 border rounded text-sm" placeholder="可填写修改原因"></div>
        <button onclick="submitProduct(${p.id||0})" class="w-full py-2 bg-blue-600 text-white rounded-lg">保存</button>
    </div>`;}
async function submitProduct(id){
    const body={sku:document.getElementById('p-sku').value,name:document.getElementById('p-name').value,category:document.getElementById('p-cat').value,
        points_required:parseInt(document.getElementById('p-points').value),original_price:parseFloat(document.getElementById('p-orig').value)||0,
        cost_price:parseFloat(document.getElementById('p-cost').value)||0,stock:parseInt(document.getElementById('p-stock').value)||0,
        per_user_limit:parseInt(document.getElementById('p-limit').value)||1,sort_order:parseInt(document.getElementById('p-sort').value)||0,
        description:document.getElementById('p-desc').value,is_hot:document.getElementById('p-hot').checked,is_new:document.getElementById('p-new').checked,
        is_active:document.getElementById('p-active').checked,change_summary:document.getElementById('p-summary').value};
    const url=id?`/api/products/${id}`:'/api/products';const method=id?'PUT':'POST';
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    if(r.ok){showToast(id?'修改成功':'创建成功','success');closeModal();loadProducts();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
async function showVersions(id){const r=await fetch(`/api/products/${id}`,{credentials:'include'});if(!r.ok)return;
    const hr=await fetch(`/api/coupons/versions/0`,'');
    openModal('商品历史版本','<div class="text-center py-6 text-gray-400">请在商品详情中查看完整版本历史</div>');}
loadProducts();
</script>
{% endblock %}
