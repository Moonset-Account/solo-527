<tr class="hover:bg-blue-50/40 {% if loop.index is even %}bg-gray-50/50{% endif %}">
  <td class="px-4 py-3 font-medium text-gray-900">{{ t.name }}</td>
  <td class="px-4 py-3 text-gray-600">{{ t.code }}</td>
  <td class="px-4 py-3 text-gray-600">{{ t.contact_email or '-' }}</td>
  <td class="px-4 py-3 text-gray-600">{{ t.plan_id or '-' }}</td>
  <td class="px-4 py-3">
    {% if t.is_active %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">启用</span>
    {% else %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">停用</span>
    {% endif %}
  </td>
  <td class="px-4 py-3">
    {% if t.health_score >= 80 %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">{{ t.health_score }}</span>
    {% elif t.health_score >= 50 %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-700">{{ t.health_score }}</span>
    {% else %}
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">{{ t.health_score }}</span>
    {% endif %}
  </td>
  <td class="px-4 py-3">
    <div class="flex items-center gap-2">
      <button hx-post="/tenants/htmx/{{ t.id }}/toggle"
        hx-target="closest tr"
        hx-swap="outerHTML"
        class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">
        {{ '停用' if t.is_active else '启用' }}
      </button>
      <button onclick="loadFeatureFlags('{{ t.id }}')"
        class="text-xs px-2 py-1 rounded border border-blue-300 text-blue-600 hover:bg-blue-50">
        功能开关
      </button>
    </div>
  </td>
</tr>
