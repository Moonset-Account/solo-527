<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 mt-5">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-base font-semibold text-gray-800">功能开关 <span class="text-gray-400 font-normal text-sm">(租户: {{ tenant_id }})</span></h3>
    <button onclick="document.getElementById('add-flag-form').classList.toggle('hidden')"
      class="px-3 py-1.5 bg-blue-600 text-white text-xs rounded-lg hover:bg-blue-700 transition-colors">
      + 新增开关
    </button>
  </div>

  <div id="add-flag-form" class="hidden mb-4 p-4 bg-gray-50 rounded-lg">
    <form hx-post="/tenants/htmx/{{ tenant_id }}/feature-flags"
      hx-target="#flags-table-body"
      hx-swap="beforeend"
      hx-on::after-request="document.getElementById('add-flag-form').classList.add('hidden')">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">开关键</label>
          <input type="text" name="flag_key" required class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="flag_key">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">开关名称</label>
          <input type="text" name="flag_name" required class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="开关名称">
        </div>
      </div>
      <div class="mt-3 flex justify-end gap-2">
        <button type="button" onclick="document.getElementById('add-flag-form').classList.add('hidden')" class="px-3 py-1.5 text-xs text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">取消</button>
        <button type="submit" class="px-3 py-1.5 text-xs text-white bg-blue-600 rounded-lg hover:bg-blue-700">确认</button>
      </div>
    </form>
  </div>

  <table class="w-full text-sm">
    <thead>
      <tr class="bg-gray-50 text-left text-gray-600">
        <th class="px-4 py-2.5 font-medium">开关键</th>
        <th class="px-4 py-2.5 font-medium">开关名称</th>
        <th class="px-4 py-2.5 font-medium">状态</th>
        <th class="px-4 py-2.5 font-medium">备注</th>
        <th class="px-4 py-2.5 font-medium">操作</th>
      </tr>
    </thead>
    <tbody id="flags-table-body" class="divide-y divide-gray-100">
      {% for flag in flags %}
      <tr class="hover:bg-blue-50/40 {% if loop.index is even %}bg-gray-50/50{% endif %}">
        <td class="px-4 py-2.5 font-medium text-gray-900">{{ flag.flag_key }}</td>
        <td class="px-4 py-2.5 text-gray-600">{{ flag.flag_name }}</td>
        <td class="px-4 py-2.5">
          {% if flag.is_enabled %}
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">启用</span>
          {% else %}
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">停用</span>
          {% endif %}
        </td>
        <td class="px-4 py-2.5 text-gray-500">{{ flag.notes or '-' }}</td>
        <td class="px-4 py-2.5">
          <button hx-post="/tenants/htmx/feature-flags/{{ flag.id }}/toggle"
            hx-target="closest tr"
            hx-swap="outerHTML"
            class="text-xs px-2 py-1 rounded border border-gray-300 hover:bg-gray-100">
            {{ '停用' if flag.is_enabled else '启用' }}
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% if not flags %}
  <div class="py-8 text-center text-gray-400 text-sm">暂无功能开关</div>
  {% endif %}
</div>
