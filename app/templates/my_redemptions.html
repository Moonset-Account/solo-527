{% extends "base.html" %}
{% block title %}兑换记录{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-b from-blue-50 to-white">
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800">📦 兑换记录</h1>
            <a href="/mall" class="text-sm text-gray-500">← 返回商城</a>
        </div>
        <div class="max-w-4xl mx-auto px-4 pb-3">
            <div class="flex space-x-8">
                <a href="/mall" class="pb-2 text-gray-500 hover:text-gray-800">积分商城</a>
                <a href="/my-coupons" class="pb-2 text-gray-500 hover:text-gray-800">复购券</a>
                <a href="/my-benefits" class="pb-2 text-gray-500 hover:text-gray-800">积分权益</a>
                <a href="/my-redemptions" class="pb-2 tab-active">兑换记录</a>
            </div>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="flex gap-3 mb-6 overflow-x-auto pb-2">
            <button onclick="loadOrders('')" class="order-tab px-4 py-2 bg-blue-500 text-white rounded-full text-sm whitespace-nowrap">全部</button>
            <button onclick="loadOrders('submitted')" class="order-tab px-4 py-2 bg-white text-gray-600 rounded-full text-sm border whitespace-nowrap">待处理</button>
            <button onclick="loadOrders('processed')" class="order-tab px-4 py-2 bg-white text-gray-600 rounded-full text-sm border whitespace-nowrap">处理中</button>
            <button onclick="loadOrders('shipped')" class="order-tab px-4 py-2 bg-white text-gray-600 rounded-full text-sm border whitespace-nowrap">已发货</button>
            <button onclick="loadOrders('completed')" class="order-tab px-4 py-2 bg-white text-gray-600 rounded-full text-sm border whitespace-nowrap">已完成</button>
            <button onclick="loadOrders('cancelled')" class="order-tab px-4 py-2 bg-white text-gray-600 rounded-full text-sm border whitespace-nowrap">已取消</button>
        </div>
        <div id="order-list" class="space-y-4">
            <div class="text-center py-12 text-gray-400">加载中...</div>
        </div>
    </main>
</div>

<div id="order-detail-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b sticky top-0 bg-white z-10">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">订单详情</h3>
                <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600 text-2xl">×</button>
            </div>
        </div>
        <div id="order-detail-content" class="p-6"></div>
    </div>
</div>

<script>
const statusMap={
    pending:['待提交','bg-gray-100 text-gray-600'],
    submitted:['待处理','bg-yellow-100 text-yellow-600'],
    processed:['处理中','bg-blue-100 text-blue-600'],
    shipped:['已发货','bg-purple-100 text-purple-600'],
    completed:['已完成','bg-green-100 text-green-600'],
    cancelled:['已取消','bg-red-100 text-red-500']
};
function fmt(d){return d?new Date(d).toLocaleString('zh-CN'):'-';}
async function loadOrders(status=''){
    document.querySelectorAll('.order-tab').forEach(b=>{b.classList.remove('bg-blue-500','text-white');b.classList.add('bg-white','text-gray-600','border');});
    event&&event.target.classList.add('bg-blue-500','text-white'),event&&event.target.classList.remove('bg-white','text-gray-600','border');
    let url='/api/redemptions?limit=100';if(status)url+=`&status=${status}`;
    const r=await fetch(url,{credentials:'include'});
    if(!r.ok){if(r.status===401)window.location.href='/login';return;}
    const orders=await r.json();
    const html=orders.map(o=>{const [label,cls]=statusMap[o.status]||[o.status,'bg-gray-100'];const item=o.items&&o.items[0]?o.items[0]:{};return`
        <div class="bg-white rounded-2xl p-5 shadow-sm cursor-pointer hover:shadow transition" onclick="showDetail(${o.id})">
            <div class="flex justify-between items-start mb-3">
                <div><span class="text-xs text-gray-400">订单号：</span><span class="text-sm font-mono">${o.order_no}</span></div>
                <span class="text-xs px-3 py-1 rounded-full ${cls}">${label}</span>
            </div>
            <div class="flex gap-4">
                <div class="w-20 h-20 bg-gray-100 rounded-xl flex items-center justify-center text-3xl">${item.product_image?`<img src="${item.product_image}" class="w-full h-full object-cover rounded-xl">`:'🎁'}</div>
                <div class="flex-1">
                    <h3 class="font-semibold text-gray-800 mb-1">${item.product_name||'积分商品'}</h3>
                    <div class="text-sm text-gray-500 mb-1">数量：${o.quantity||1}</div>
                    <div class="text-orange-500 font-bold">${o.points_consumed} 积分</div>
                </div>
            </div>
            <div class="mt-3 pt-3 border-t text-xs text-gray-400 flex justify-between">
                <span>下单时间：${fmt(o.created_at)}</span>
                <span class="text-blue-500">查看详情 →</span>
            </div>
        </div>`;}).join('');
    document.getElementById('order-list').innerHTML=html||'<div class="text-center py-12 text-gray-400">暂无订单</div>';
}
async function showDetail(id){
    const r=await fetch(`/api/redemptions/${id}`,{credentials:'include'});if(!r.ok)return;
    const o=await r.json();const [label,cls]=statusMap[o.status]||[o.status,'bg-gray-100'];
    const item=o.items&&o.items[0]?o.items[0]:{};
    const h=`
        <div class="space-y-5">
            <div class="flex justify-between items-center"><span class="text-sm text-gray-500">订单号：<span class="font-mono text-gray-800">${o.order_no}</span></span><span class="text-sm px-3 py-1 rounded-full ${cls}">${label}</span></div>
            <div class="bg-gray-50 rounded-xl p-4"><div class="flex gap-4"><div class="w-20 h-20 bg-white rounded-xl flex items-center justify-center text-3xl">${item.product_image?`<img src="${item.product_image}" class="w-full h-full object-cover rounded-xl">`:'🎁'}</div><div class="flex-1"><h4 class="font-semibold mb-1">${item.product_name||'商品'}</h4><div class="text-sm text-gray-500 mb-1">数量：${o.quantity||1}</div><div class="text-orange-500 font-bold">${o.points_consumed} 积分 <span class="text-xs text-gray-400">(成本 ¥${o.cost_amount})</span></div></div></div></div>
            <div class="grid grid-cols-2 gap-4 text-sm"><div><div class="text-gray-400 mb-1">收货人</div><div class="font-medium">${o.receiver_name||'-'}</div></div><div><div class="text-gray-400 mb-1">联系电话</div><div class="font-medium">${o.receiver_phone||'-'}</div></div><div class="col-span-2"><div class="text-gray-400 mb-1">收货地址</div><div class="font-medium">${o.receiver_address||'-'}</div></div></div>
            ${o.logistics_company||o.tracking_no?`<div class="bg-blue-50 rounded-xl p-4"><div class="text-sm font-medium text-blue-600 mb-2">物流信息</div><div class="text-sm">${o.logistics_company||''} ${o.tracking_no?'运单号：'+o.tracking_no:''}</div></div>`:''}
            ${o.remark?`<div><div class="text-gray-400 text-sm mb-1">备注</div><div class="text-sm bg-yellow-50 p-3 rounded-lg">${o.remark}</div></div>`:''}
            <div class="space-y-2 pt-3 border-t text-sm">
                <div class="flex justify-between text-gray-500"><span>提交时间</span><span>${fmt(o.submitted_at)}</span></div>
                <div class="flex justify-between text-gray-500"><span>处理时间</span><span>${fmt(o.processed_at)}</span></div>
                <div class="flex justify-between text-gray-500"><span>发货时间</span><span>${fmt(o.shipped_at)}</span></div>
                <div class="flex justify-between text-gray-500"><span>完成时间</span><span>${fmt(o.completed_at)}</span></div>
            </div>
            <div id="order-attachments"></div>
            <div id="order-notes"></div>
        </div>`;
    document.getElementById('order-detail-content').innerHTML=h;
    document.getElementById('order-detail-modal').classList.remove('hidden');document.getElementById('order-detail-modal').classList.add('flex');
    loadAttachments('redemption_order',id,'order-attachments');loadNotes('redemption_order',id,'order-notes');
}
function closeDetail(){document.getElementById('order-detail-modal').classList.add('hidden');document.getElementById('order-detail-modal').classList.remove('flex');}
async function loadAttachments(type,id,elId){
    const r=await fetch(`/api/attachments?entity_type=${type}&entity_id=${id}`,{credentials:'include'});if(!r.ok)return;
    const list=await r.json();if(!list.length)return;
    document.getElementById(elId).innerHTML=`<div class="pt-3 border-t"><div class="text-sm font-medium mb-2">📎 附件</div><div class="flex flex-wrap gap-2">${list.map(a=>`<a href="${a.download_url}" class="bg-gray-100 px-3 py-2 rounded-lg text-sm hover:bg-gray-200">📄 ${a.file_name}</a>`).join('')}</div></div>`;
}
async function loadNotes(type,id,elId){
    const r=await fetch(`/api/notes?entity_type=${type}&entity_id=${id}`,{credentials:'include'});if(!r.ok)return;
    const list=await r.json();if(!list.length)return;
    document.getElementById(elId).innerHTML=`<div class="pt-3 border-t"><div class="text-sm font-medium mb-2">💬 备注</div><div class="space-y-2">${list.map(n=>`<div class="bg-blue-50 p-3 rounded-lg text-sm"><div>${n.content}</div><div class="text-xs text-gray-400 mt-1">${fmt(n.created_at)}</div></div>`).join('')}</div></div>`;
}
loadOrders();
</script>
{% endblock %}
