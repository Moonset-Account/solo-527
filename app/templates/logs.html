{% extends "base.html" %}
{% block title %}操作日志{% endblock %}

{% block content %}
<section class="page-header">
    <h1>操作日志</h1>
    <p class="muted">维修站长及所有人员操作历史，包含时间、人员、详情</p>
</section>

<div class="toolbar">
    <div class="filters">
        <input type="text" id="op-filter" placeholder="搜索操作人...">
        <button class="btn btn-secondary" onclick="refreshLogs()">查询</button>
    </div>
    <div class="actions">
        <button class="btn btn-secondary" onclick="refreshLogs()">🔄 刷新</button>
    </div>
</div>

<section class="panel">
    <div class="table-wrap">
        <table class="data-table" hx-get="/api/dispatch/logs" hx-trigger="load" hx-target="tbody" hx-swap="innerHTML">
            <thead>
                <tr>
                    <th style="width:180px">时间</th>
                    <th style="width:140px">操作人</th>
                    <th style="width:160px">操作类型</th>
                    <th>关联工单</th>
                    <th>详情</th>
                </tr>
            </thead>
            <tbody id="logs-body">
                <tr><td colspan="5" class="loading">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</section>

<script>
const actionLabels = {
    create_order:'创建工单', assign_technician:'派单', update_status:'更新状态',
    schedule:'预约安排', refund:'退款处理', review:'评价回访', update_technician:'更新师傅'
};
function refreshLogs() {
    const op = document.getElementById('op-filter').value;
    let url = '/api/dispatch/logs';
    if (op) url += '?operator=' + encodeURIComponent(op);
    fetch(url).then(r=>r.json()).then(list=>{
        const tb = document.getElementById('logs-body');
        if (!list.length) { tb.innerHTML = '<tr><td colspan="5" class="empty">暂无数据</td></tr>'; return; }
        tb.innerHTML = list.map(l => `
            <tr>
                <td class="mono">${l.created_at}</td>
                <td><strong>${l.operator}</strong></td>
                <td><span class="badge badge-info">${actionLabels[l.action_type] || l.action_type}</span></td>
                <td>${l.order_id ? `<a href="/orders/${l.order_id}" class="link-btn">#${l.order_id}</a>` : '-'}</td>
                <td class="detail-cell"><code>${JSON.stringify(l.detail || {})}</code></td>
            </tr>`).join('');
    });
}
document.addEventListener('DOMContentLoaded', refreshLogs);
</script>
{% endblock %}
