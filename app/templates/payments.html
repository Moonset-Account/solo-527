{% extends "layout.html" %}
{% set active_page = 'payments' %}
{% set page_title = '收银记录' %}
{% block main_content %}

<div class="card">
    <div class="card-header">
        <h3>新增收银</h3>
    </div>
    <form id="payment-form"
          hx-post="/api/payments"
          hx-target="#payment-table-container"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset(); showToast('收银成功', 'success');">
        <div class="two-columns">
            <div>
                <div class="form-group">
                    <label>选择顾客</label>
                    <select name="customer_id">
                        <option value="">散客</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }} - {{ c.phone }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>应收金额</label>
                    <input type="number" name="amount" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>支付方式</label>
                    <select name="payment_method">
                        <option value="cash">现金</option>
                        <option value="wechat">微信</option>
                        <option value="alipay">支付宝</option>
                        <option value="card">刷卡</option>
                    </select>
                </div>
            </div>
            <div>
                <div class="form-group">
                    <label>关联疗程卡</label>
                    <select name="treatment_card_id">
                        <option value="">不关联</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>实收金额</label>
                    <input type="number" name="actual_amount" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>款项类型</label>
                    <select name="payment_type">
                        <option value="card_purchase">购卡</option>
                        <option value="treatment">疗程服务</option>
                        <option value="product">产品销售</option>
                        <option value="other">其他</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>备注</label>
            <textarea name="note" rows="2" placeholder="可选"></textarea>
        </div>
        <button type="submit" class="btn btn-success">+ 确认收款</button>
    </form>
</div>

<div class="card" style="margin-top: 20px;">
    <div class="card-header">
        <h3>收银记录</h3>
        <span id="total-count">共 {{ total_payments }} 条</span>
    </div>
    <div class="filter-bar" id="payment-filters">
        <input type="text" name="keyword" placeholder="搜索单号/顾客/手机号..." 
               style="flex: 1; min-width: 200px;"
               hx-get="/api/payments?page=1&limit=10"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#payment-table-container"
               hx-swap="innerHTML"
               hx-include="#payment-filters">
        <select name="status"
                hx-get="/api/payments?page=1&limit=10"
                hx-trigger="change"
                hx-target="#payment-table-container"
                hx-swap="innerHTML"
                hx-include="#payment-filters">
            <option value="">全部状态</option>
            <option value="paid">已支付</option>
            <option value="pending">待支付</option>
            <option value="refunded">已退款</option>
            <option value="partial">部分支付</option>
        </select>
        <select name="cashier_id"
                hx-get="/api/payments?page=1&limit=10"
                hx-trigger="change"
                hx-target="#payment-table-container"
                hx-swap="innerHTML"
                hx-include="#payment-filters">
            <option value="">全部负责人</option>
            {% for u in cashiers %}
            <option value="{{ u.id }}">{{ u.full_name }}</option>
            {% endfor %}
        </select>
        <select name="has_diff"
                hx-get="/api/payments?page=1&limit=10"
                hx-trigger="change"
                hx-target="#payment-table-container"
                hx-swap="innerHTML"
                hx-include="#payment-filters">
            <option value="">全部</option>
            <option value="true">有差异</option>
            <option value="false">无差异</option>
        </select>
        <select name="payment_method"
                hx-get="/api/payments?page=1&limit=10"
                hx-trigger="change"
                hx-target="#payment-table-container"
                hx-swap="innerHTML"
                hx-include="#payment-filters">
            <option value="">全部支付方式</option>
            <option value="cash">现金</option>
            <option value="wechat">微信</option>
            <option value="alipay">支付宝</option>
            <option value="card">刷卡</option>
        </select>
        <input type="date" name="start_date"
               hx-get="/api/payments?page=1&limit=10"
               hx-trigger="change"
               hx-target="#payment-table-container"
               hx-swap="innerHTML"
               hx-include="#payment-filters">
        <input type="date" name="end_date"
               hx-get="/api/payments?page=1&limit=10"
               hx-trigger="change"
               hx-target="#payment-table-container"
               hx-swap="innerHTML"
               hx-include="#payment-filters">
        <div class="actions">
            <button class="btn btn-sm btn-default"
                    hx-get="/api/payments?page=1&limit=10"
                    hx-target="#payment-table-container"
                    hx-swap="innerHTML"
                    hx-on:click="document.getElementById('payment-filters').reset();">重置</button>
            <button class="btn btn-sm btn-primary"
                    hx-get="/api/payments?page=1&limit=10"
                    hx-target="#payment-table-container"
                    hx-swap="innerHTML"
                    hx-include="#payment-filters">搜索</button>
        </div>
    </div>
    <div id="payment-table-container"
         hx-get="/api/payments?page=1&limit=10"
         hx-trigger="load"
         hx-swap="innerHTML">
        <table>
            <thead>
            <tr>
                <th>单号</th>
                <th>顾客</th>
                <th>金额</th>
                <th>实收</th>
                <th>差异</th>
                <th>收银员</th>
                <th>支付方式</th>
                <th>时间</th>
                <th>状态</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="9" class="empty-state">加载中...</td></tr>
            </tbody>
        </table>
        <div class="pagination"></div>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script>
</script>
{% endblock %}
