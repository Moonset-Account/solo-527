{% extends "layout.html" %}
{% set active_page = 'comments' %}
{% set page_title = '评论审核' %}
{% block main_content %}

<div class="card">
    <div class="card-header">
        <h3>评论列表</h3>
        <span id="total-count">共 0 条</span>
    </div>
    <div class="filter-bar" id="comments-filters">
        <select name="filter_status"
                hx-get="/api/comments?page=1&limit=10"
                hx-trigger="change"
                hx-target="#comments-container"
                hx-swap="innerHTML"
                hx-include="#comments-filters">
            <option value="pending">待审核</option>
            <option value="">全部</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option>
        </select>
        <input type="text" name="keyword" placeholder="搜索内容/用户名..."
               style="flex: 1; min-width: 200px;"
               hx-get="/api/comments?page=1&limit=10"
               hx-trigger="keyup changed delay:500ms, search"
               hx-target="#comments-container"
               hx-swap="innerHTML"
               hx-include="#comments-filters">
        <div class="actions">
            <button class="btn btn-sm btn-default"
                    hx-get="/api/comments?page=1&limit=10"
                    hx-target="#comments-container"
                    hx-swap="innerHTML"
                    hx-on:click="document.getElementById('comments-filters').reset();">重置</button>
            <button class="btn btn-sm btn-primary"
                    hx-get="/api/comments?page=1&limit=10"
                    hx-target="#comments-container"
                    hx-swap="innerHTML"
                    hx-include="#comments-filters">搜索</button>
        </div>
    </div>
    <div id="comments-container"
         hx-get="/api/comments?page=1&limit=10"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div id="comments-list">
            <div class="empty-state">加载中...</div>
        </div>
        <div class="pagination"></div>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script>
</script>
{% endblock %}
