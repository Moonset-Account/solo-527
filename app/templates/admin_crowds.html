{% extends "admin_base.html" %}
{% block title %}人群管理{% endblock %}
{% block page_title %}👨‍👩‍👧 人群管理{% endblock %}
{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center">
    <div class="flex gap-3">
        <input id="f-kw" placeholder="搜索人群名称/编码" class="px-3 py-2 border rounded-lg text-sm w-64">
        <button onclick="load()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">查询</button>
    </div>
    <button onclick="showForm()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm">+ 新建人群</button>
</div>
<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b"><tr>
            <th class="px-4 py-3 text-left">编码</th><th class="px-4 py-3 text-left">名称</th>
            <th class="px-4 py-3 text-center">类型</th><th class="px-4 py-3 text-right">预估人数</th>
            <th class="px-4 py-3 text-right">实际人数</th><th class="px-4 py-3 text-center">状态</th>
            <th class="px-4 py-3 text-left">创建时间</th><th class="px-4 py-3 text-center">操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="8" class="text-center py-12 text-gray-400">加载中...</td></tr></tbody>
    </table>
</div>
<script>
async function load(){
    const kw=document.getElementById('f-kw').value;let url='/api/crowds?limit=100';if(kw)url+=`&keyword=${encodeURIComponent(kw)}`;
    const r=await fetch(url,{credentials:'include'});if(!r.ok)return;const list=await r.json();
    document.getElementById('tbody').innerHTML=list.length?list.map(c=>`
        <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-3 font-mono">${c.code}</td>
            <td class="px-4 py-3 font-medium">${c.name}</td>
            <td class="px-4 py-3 text-center"><span class="text-xs px-2 py-0.5 rounded ${c.segment_type==='dynamic'?'bg-blue-50 text-blue-600':'bg-purple-50 text-purple-600'}">${c.segment_type==='dynamic'?'动态':'静态'}</span></td>
            <td class="px-4 py-3 text-right">${c.estimated_count||0}</td>
            <td class="px-4 py-3 text-right font-medium">${c.actual_count||0}</td>
            <td class="px-4 py-3 text-center">${c.is_active?'<span class="text-green-500 text-xs">启用</span>':'<span class="text-gray-400 text-xs">停用</span>'}</td>
            <td class="px-4 py-3 text-gray-500">${fmt(c.created_at)}</td>
            <td class="px-4 py-3 text-center whitespace-nowrap">
                <button onclick="showVersions(${c.id})" class="text-blue-500 hover:underline mr-2">历史</button>
                <button onclick="showForm(${c.id})" class="text-gray-500 hover:underline">编辑</button>
            </td>
        </tr>`).join(''):'<tr><td colspan="8" class="text-center py-12 text-gray-400">暂无数据</td></tr>';
}
function showForm(id){
    if(id){fetch(`/api/crowds/${id}`,{credentials:'include'}).then(r=>r.json()).then(c=>openModal('编辑人群',formHtml(c)));}
    else{openModal('新建人群',formHtml({}));}
}
function formHtml(c={}){return`
    <div class="space-y-3">
        <div><label class="text-sm text-gray-600">人群名称*</label><input id="c-name" class="w-full px-3 py-2 border rounded text-sm" value="${c.name||''}"></div>
        <div class="grid grid-cols-2 gap-3">
            <div><label class="text-sm text-gray-600">类型</label><select id="c-type" class="w-full px-3 py-2 border rounded text-sm"><option value="dynamic">动态人群</option><option value="static">静态人群</option></select></div>
            <div><label class="text-sm text-gray-600">会员ID(逗号分隔)</label><input id="c-ids" class="w-full px-3 py-2 border rounded text-sm" value="${(c.member_ids||[]).join(',')}"></div>
        </div>
        <div><label class="text-sm text-gray-600">描述</label><textarea id="c-desc" rows="2" class="w-full px-3 py-2 border rounded text-sm">${c.description||''}</textarea></div>
        <div><label class="text-sm text-gray-600">变更说明</label><input id="c-summary" class="w-full px-3 py-2 border rounded text-sm"></div>
        <button onclick="submitForm(${c.id||0})" class="w-full py-2 bg-blue-600 text-white rounded-lg">保存</button>
    </div>`;}
async function submitForm(id){
    const ids=document.getElementById('c-ids').value.split(/[,，\s]+/).filter(Boolean).map(Number);
    const body={name:document.getElementById('c-name').value,segment_type:document.getElementById('c-type').value,
        member_ids:ids,description:document.getElementById('c-desc').value,change_summary:document.getElementById('c-summary').value};
    const url=id?`/api/crowds/${id}`:'/api/crowds';const method=id?'PUT':'POST';
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    if(r.ok){showToast(id?'修改成功':'创建成功','success');closeModal();load();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
async function showVersions(id){const r=await fetch(`/api/crowds/versions/${id}`,{credentials:'include'});if(!r.ok)return;const v=await r.json();
    openModal('历史版本',`<div class="space-y-3 max-h-96 overflow-y-auto">${v.map(x=>`
        <div class="p-3 bg-gray-50 rounded border-l-4 border-blue-400">
            <div class="flex justify-between text-sm"><span class="font-medium">v${x.version} - ${x.name||''}</span><span class="text-gray-400">${fmt(x.created_at)}</span></div>
            <div class="text-xs text-gray-500 mt-1">${x.change_summary||''}</div>
        </div>`).join('')||'<div class="text-gray-400 text-center py-6">暂无版本</div>'}</div>`);}
load();
</script>
{% endblock %}
