{% extends "base.html" %}
{% block title %}注册 - 宠物洗护预约商城{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-box">
        <h1>🐾 注册账号</h1>
        <p>创建您的宠物洗护预约账号</p>
        <div id="register-alert"></div>
        <form id="register-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" required placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="full_name" placeholder="请输入姓名">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" required placeholder="至少6位">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="role">
                    <option value="customer">客户</option>
                    <option value="staff">员工</option>
                    <option value="manager">店长</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <button type="button" onclick="doRegister()" class="btn btn-primary w-full mb-4">注 册</button>
        </form>
        <p class="text-sm text-gray" style="text-align:center;">
            已有账号？<a href="/login" style="color:#667eea;">去登录</a>
        </p>
    </div>
</div>
<script>
async function doRegister() {
    const data = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        full_name: document.getElementById('full_name').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
    };
    const alertDiv = document.getElementById('register-alert');
    try {
        const resp = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (resp.ok) {
            alertDiv.innerHTML = '<div class="alert alert-success">注册成功！正在跳转到登录页...</div>';
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            const err = await resp.json();
            alertDiv.innerHTML = `<div class="alert alert-error">${err.detail || '注册失败'}</div>`;
        }
    } catch (e) {
        alertDiv.innerHTML = '<div class="alert alert-error">网络错误，请重试</div>';
    }
}
</script>
{% endblock %}
