{% extends "layout.html" %}
{% set active_page = 'customers' %}
{% set page_title = '顾客管理' %}
{% block main_content %}

<div class="filter-bar" id="customer-filters">
    <input type="text" name="keyword" placeholder="搜索姓名/手机号..." 
           style="flex: 1; min-width: 200px;"
           hx-get="/api/customers?page=1&limit=10"
           hx-trigger="keyup changed delay:500ms"
           hx-target="#customers-container"
           hx-swap="innerHTML"
           hx-include="#customer-filters">
    <select name="level"
            hx-get="/api/customers?page=1&limit=10"
            hx-trigger="change"
            hx-target="#customers-container"
            hx-swap="innerHTML"
            hx-include="#customer-filters">
        <option value="">全部会员等级</option>
        <option value="normal">普通会员</option>
        <option value="silver">银卡会员</option>
        <option value="gold">金卡会员</option>
        <option value="platinum">铂金会员</option>
    </select>
    <div class="actions">
        <button class="btn btn-success"
                hx-on:click="document.getElementById('customer-form').reset(); document.getElementById('customer-id').value = ''; document.getElementById('modal-title').textContent = '新增顾客'; document.getElementById('customer-form').setAttribute('hx-post', '/api/customers'); document.getElementById('customer-form').removeAttribute('hx-put'); document.getElementById('modal').style.display = 'flex';">+ 新增顾客</button>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3>顾客列表</h3>
        <span id="total-count">共 0 条</span>
    </div>
    <div id="customers-container"
         hx-get="/api/customers?page=1&limit=10"
         hx-trigger="load"
         hx-swap="innerHTML">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>手机号</th>
                <th>性别</th>
                <th>生日</th>
                <th>注册时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="7" class="empty-state">加载中...</td></tr>
            </tbody>
        </table>
        <div class="pagination"></div>
    </div>
</div>

<div id="modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">新增顾客</h3>
            <button class="modal-close" hx-on:click="document.getElementById('modal').style.display = 'none';">&times;</button>
        </div>
        <form id="customer-form"
              hx-post="/api/customers"
              hx-target="#customers-container"
              hx-swap="innerHTML"
              hx-include="#customer-filters"
              hx-on::after-request="document.getElementById('modal').style.display = 'none'; showToast('保存成功', 'success');">
            <input type="hidden" id="customer-id" name="id">
            <div id="customer-edit-form"></div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label>性别</label>
                <select id="gender" name="gender">
                    <option value="">请选择</option>
                    <option value="女">女</option>
                    <option value="男">男</option>
                </select>
            </div>
            <div class="form-group">
                <label>生日</label>
                <input type="date" id="birthday" name="birthday">
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="note" name="note" rows="2"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" hx-on:click="document.getElementById('modal').style.display = 'none';">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block page_scripts %}
<script>
document.body.addEventListener('htmx:afterRequest', function(evt) {
    const elt = evt.detail.elt;
    if (elt.getAttribute('hx-get') && elt.getAttribute('hx-get').includes('/api/customers/') && !elt.getAttribute('hx-get').includes('?')) {
        const data = evt.detail.xhr.response;
        try {
            const customer = JSON.parse(data);
            document.getElementById('customer-id').value = customer.id;
            document.getElementById('name').value = customer.name;
            document.getElementById('phone').value = customer.phone;
            document.getElementById('gender').value = customer.gender || '';
            document.getElementById('birthday').value = customer.birthday || '';
            document.getElementById('note').value = customer.note || '';
            const form = document.getElementById('customer-form');
            form.setAttribute('hx-put', `/api/customers/${customer.id}`);
            form.removeAttribute('hx-post');
        } catch (e) {
            console.error('Failed to parse customer data:', e);
        }
    }
});

document.getElementById('customer-form').addEventListener('submit', function(e) {
    const form = this;
    const id = document.getElementById('customer-id').value;
    if (id) {
        form.setAttribute('hx-put', `/api/customers/${id}`);
        form.removeAttribute('hx-post');
    } else {
        form.setAttribute('hx-post', '/api/customers');
        form.removeAttribute('hx-put');
    }
});
</script>
{% endblock %}
