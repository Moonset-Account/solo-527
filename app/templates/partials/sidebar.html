<div class="fixed left-0 top-0 h-full w-64 bg-gray-900 text-white flex flex-col z-50">
    <div class="p-6 border-b border-gray-700">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
                <i class="fas fa-building text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg">供应商管理</h1>
                <p class="text-xs text-gray-400">准入管理系统</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 py-4 overflow-y-auto">
        <div class="px-4 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">主导航</div>
        <a href="/dashboard" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if request.url.path == '/dashboard' %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-tachometer-alt w-5 mr-3"></i>
            <span>仪表盘</span>
        </a>
        <a href="/purchase" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/purchase' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-file-alt w-5 mr-3"></i>
            <span>采购需求</span>
        </a>
        <a href="/supplier" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/supplier' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-truck w-5 mr-3"></i>
            <span>供应商管理</span>
        </a>
        {% if current_user.role in ['auditor', 'manager', 'admin'] %}
        <a href="/approval" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/approval' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-check-circle w-5 mr-3"></i>
            <span>审批管理</span>
            <span id="pendingBadge" class="ml-auto bg-danger text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
        </a>
        {% endif %}
        <a href="/price" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/price' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-chart-line w-5 mr-3"></i>
            <span>价格看板</span>
        </a>
        <a href="/delivery" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/delivery' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-shipping-fast w-5 mr-3"></i>
            <span>交付差异</span>
        </a>
        <a href="/notifications" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/notifications' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-bell w-5 mr-3"></i>
            <span>通知中心</span>
            <span id="notificationBadge" class="ml-auto bg-danger text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
        </a>
        {% if current_user.role == 'admin' %}
        <div class="px-4 mt-6 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">系统管理</div>
        <a href="/approval/config" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/approval/config' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-sitemap w-5 mr-3"></i>
            <span>审批层级</span>
        </a>
        <a href="/admin/invoice-status" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/admin/invoice-status' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-file-invoice w-5 mr-3"></i>
            <span>发票状态</span>
        </a>
        <a href="/admin/spec-attachments" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/admin/spec-attachments' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-clipboard-list w-5 mr-3"></i>
            <span>规格附件</span>
        </a>
        <a href="/admin/users" class="nav-item flex items-center px-6 py-3 text-gray-300 hover:bg-gray-800 hover:text-white transition {% if '/admin/users' in request.url.path %}bg-gray-800 text-white border-l-4 border-primary{% endif %}">
            <i class="fas fa-users-cog w-5 mr-3"></i>
            <span>用户管理</span>
        </a>
        {% endif %}
    </nav>
    <div class="p-4 border-t border-gray-700">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center">
                <i class="fas fa-user"></i>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">{{ current_user.username }}</p>
                <p class="text-xs text-gray-400">{{ current_user.role }}</p>
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-white transition" title="退出登录">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>
</div>
