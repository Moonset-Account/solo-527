<div class="overflow-x-auto">
    <table class="w-full text-sm">
        <thead>
            <tr class="bg-gray-800 border-b border-gray-700">
                <th class="text-left py-3 px-4 font-medium text-gray-400">日期</th>
                <th class="text-left py-3 px-4 font-medium text-gray-400">峰值功率(kW)</th>
                <th class="text-left py-3 px-4 font-medium text-gray-400">发生时段</th>
                <th class="text-left py-3 px-4 font-medium text-gray-400">操作</th>
            </tr>
        </thead>
        <tbody>
            {% for peak in peaks %}
            <tr class="border-b border-gray-700 hover:bg-gray-700/50 transition cursor-pointer" hx-get="/statistics/strategy-failure/{{ peak.alarm_id }}" hx-target="#trace-chain-detail" hx-swap="innerHTML">
                <td class="py-3 px-4 text-gray-300">{{ peak.record_date }}</td>
                <td class="py-3 px-4 font-mono text-orange-400 font-medium">{{ peak.peak_kw|round(2) }}</td>
                <td class="py-3 px-4 text-gray-300">{{ peak.hour }}时</td>
                <td class="py-3 px-4">
                    <span class="text-emerald-400 hover:text-emerald-300 text-xs font-medium transition">查看追踪链</span>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="py-8 text-center text-gray-500">暂无能耗峰值数据</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
