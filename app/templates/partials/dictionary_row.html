<tr class="border-b border-gray-700 hover:bg-gray-700/50 transition" id="dict-row-{{ entry.id }}">
    <td class="py-3 px-4">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-500/20 text-blue-400">{{ entry.dict_code }}</span>
    </td>
    <td class="py-3 px-4 font-mono text-gray-300 text-xs">{{ entry.dict_key }}</td>
    <td class="py-3 px-4 text-gray-200">{{ entry.dict_value }}</td>
    <td class="py-3 px-4 text-gray-400">{{ entry.label if entry.label else '--' }}</td>
    <td class="py-3 px-4">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-700 text-gray-400">v{{ entry.version }}</span>
    </td>
    <td class="py-3 px-4">
        {% if entry.is_active %}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400">启用</span>
        {% else %}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-500/20 text-red-400">禁用</span>
        {% endif %}
    </td>
    <td class="py-3 px-4">
        <div class="flex items-center space-x-2">
            <button hx-get="/dictionary/{{ entry.id }}/versions" hx-target="#version-history-modal" hx-swap="innerHTML" onclick="document.getElementById('version-history-modal').classList.remove('hidden')" class="text-blue-400 hover:text-blue-300 text-xs font-medium transition">版本</button>
            <button hx-put="/dictionary/{{ entry.id }}" hx-target="#dict-row-{{ entry.id }}" hx-swap="outerHTML" class="text-emerald-400 hover:text-emerald-300 text-xs font-medium transition">编辑</button>
            <button hx-post="/dictionary/{{ entry.id }}/rollback" hx-target="#dict-row-{{ entry.id }}" hx-swap="outerHTML" hx-vals='{"target_version": "{{ entry.version - 1 }}"}' hx-confirm="确定要回滚到上一版本吗？" class="text-red-400 hover:text-red-300 text-xs font-medium transition">回滚</button>
        </div>
    </td>
</tr>
