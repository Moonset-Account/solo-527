<div class="modal-backdrop" @click.self="$dispatch('close-modal')">
  <div class="modal" style="max-width:540px;">
    <div class="modal-header">
      <h3>预存充值 · {{ client_name or '客户预存账户' }}</h3>
      <button class="icon-btn" @click="$dispatch('close-modal')">✕</button>
    </div>
    <form method="POST" action="{{ url_for('admin_prepaid_recharge', account_id=account.id) }}" hx-post="{{ url_for('admin_prepaid_recharge', account_id=account.id) }}" hx-swap="outerHTML" hx-target="this .modal">
      <div class="modal-body">
        <div class="info-banner" style="background:var(--qh-blue-50);border:1px solid var(--qh-blue-200);padding:12px 16px;border-radius:8px;margin-bottom:16px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <div style="color:var(--qh-blue-700);font-weight:500;font-size:12px;">客户</div>
              <div style="font-weight:600;margin-top:2px;">{{ client_name or '—' }}</div>
              {% if client_company %}<div style="font-size:12px;color:var(--qh-gray-500);margin-top:2px;">{{ client_company }}</div>{% endif %}
            </div>
            <div style="text-align:right;">
              <div style="color:var(--qh-blue-700);font-weight:500;font-size:12px;">当前余额</div>
              <div style="font-size:22px;font-weight:700;color:var(--qh-blue-600);font-family:'JetBrains Mono',monospace;margin-top:2px;">¥{{ "{:,.2f}".format(account.current_balance) }}</div>
            </div>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-item" style="grid-column:span 2;">
            <label>充值金额 (元)</label>
            <input type="number" step="0.01" min="0" name="amount" placeholder="请输入充值金额" required>
          </div>
          <div class="form-item">
            <label>充值方式</label>
            <select name="method">
              <option value="BANK_TRANSFER">银行转账</option>
              <option value="ONLINE_PAY">在线支付</option>
              <option value="CASH">现金</option>
              <option value="MANUAL">人工调整</option>
            </select>
          </div>
          <div class="form-item">
            <label>充值日期</label>
            <input type="date" name="recharged_at" required>
          </div>
          <div class="form-item" style="grid-column:span 2;">
            <label>备注说明</label>
            <textarea name="remark" rows="2" placeholder="转账单号/用途说明等"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" @click="$dispatch('close-modal')">取消</button>
        <button type="submit" class="btn btn-primary">确认充值</button>
      </div>
    </form>
  </div>
</div>
