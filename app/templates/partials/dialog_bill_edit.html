<div class="modal-backdrop" @click.self="$dispatch('close-modal')">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h3>编辑账单 · {{ bill.bill_no }}</h3>
      <button class="icon-btn" @click="$dispatch('close-modal')">✕</button>
    </div>
    <form method="POST" action="{{ url_for('admin_bill_edit', bill_id=bill.id) }}" hx-post="{{ url_for('admin_bill_edit', bill_id=bill.id) }}" hx-swap="outerHTML" hx-target="this .modal" onsubmit="return confirm('确认保存修改？');">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-item">
            <label>账期开始</label>
            <input type="date" name="period_start" value="{{ bill.period_start }}" required>
          </div>
          <div class="form-item">
            <label>账期结束</label>
            <input type="date" name="period_end" value="{{ bill.period_end }}" required>
          </div>
          <div class="form-item">
            <label>签发日期</label>
            <input type="date" name="issue_date" value="{{ bill.issue_date }}" required>
          </div>
          <div class="form-item">
            <label>到期日期</label>
            <input type="date" name="due_date" value="{{ bill.due_date }}" required>
          </div>
          <div class="form-item" style="grid-column:span 2;">
            <label>账单金额 (元)</label>
            <input type="number" step="0.01" min="0" name="total_amount" value="{{ bill.total_amount }}" required>
          </div>
          <div class="form-item" style="grid-column:span 2;">
            <label>账单状态</label>
            <select name="status">
              <option value="DRAFT" {% if bill.status == 'DRAFT' %}selected{% endif %}>草稿</option>
              <option value="ISSUED" {% if bill.status == 'ISSUED' %}selected{% endif %}>已签发</option>
              <option value="PARTIAL" {% if bill.status == 'PARTIAL' %}selected{% endif %}>部分回款</option>
              <option value="PAID" {% if bill.status == 'PAID' %}selected{% endif %}>已全额</option>
              <option value="OVERDUE" {% if bill.status == 'OVERDUE' %}selected{% endif %}>已逾期</option>
              <option value="VOID" {% if bill.status == 'VOID' %}selected{% endif %}>作废</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" @click="$dispatch('close-modal')">取消</button>
        <button type="submit" class="btn btn-primary">保存修改</button>
      </div>
    </form>
  </div>
</div>
