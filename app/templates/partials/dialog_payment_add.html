<div class="modal-backdrop" @click.self="$dispatch('close-modal')">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3>登记回款 · {{ bill.bill_no }}</h3>
      <button class="icon-btn" @click="$dispatch('close-modal')">✕</button>
    </div>
    <form method="POST" action="{{ url_for('admin_payment_add', bill_id=bill.id) }}" hx-post="{{ url_for('admin_payment_add', bill_id=bill.id) }}" hx-swap="outerHTML" hx-target="this .modal" hx-encoding="multipart/form-data">
      <div class="modal-body">
        <div class="info-banner" style="background:var(--qh-blue-50);border:1px solid var(--qh-blue-200);padding:12px 16px;border-radius:8px;margin-bottom:16px;">
          <div style="color:var(--qh-blue-700);font-weight:500;">账单剩余应收</div>
          <div style="font-size:24px;font-weight:700;color:var(--qh-red-600);font-family:'JetBrains Mono',monospace;margin-top:4px;">¥{{ "{:,.2f}".format(remaining) }}</div>
        </div>
        <div class="form-grid">
          <div class="form-item">
            <label>回款金额 (元)</label>
            <input type="number" step="0.01" min="0" max="{{ remaining }}" name="amount" value="{{ remaining }}" required>
          </div>
          <div class="form-item">
            <label>回款方式</label>
            <select name="method">
              <option value="BANK_TRANSFER">银行转账</option>
              <option value="ONLINE_PAY">在线支付</option>
              <option value="PREPAID">预存抵扣</option>
              <option value="CASH">现金</option>
              <option value="OTHER">其他</option>
            </select>
          </div>
          <div class="form-item">
            <label>回款日期</label>
            <input type="date" name="paid_at" value="{{ 'now' }}" required>
          </div>
          <div class="form-item">
            <label>关联流水 (可选)</label>
            <select name="transaction_id">
              <option value="">— 手动登记 —</option>
            </select>
          </div>
          <div class="form-item" style="grid-column:span 2;">
            <label>备注说明</label>
            <textarea name="remark" rows="2" placeholder="银行回单号/备注等"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" @click="$dispatch('close-modal')">取消</button>
        <button type="submit" class="btn btn-primary">确认登记</button>
      </div>
    </form>
  </div>
</div>
