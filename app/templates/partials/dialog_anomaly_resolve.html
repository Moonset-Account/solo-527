<div class="modal-backdrop" @click.self="$dispatch('close-modal')">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h3>处理异常 · #{{ anomaly.code }}</h3>
      <button class="icon-btn" @click="$dispatch('close-modal')">✕</button>
    </div>
    <form method="POST" action="{{ url_for('admin_anomaly_resolve', anomaly_id=anomaly.id) }}" hx-post="{{ url_for('admin_anomaly_resolve', anomaly_id=anomaly.id) }}" hx-swap="outerHTML" hx-target="this .modal">
      <div class="modal-body">
        <div class="anomaly-info" style="background:var(--qh-red-50);border:1px solid var(--qh-red-200);border-radius:10px;padding:14px;margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <span class="severity-dot severity-{{ anomaly.severity|lower }}" style="width:8px;height:8px;border-radius:50%;background:{% if anomaly.severity == 'CRITICAL' %}var(--qh-red-600){% elif anomaly.severity == 'HIGH' %}var(--qh-orange-500){% elif anomaly.severity == 'MEDIUM' %}var(--qh-amber-500){% else %}var(--qh-gray-400){% endif %};display:inline-block;"></span>
            <span style="font-weight:600;color:var(--qh-red-700);">{{ anomaly.title }}</span>
          </div>
          <div style="font-size:13px;color:var(--qh-gray-700);line-height:1.6;">{{ anomaly.description }}</div>
          {% if anomaly.metadata %}
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--qh-red-200);font-size:12px;color:var(--qh-gray-600);font-family:'JetBrains Mono',monospace;">
            元数据: {{ anomaly.metadata | tojson }}
          </div>
          {% endif %}
        </div>
        <div class="form-grid">
          <div class="form-item" style="grid-column:span 2;">
            <label>处理方式</label>
            <select name="action" required>
              <option value="">— 请选择 —</option>
              <option value="RESOLVED">已修复（标记为已解决）</option>
              <option value="MANUAL">需人工后续跟进</option>
              <option value="EXPECTED">预期情况，无需处理</option>
              <option value="RECONCILED">已对账确认差异</option>
            </select>
          </div>
          <div class="form-item" style="grid-column:span 2;">
            <label>处理说明</label>
            <textarea name="resolution_note" rows="3" placeholder="请说明异常原因和处理方式，会记录到处理历史中" required></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" @click="$dispatch('close-modal')">取消</button>
        <button type="submit" class="btn btn-primary">提交处理</button>
      </div>
    </form>
  </div>
</div>
