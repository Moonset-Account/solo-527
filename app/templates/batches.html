{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">📦 批次管理</h1>
            <p class="text-gray-500 mt-1">管理采收批次，追踪批次处理进度</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">新建批次</h2>
                <form id="batch-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">批次编码</label>
                        <input type="text" name="code" required placeholder="如：BT20240601001"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">关联采收记录</label>
                        <select name="harvest_id" required id="harvest-select"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="">请选择采收记录</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">品种</label>
                        <select name="variety_id" required id="variety-select"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="">请选择品种</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">批次日期</label>
                        <input type="date" name="batch_date" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                        <select name="status"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="harvested">已采收</option>
                            <option value="sorting">分选中</option>
                            <option value="packed">已包装</option>
                            <option value="sold">已销售</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">重量 (kg)</label>
                        <input type="number" name="weight_kg" step="0.01" required placeholder="1000.00"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">容器数量</label>
                        <input type="number" name="container_count" placeholder="50"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">存储位置</label>
                        <input type="text" name="storage_location" placeholder="如：A区-3号冷库"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">质量等级</label>
                        <select name="quality_grade"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="">请选择等级</option>
                            <option value="A">A级 (优质)</option>
                            <option value="B">B级 (良好)</option>
                            <option value="C">C级 (合格)</option>
                            <option value="D">D级 (次品)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                        <textarea name="notes" rows="3" placeholder="填写备注信息..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm resize-none"></textarea>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" name="run_auto_chain" id="run_auto_chain" checked value="true"
                            class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <label for="run_auto_chain" class="text-sm text-gray-700">启用自动处理链</label>
                    </div>

                    <button type="submit"
                        class="w-full bg-primary-600 text-white py-2.5 px-4 rounded-lg font-medium hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 transition-colors">
                        创建批次
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                <div class="p-5 border-b border-gray-100 flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-gray-800">批次列表</h2>
                    <div class="flex items-center gap-2">
                        <input type="text" placeholder="搜索编码..." class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <select class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            <option value="">全部状态</option>
                            <option value="harvested">已采收</option>
                            <option value="sorting">分选中</option>
                            <option value="packed">已包装</option>
                            <option value="sold">已销售</option>
                        </select>
                        <button onclick="loadBatches()" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition-colors">
                            刷新
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">编码</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">品种</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">重量</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">处理人</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">处理时间</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="batch-list" class="divide-y divide-gray-100">
                            <tr>
                                <td colspan="9" class="px-4 py-12 text-center text-gray-400">
                                    <div class="animate-spin w-8 h-8 border-2 border-primary-500 border-t-transparent rounded-full mx-auto mb-3"></div>
                                    加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="px-5 py-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500" id="pagination-info">
                    <span>共 0 条记录</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const authHeaders = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

    function getBatchStatusClass(status) {
        switch(status) {
            case 'harvested': return 'bg-gray-100 text-gray-700';
            case 'sorting': return 'bg-blue-100 text-blue-700';
            case 'packed': return 'bg-yellow-100 text-yellow-700';
            case 'sold': return 'bg-green-100 text-green-700';
            default: return 'bg-gray-100 text-gray-700';
        }
    }

    function getBatchStatusText(status) {
        switch(status) {
            case 'harvested': return '已采收';
            case 'sorting': return '分选中';
            case 'packed': return '已包装';
            case 'sold': return '已销售';
            default: return status;
        }
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleString('zh-CN', { 
            year: 'numeric', 
            month: '2-digit', 
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function loadHarvests() {
        fetch('/api/harvest/harvests?page_size=100', { headers: authHeaders })
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById('harvest-select');
                if (data.data) {
                    data.data.forEach(h => {
                        const option = document.createElement('option');
                        option.value = h.id;
                        option.textContent = `${h.code} - ${h.harvest_date || ''}`;
                        select.appendChild(option);
                    });
                }
            })
            .catch(() => {});
    }

    function loadVarieties() {
        fetch('/api/harvest/varieties?page_size=100', { headers: authHeaders })
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById('variety-select');
                if (data.data) {
                    data.data.forEach(v => {
                        const option = document.createElement('option');
                        option.value = v.id;
                        option.textContent = `${v.code} - ${v.name}`;
                        select.appendChild(option);
                    });
                }
            })
            .catch(() => {});
    }

    function loadBatches() {
        const tbody = document.getElementById('batch-list');
        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="px-4 py-12 text-center text-gray-400">
                    <div class="animate-spin w-8 h-8 border-2 border-primary-500 border-t-transparent rounded-full mx-auto mb-3"></div>
                    加载中...
                </td>
            </tr>
        `;

        fetch('/api/harvest/batches?page_size=50', { headers: authHeaders })
            .then(r => r.json())
            .then(data => {
                if (!data.data || data.data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9" class="px-4 py-12 text-center text-gray-400">暂无批次数据</td>
                        </tr>
                    `;
                    document.getElementById('pagination-info').innerHTML = '<span>共 0 条记录</span>';
                    return;
                }

                const varieties = {};
                fetch('/api/harvest/varieties?page_size=100', { headers: authHeaders })
                    .then(r => r.json())
                    .then(vData => {
                        if (vData.data) {
                            vData.data.forEach(v => varieties[v.id] = v);
                        }

                        tbody.innerHTML = data.data.map(b => `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-4 py-3 text-sm text-gray-600">${b.id}</td>
                                <td class="px-4 py-3 text-sm font-medium text-gray-800">${b.code}</td>
                                <td class="px-4 py-3 text-sm text-gray-600">${varieties[b.variety_id] ? varieties[b.variety_id].name : '品种#' + b.variety_id}</td>
                                <td class="px-4 py-3 text-sm text-gray-600">${b.batch_date || '-'}</td>
                                <td class="px-4 py-3">
                                    <span class="px-2 py-0.5 text-xs font-medium rounded ${getBatchStatusClass(b.status)}">${getBatchStatusText(b.status)}</span>
                                </td>
                                <td class="px-4 py-3 text-sm text-right font-medium text-gray-800">${b.weight_kg ? b.weight_kg.toLocaleString() + ' kg' : '-'}</td>
                                <td class="px-4 py-3 text-sm text-gray-600">${b.handler_id ? '用户#' + b.handler_id : '-'}</td>
                                <td class="px-4 py-3 text-sm text-gray-500">${formatDate(b.handled_at)}</td>
                                <td class="px-4 py-3 text-center text-sm">
                                    <button class="text-primary-600 hover:text-primary-700 font-medium mr-2">查看</button>
                                    <button class="text-blue-600 hover:text-blue-700 font-medium">编辑</button>
                                </td>
                            </tr>
                        `).join('');

                        document.getElementById('pagination-info').innerHTML = `<span>共 ${data.pagination?.total || data.data.length} 条记录</span>`;
                    });
            })
            .catch(() => {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="px-4 py-12 text-center text-gray-400">加载失败</td>
                    </tr>
                `;
            });
    }

    document.getElementById('batch-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => {
            if (value !== '') data[key] = value;
        });
        if (data.run_auto_chain) data.run_auto_chain = true;

        fetch('/api/harvest/batches', {
            method: 'POST',
            headers: authHeaders,
            body: JSON.stringify(data)
        })
        .then(r => {
            if (r.ok) {
                showToast('创建成功', 'success');
                this.reset();
                loadBatches();
            } else {
                return r.json().then(err => {
                    showToast('创建失败: ' + (err.detail || '未知错误'), 'error');
                });
            }
        })
        .catch(() => {
            showToast('网络错误', 'error');
        });
    });

    loadHarvests();
    loadVarieties();
    loadBatches();
</script>
{% endblock %}
