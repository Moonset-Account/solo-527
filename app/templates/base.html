<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}母婴会员复购营销系统{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/response-targets.js"></script>
    <style>
        .htmx-indicator{display:none}
        .htmx-request .htmx-indicator{display:inline}
        .htmx-request.htmx-indicator{display:inline}
        .fade-in{animation:fadeIn .3s ease-in}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .tab-active{border-bottom:3px solid #f97316;color:#f97316;font-weight:600}
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    {% block content %}{% endblock %}
    <div id="toast" class="fixed top-4 right-4 z-50 hidden"></div>
    <script>
        function showToast(msg, type='info'){
            const colors={success:'bg-green-500',error:'bg-red-500',info:'bg-blue-500',warning:'bg-yellow-500'};
            const t=document.getElementById('toast');
            t.className=`fixed top-4 right-4 z-50 px-6 py-3 rounded-lg text-white shadow-lg ${colors[type]} fade-in`;
            t.textContent=msg;
            t.classList.remove('hidden');
            setTimeout(()=>t.classList.add('hidden'),3000);
        }
        document.body.addEventListener('htmx:afterRequest',(e)=>{
            const xh=e.detail.xhr;
            if(xh){try{const d=JSON.parse(xh.responseText);if(d&&d.detail)showToast(d.detail,'error');}catch(_){}}
        });
    </script>
</body>
</html>
