<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}API用量自助配置门户{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex">

  <aside class="w-60 bg-slate-800 text-slate-100 flex-shrink-0 flex flex-col min-h-screen">
    <div class="h-16 flex items-center px-5 border-b border-slate-700">
      <span class="text-lg font-bold tracking-wide">API 门户</span>
    </div>
    <nav class="flex-1 py-4 space-y-1">
      <a href="/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if request.url.path == '/' %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        仪表盘
      </a>
      <a href="/tenants/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/tenants' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        租户管理
      </a>
      <a href="/plans/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/plans' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
        套餐规则
      </a>
      <a href="/usage/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/usage' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        API用量
      </a>
      <a href="/anomalies/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/anomalies' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
        异常记录
      </a>
      <a href="/billing/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/billing' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        账单流水
      </a>
      <a href="/arrears/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/arrears' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        欠费处理
      </a>
      <a href="/dictionaries/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/dictionaries' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        字典管理
      </a>
      <a href="/reminders/" class="flex items-center px-5 py-2.5 text-sm hover:bg-slate-700 transition-colors {% if '/reminders' in request.url.path %}bg-slate-700 text-white{% else %}text-slate-300{% endif %}">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        提醒管理
      </a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-h-screen">
    <header class="h-16 bg-white border-b border-gray-200 flex items-center px-6 flex-shrink-0">
      <h1 class="text-lg font-semibold text-gray-800">API用量自助配置门户</h1>
    </header>

    <main class="flex-1 p-6 overflow-auto">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="modal-container"></div>

  {% block scripts %}{% endblock %}
</body>
</html>
