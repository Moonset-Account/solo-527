<div id="approvalModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4" onclick="event.stopPropagation()">
        <div class="p-6 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-bold text-gray-900">审批拒绝</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </div>
        <form hx-post="/api/approval/process"
              hx-target="#row-{{ purchase.id }}"
              hx-swap="delete"
              hx-on::after-request="if(event.detail.successful) { closeModal(); }">
            <input type="hidden" name="purchase_id" value="{{ purchase.id }}">
            <input type="hidden" name="action" value="reject">
            <div class="p-6">
                <div class="mb-4">
                    <div class="flex items-center space-x-3 mb-4 p-4 bg-danger/10 rounded-lg">
                        <div class="w-12 h-12 bg-danger/20 rounded-full flex items-center justify-center">
                            <i class="fas fa-times-circle text-danger text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">您正在拒绝以下采购需求</p>
                            <p class="text-lg font-semibold text-gray-900">{{ purchase.request_no }}</p>
                            <p class="text-sm text-gray-600">{{ purchase.material_name }}</p>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">拒绝原因 <span class="text-danger">*</span></label>
                    <textarea name="opinion" 
                              rows="4" 
                              placeholder="请输入拒绝原因..."
                              required
                              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-danger/20 focus:border-danger transition resize-none"></textarea>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-3">
                <button type="button" 
                        onclick="closeModal()" 
                        class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition">
                    取消
                </button>
                <button type="submit" 
                        class="px-6 py-2 bg-danger text-white rounded-lg hover:bg-danger/90 transition">
                    <i class="fas fa-times mr-2"></i>确认拒绝
                </button>
            </div>
        </form>
    </div>
</div>
