{% extends "base.html" %}
{% block title %}笼位管理 - 宠物洗护管理后台{% endblock %}
{% block content %}
{% include "admin/_sidebar.html" %}
<div class="main-content">
    <h1 class="page-title">🏠 笼位管理</h1>
    <div class="card">
        <div class="flex justify-between items-center mb-4">
            <h2 style="margin:0;">笼位列表</h2>
            <button class="btn btn-primary" onclick="openCageModal()">添加笼位</button>
        </div>
        <div id="cages-list">加载中...</div>
    </div>
    <div id="cage-modal" class="hidden" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;">
        <div class="card" style="width:400px;">
            <h2>添加笼位</h2>
            <div class="form-group">
                <label>名称</label>
                <input type="text" id="cage-name">
            </div>
            <div class="form-group">
                <label>类型</label>
                <input type="text" id="cage-type" placeholder="如：小型犬/大型犬/猫">
            </div>
            <div class="form-group">
                <label>最大承重 (kg)</label>
                <input type="number" step="0.1" id="cage-weight">
            </div>
            <div class="form-group">
                <label>位置</label>
                <input type="text" id="cage-location">
            </div>
            <div class="flex gap-2" style="justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeCageModal()">取消</button>
                <button class="btn btn-primary" onclick="submitCage()">保存</button>
            </div>
        </div>
    </div>
</div>
<script>
async function loadCages() {
    try {
        const resp = await fetch('/api/cages', { headers: apiHeaders() });
        const cages = await resp.json();
        if (!cages.length) {
            document.getElementById('cages-list').innerHTML = '<p class="text-gray">暂无笼位</p>';
            return;
        }
        document.getElementById('cages-list').innerHTML = `
            <table>
                <thead><tr><th>名称</th><th>类型</th><th>最大承重</th><th>位置</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                    ${cages.map(c => `<tr>
                        <td>${c.name}</td>
                        <td>${c.cage_type || '-'}</td>
                        <td>${c.max_weight ? c.max_weight + ' kg' : '-'}</td>
                        <td>${c.location || '-'}</td>
                        <td><span class="badge badge-${c.status}">${c.status}</span></td>
                        <td>
                            <select onchange="updateStatus(${c.id}, this.value)" style="padding:6px;border-radius:6px;border:1px solid #e2e8f0;">
                                <option value="available" ${c.status==='available'?'selected':''}>可用</option>
                                <option value="maintenance" ${c.status==='maintenance'?'selected':''}>维护中</option>
                            </select>
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>
        `;
    } catch (e) { console.error(e); }
}

async function updateStatus(id, status) {
    const resp = await fetch(`/api/cages/${id}/status?new_status=${status}`, {
        method: 'PATCH',
        headers: apiHeaders()
    });
    if (resp.ok) showToast('状态已更新');
}

function openCageModal() { document.getElementById('cage-modal').style.display = 'flex'; }
function closeCageModal() { document.getElementById('cage-modal').style.display = 'none'; }

async function submitCage() {
    const data = {
        store_id: 1,
        name: document.getElementById('cage-name').value,
        cage_type: document.getElementById('cage-type').value || null,
        max_weight: parseFloat(document.getElementById('cage-weight').value) || null,
        location: document.getElementById('cage-location').value || null
    };
    if (!data.name) { showToast('请输入笼位名称', true); return; }
    const resp = await fetch('/api/cages', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify(data)
    });
    if (resp.ok) { showToast('添加成功'); closeCageModal(); loadCages(); }
}

loadCages();
</script>
{% endblock %}
