<div class="navbar" style="position:fixed;top:0;left:0;right:0;z-index:100;">
    <div style="font-weight:700;font-size:18px;">🐾 宠物洗护管理后台</div>
    <div>
        <span style="margin-right:20px;">{{ user.full_name or user.username }} ({{ user.role }})
            {% if user.is_test_account %}
                <span class="badge badge-abnormal" style="background:#fef3c7;color:#92400e;">测试账号</span>
            {% endif %}
        </span>
        <a href="/api/auth/logout" onclick="event.preventDefault();document.cookie='access_token=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;';window.location.href='/login';">退出登录</a>
    </div>
</div>
<div class="sidebar">
    <a href="/admin/dashboard" class="{% if request.url.path == '/admin/dashboard' %}active{% endif %}">📊 数据概览</a>
    <a href="/admin/appointments" class="{% if request.url.path == '/admin/appointments' %}active{% endif %}">📅 预约管理</a>
    <a href="/admin/cages" class="{% if request.url.path == '/admin/cages' %}active{% endif %}">🏠 笼位管理</a>
    <a href="/admin/boardings" class="{% if request.url.path == '/admin/boardings' %}active{% endif %}">🐾 寄养管理</a>
    <a href="/admin/health" class="{% if request.url.path == '/admin/health' %}active{% endif %}">❤️ 健康记录</a>
    <a href="/admin/anomalies" class="{% if request.url.path == '/admin/anomalies' %}active{% endif %}">⚠️ 复购异常</a>
    {% if user.role in ['admin', 'manager'] %}
    <a href="/admin/configs" class="{% if request.url.path == '/admin/configs' %}active{% endif %}">⚙️ 系统配置</a>
    {% endif %}
</div>
