{% extends "admin_base.html" %}
{% block title %}积分权益{% endblock %}
{% block page_title %}⭐ 积分权益管理{% endblock %}
{% block admin_content %}
<div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center">
    <input id="f-kw" placeholder="搜索权益名称" class="px-3 py-2 border rounded-lg text-sm w-64">
    <button onclick="showForm()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm">+ 新建权益</button>
</div>
<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4" id="list">
    <div class="col-span-full text-center py-12 text-gray-400">加载中...</div>
</div>
<script>
async function load(){
    const kw=document.getElementById('f-kw').value;let url='/api/benefits?limit=100';
    const r=await fetch(url,{credentials:'include'});if(!r.ok)return;const list=await r.json();
    const filtered=kw?list.filter(b=>(b.name||'').includes(kw)):list;
    document.getElementById('list').innerHTML=filtered.length?filtered.map(b=>`
        <div class="bg-white rounded-xl shadow-sm p-5 border">
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-2"><span class="text-2xl">${b.benefit_type==='birthday'?'🎂':b.benefit_type==='vip'?'👑':b.benefit_type==='service'?'🛎️':'🎁'}</span>
                    <h3 class="font-semibold">${b.name}</h3></div>
                <span class="bg-amber-100 text-amber-600 px-3 py-1 rounded-full text-sm font-bold">${b.points_required}分</span>
            </div>
            <p class="text-sm text-gray-500 mb-3 line-clamp-2">${b.description||'暂无描述'}</p>
            <div class="flex justify-between text-xs text-gray-400 mb-3"><span>价值 ¥${b.value_amount||0} · 成本 ¥${b.cost_amount||0}</span><span>已发放 ${b.total_issued||0} · 库存 ${b.stock||0}</span></div>
            <div class="flex justify-end gap-2 pt-3 border-t">
                ${b.is_active?'<span class="text-xs text-green-500">启用</span>':'<span class="text-xs text-gray-400">停用</span>'}
            </div>
        </div>`).join(''):'<div class="col-span-full text-center py-12 text-gray-400">暂无数据</div>';
}
function showForm(){openModal('新建权益',formHtml({}));}
function formHtml(b={}){return`
    <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
            <div><label class="text-sm text-gray-600">名称*</label><input id="b-name" class="w-full px-3 py-2 border rounded text-sm" value="${b.name||''}"></div>
            <div><label class="text-sm text-gray-600">类型</label>
                <select id="b-type" class="w-full px-3 py-2 border rounded text-sm"><option value="gift">礼品</option><option value="service">服务</option><option value="birthday">生日礼</option><option value="vip">VIP权益</option></select></div>
        </div>
        <div class="grid grid-cols-3 gap-3">
            <div><label class="text-sm text-gray-600">所需积分*</label><input id="b-points" type="number" class="w-full px-3 py-2 border rounded text-sm" value="${b.points_required||''}"></div>
            <div><label class="text-sm text-gray-600">价值(元)</label><input id="b-value" type="number" step="0.01" class="w-full px-3 py-2 border rounded text-sm" value="${b.value_amount||0}"></div>
            <div><label class="text-sm text-gray-600">成本(元)</label><input id="b-cost" type="number" step="0.01" class="w-full px-3 py-2 border rounded text-sm" value="${b.cost_amount||0}"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div><label class="text-sm text-gray-600">库存</label><input id="b-stock" type="number" class="w-full px-3 py-2 border rounded text-sm" value="${b.stock||0}"></div>
            <div><label class="text-sm text-gray-600">每人限领</label><input id="b-limit" type="number" class="w-full px-3 py-2 border rounded text-sm" value="${b.per_user_limit||1}"></div>
        </div>
        <div><label class="text-sm text-gray-600">描述</label><textarea id="b-desc" rows="2" class="w-full px-3 py-2 border rounded text-sm">${b.description||''}</textarea></div>
        <div><label class="text-sm text-gray-600">变更说明</label><input id="b-summary" class="w-full px-3 py-2 border rounded text-sm"></div>
        <button onclick="submitForm(${b.id||0})" class="w-full py-2 bg-blue-600 text-white rounded-lg">保存</button>
    </div>`;}
async function submitForm(id){
    const body={name:document.getElementById('b-name').value,benefit_type:document.getElementById('b-type').value,
        points_required:parseInt(document.getElementById('b-points').value),value_amount:parseFloat(document.getElementById('b-value').value)||0,
        cost_amount:parseFloat(document.getElementById('b-cost').value)||0,stock:parseInt(document.getElementById('b-stock').value)||0,
        per_user_limit:parseInt(document.getElementById('b-limit').value)||1,description:document.getElementById('b-desc').value,
        change_summary:document.getElementById('b-summary').value};
    const url=id?`/api/benefits/${id}`:'/api/benefits';const method=id?'PUT':'POST';
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});
    if(r.ok){showToast(id?'修改成功':'创建成功','success');closeModal();load();}else{const d=await r.json().catch(()=>({}));showToast(d.detail||'失败','error');}
}
load();
</script>
{% endblock %}
