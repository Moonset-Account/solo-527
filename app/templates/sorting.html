{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">⚖️ 分选差异</h1>
            <p class="text-gray-500 mt-1">记录和管理分选过程中的重量差异</p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">差异总数</p>
                    <p class="text-2xl font-bold text-gray-800 mt-1" id="stat-total">-</p>
                </div>
                <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-2xl">
                    📊
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">正常接收</p>
                    <p class="text-2xl font-bold text-green-600 mt-1" id="stat-accepted">-</p>
                </div>
                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center text-2xl">
                    ✅
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">拒收/返工</p>
                    <p class="text-2xl font-bold text-red-600 mt-1" id="stat-rejected">-</p>
                </div>
                <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center text-2xl">
                    ⚠️
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">有社会影响</p>
                    <p class="text-2xl font-bold text-orange-600 mt-1" id="stat-impact">-</p>
                </div>
                <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center text-2xl">
                    🌐
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">新建差异记录</h2>
                <form id="sorting-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">关联批次</label>
                        <select name="batch_id" required id="batch-select"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="">请选择批次</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">关联采收记录</label>
                        <select name="harvest_id" required id="harvest-select"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="">请选择采收记录</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">品种</label>
                        <select name="variety_id" required id="variety-select"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="">请选择品种</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">上报重量 (kg)</label>
                            <input type="number" name="reported_weight_kg" step="0.01" required placeholder="1000.00"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">实际重量 (kg)</label>
                            <input type="number" name="actual_weight_kg" step="0.01" required placeholder="980.00"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">上报等级</label>
                            <select name="reported_grade"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                                <option value="">请选择</option>
                                <option value="A">A级</option>
                                <option value="B">B级</option>
                                <option value="C">C级</option>
                                <option value="D">D级</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">实际等级</label>
                            <select name="actual_grade"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                                <option value="">请选择</option>
                                <option value="A">A级</option>
                                <option value="B">B级</option>
                                <option value="C">C级</option>
                                <option value="D">D级</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">备注 <span class="text-red-500">*</span></label>
                        <textarea name="remarks" rows="2" required placeholder="差异原因说明..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">处理结果 <span class="text-red-500">*</span></label>
                        <select name="result" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="">请选择结果</option>
                            <option value="accepted">正常接收</option>
                            <option value="rejected">拒收</option>
                            <option value="reworked">返工</option>
                            <option value="discounted">折价处理</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">社会影响</label>
                        <select name="social_impact"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
                            <option value="none">无</option>
                            <option value="reputation_risk">声誉风险</option>
                            <option value="consumer_complaint">消费者投诉</option>
                            <option value="regulatory_attention">监管关注</option>
                            <option value="community_positive">社区正面评价</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">影响描述</label>
                        <textarea name="impact_description" rows="2" placeholder="如有社会影响，请描述..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">解决方案</label>
                        <textarea name="resolution" rows="2" placeholder="处理方案..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm resize-none"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-primary-600 text-white py-2.5 px-4 rounded-lg font-medium hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 transition-colors">
                        创建差异记录
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                <div class="p-5 border-b border-gray-100 flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-gray-800">差异记录列表</h2>
                    <div class="flex items-center gap-2">
                        <select id="filter-result" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            <option value="">全部结果</option>
                            <option value="accepted">正常接收</option>
                            <option value="rejected">拒收</option>
                            <option value="reworked">返工</option>
                            <option value="discounted">折价处理</option>
                        </select>
                        <select id="filter-impact" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            <option value="">全部影响</option>
                            <option value="none">无</option>
                            <option value="reputation_risk">声誉风险</option>
                            <option value="consumer_complaint">消费者投诉</option>
                            <option value="regulatory_attention">监管关注</option>
                            <option value="community_positive">社区正面评价</option>
                        </select>
                        <button onclick="loadSortingDiffs()" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition-colors">
                            刷新
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">批次</th>
                                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">上报重量</th>
                                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">实际重量</th>
                                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">差异</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">结果</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">社会影响</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">处理人</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">处理时间</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="sorting-list" class="divide-y divide-gray-100">
                            <tr>
                                <td colspan="10" class="px-4 py-12 text-center text-gray-400">
                                    <div class="animate-spin w-8 h-8 border-2 border-primary-500 border-t-transparent rounded-full mx-auto mb-3"></div>
                                    加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="px-5 py-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500" id="pagination-info">
                    <span>共 0 条记录</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const authHeaders = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleString('zh-CN', { 
            year: 'numeric', 
            month: '2-digit', 
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function getResultClass(result) {
        switch(result) {
            case 'accepted': return 'bg-green-100 text-green-700';
            case 'rejected': return 'bg-red-100 text-red-700';
            case 'reworked': return 'bg-yellow-100 text-yellow-700';
            case 'discounted': return 'bg-orange-100 text-orange-700';
            default: return 'bg-gray-100 text-gray-700';
        }
    }

    function getResultText(result) {
        switch(result) {
            case 'accepted': return '正常接收';
            case 'rejected': return '拒收';
            case 'reworked': return '返工';
            case 'discounted': return '折价处理';
            default: return result;
        }
    }

    function getImpactClass(impact) {
        switch(impact) {
            case 'none': return 'bg-gray-100 text-gray-600';
            case 'reputation_risk': return 'bg-purple-100 text-purple-700';
            case 'consumer_complaint': return 'bg-red-100 text-red-700';
            case 'regulatory_attention': return 'bg-orange-100 text-orange-700';
            case 'community_positive': return 'bg-green-100 text-green-700';
            default: return 'bg-gray-100 text-gray-600';
        }
    }

    function getImpactText(impact) {
        switch(impact) {
            case 'none': return '无';
            case 'reputation_risk': return '声誉风险';
            case 'consumer_complaint': return '消费者投诉';
            case 'regulatory_attention': return '监管关注';
            case 'community_positive': return '社区正面评价';
            default: return impact;
        }
    }

    function loadOptions() {
        Promise.all([
            fetch('/api/harvest/batches?page_size=100', { headers: authHeaders }).then(r => r.json()),
            fetch('/api/harvest/harvests?page_size=100', { headers: authHeaders }).then(r => r.json()),
            fetch('/api/harvest/varieties?page_size=100', { headers: authHeaders }).then(r => r.json())
        ]).then(([batchesData, harvestsData, varietiesData]) => {
            const batchSelect = document.getElementById('batch-select');
            if (batchesData.data) {
                batchesData.data.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.id;
                    option.textContent = `${b.code} - ${b.weight_kg || 0}kg`;
                    batchSelect.appendChild(option);
                });
            }

            const harvestSelect = document.getElementById('harvest-select');
            if (harvestsData.data) {
                harvestsData.data.forEach(h => {
                    const option = document.createElement('option');
                    option.value = h.id;
                    option.textContent = `${h.code} - ${h.harvest_date || ''}`;
                    harvestSelect.appendChild(option);
                });
            }

            const varietySelect = document.getElementById('variety-select');
            if (varietiesData.data) {
                varietiesData.data.forEach(v => {
                    const option = document.createElement('option');
                    option.value = v.id;
                    option.textContent = `${v.code} - ${v.name}`;
                    varietySelect.appendChild(option);
                });
            }
        }).catch(() => {});
    }

    function loadStats() {
        fetch('/api/sorting/stats', { headers: authHeaders })
            .then(r => r.json())
            .then(data => {
                document.getElementById('stat-total').textContent = data.total || 0;
                document.getElementById('stat-accepted').textContent = data.accepted || 0;
                document.getElementById('stat-rejected').textContent = (data.rejected || 0) + (data.reworked || 0);
                document.getElementById('stat-impact').textContent = data.with_impact || 0;
            })
            .catch(() => {
                document.getElementById('stat-total').textContent = '0';
                document.getElementById('stat-accepted').textContent = '0';
                document.getElementById('stat-rejected').textContent = '0';
                document.getElementById('stat-impact').textContent = '0';
            });
    }

    function loadSortingDiffs() {
        const filterResult = document.getElementById('filter-result').value;
        const filterImpact = document.getElementById('filter-impact').value;
        
        const tbody = document.getElementById('sorting-list');
        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="px-4 py-12 text-center text-gray-400">
                    <div class="animate-spin w-8 h-8 border-2 border-primary-500 border-t-transparent rounded-full mx-auto mb-3"></div>
                    加载中...
                </td>
            </tr>
        `;

        let url = '/api/sorting/differences?page_size=100';
        if (filterResult) url += `&result=${filterResult}`;
        if (filterImpact) url += `&social_impact=${filterImpact}`;

        fetch(url, { headers: authHeaders })
            .then(r => r.json())
            .then(data => {
                if (!data.data || data.data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" class="px-4 py-12 text-center text-gray-400">暂无分选差异数据</td>
                        </tr>
                    `;
                    document.getElementById('pagination-info').innerHTML = '<span>共 0 条记录</span>';
                    return;
                }

                tbody.innerHTML = data.data.map(d => `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-4 py-3 text-sm text-gray-600">${d.id}</td>
                        <td class="px-4 py-3 text-sm font-medium text-gray-800">${d.batch_id ? '批次#' + d.batch_id : '-'}</td>
                        <td class="px-4 py-3 text-sm text-right text-gray-800">${d.reported_weight_kg || 0} kg</td>
                        <td class="px-4 py-3 text-sm text-right text-gray-800">${d.actual_weight_kg || 0} kg</td>
                        <td class="px-4 py-3 text-sm text-right font-semibold ${(d.diff_weight_kg || 0) < 0 ? 'text-red-600' : 'text-green-600'}" title="差异百分比: ${(d.diff_pct || 0).toFixed(2)}%">
                            ${(d.diff_weight_kg || 0).toFixed(2)} kg
                        </td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-0.5 text-xs font-medium rounded ${getResultClass(d.result)}">${getResultText(d.result)}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-0.5 text-xs font-medium rounded ${getImpactClass(d.social_impact)}" title="${d.impact_description || ''}">${getImpactText(d.social_impact)}</span>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-600">${d.handled_by ? '用户#' + d.handled_by : '-'}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${formatDate(d.handled_at)}</td>
                        <td class="px-4 py-3 text-center text-sm">
                            <button class="text-primary-600 hover:text-primary-700 font-medium" title="备注: ${d.remarks || ''}">查看</button>
                        </td>
                    </tr>
                `).join('');

                document.getElementById('pagination-info').innerHTML = `<span>共 ${data.pagination?.total || data.data.length} 条记录</span>`;
            })
            .catch(() => {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="px-4 py-12 text-center text-gray-400">加载失败</td>
                    </tr>
                `;
            });
    }

    document.getElementById('sorting-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => {
            if (value !== '') data[key] = value;
        });

        fetch('/api/sorting/differences', {
            method: 'POST',
            headers: authHeaders,
            body: JSON.stringify(data)
        })
        .then(r => {
            if (r.ok) {
                showToast('创建成功', 'success');
                this.reset();
                loadSortingDiffs();
                loadStats();
            } else {
                return r.json().then(err => {
                    showToast('创建失败: ' + (err.detail || '未知错误'), 'error');
                });
            }
        })
        .catch(() => {
            showToast('网络错误', 'error');
        });
    });

    document.getElementById('filter-result').addEventListener('change', loadSortingDiffs);
    document.getElementById('filter-impact').addEventListener('change', loadSortingDiffs);

    loadOptions();
    loadStats();
    loadSortingDiffs();
</script>
{% endblock %}
