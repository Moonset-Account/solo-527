<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子电路沙盒 - 教育仿真工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
#app { width: 100%; height: 100%; display: flex; flex-direction: column; }
#top-bar { height: 40px; background: #16213e; display: flex; align-items: center; padding: 0 12px; gap: 8px; border-bottom: 1px solid #0f3460; z-index: 10; flex-shrink: 0; }
#top-bar .logo { color: #e94560; font-weight: 700; font-size: 14px; letter-spacing: 1px; }
#top-bar .badge { background: #e94560; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
#top-bar .spacer { flex: 1; }
#top-bar button { background: none; border: 1px solid #0f3460; color: #a8b2d1; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.15s; }
#top-bar button:hover { background: #0f3460; color: #e94560; border-color: #e94560; }
#workspace { flex: 1; display: flex; overflow: hidden; }
#palette { width: 72px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; overflow-y: auto; z-index: 5; flex-shrink: 0; }
#palette .pal-item { width: 56px; height: 56px; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 6px; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: all 0.15s; user-select: none; }
#palette .pal-item:hover { border-color: #e94560; background: #0f3460; }
#palette .pal-item:active { cursor: grabbing; }
#palette .pal-item canvas { width: 32px; height: 24px; pointer-events: none; }
#palette .pal-item span { color: #a8b2d1; font-size: 9px; text-align: center; line-height: 1.1; }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
#circuit-canvas { display: block; width: 100%; height: 100%; }
#props-panel { width: 200px; background: #16213e; border-left: 1px solid #0f3460; padding: 12px; color: #a8b2d1; font-size: 12px; overflow-y: auto; z-index: 5; flex-shrink: 0; display: none; }
#props-panel.visible { display: block; }
#props-panel h3 { color: #e94560; margin-bottom: 8px; font-size: 13px; }
#props-panel .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
#props-panel .prop-row label { color: #8892b0; }
#props-panel .prop-row input { width: 80px; background: #1a1a2e; border: 1px solid #0f3460; color: #e94560; padding: 3px 6px; border-radius: 3px; font-size: 12px; text-align: right; }
#props-panel .prop-row input:focus { outline: none; border-color: #e94560; }
#status-bar { height: 28px; background: #16213e; border-top: 1px solid #0f3460; display: flex; align-items: center; padding: 0 12px; gap: 16px; font-size: 11px; color: #5a6a8a; z-index: 10; flex-shrink: 0; }
#status-bar .status-item { display: flex; align-items: center; gap: 4px; }
#status-bar .dot { width: 6px; height: 6px; border-radius: 50%; }
#status-bar .dot.green { background: #4ecca3; }
#status-bar .dot.yellow { background: #f9ed69; }
#status-bar .dot.red { background: #e94560; }
.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,30,0.85); display: none; z-index: 50; align-items: center; justify-content: center; }
.overlay.visible { display: flex; }
.overlay-box { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 32px; max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto; color: #ccd6f6; }
.overlay-box h2 { color: #e94560; margin-bottom: 16px; font-size: 20px; }
.overlay-box p { margin-bottom: 12px; line-height: 1.6; font-size: 14px; }
.overlay-box .btn-row { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.overlay-box button { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s; }
.overlay-box .btn-primary { background: #e94560; color: #fff; }
.overlay-box .btn-primary:hover { background: #c73a52; }
.overlay-box .btn-secondary { background: #0f3460; color: #a8b2d1; }
.overlay-box .btn-secondary:hover { background: #1a4a8a; }
.overlay-box .btn-danger { background: #533460; color: #e94560; }
.overlay-box .btn-danger:hover { background: #6a4280; }
.tutorial-highlight { position: absolute; border: 2px solid #f9ed69; border-radius: 8px; pointer-events: none; animation: pulse-border 1.5s infinite; z-index: 40; }
@keyframes pulse-border { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.tutorial-tooltip { position: absolute; background: #f9ed69; color: #1a1a2e; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 45; max-width: 260px; pointer-events: none; box-shadow: 0 4px 16px rgba(249,237,105,0.3); }
.tutorial-tooltip::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #f9ed69; }
.hint-bubble { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); background: #0f3460; color: #ccd6f6; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 30; animation: fade-up 0.3s ease; white-space: nowrap; }
@keyframes fade-up { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.level-badge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: #e94560; color: #fff; padding: 4px 16px; border-radius: 12px; font-size: 12px; font-weight: 600; z-index: 20; }
.perf-stats { position: absolute; top: 8px; right: 8px; background: rgba(22,33,62,0.9); color: #4ecca3; font-family: monospace; font-size: 10px; padding: 6px 8px; border-radius: 4px; z-index: 20; display: none; line-height: 1.5; }
.perf-stats.visible { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="top-bar">
    <span class="logo">⚡ 电路沙盒</span>
    <span class="badge">教育版</span>
    <div class="spacer"></div>
    <button id="btn-tutorial">教程</button>
    <button id="btn-hint">提示</button>
    <button id="btn-reset">重置</button>
    <button id="btn-save">保存</button>
    <button id="btn-load">加载</button>
    <button id="btn-share">分享</button>
    <button id="btn-pause">暂停</button>
    <button id="btn-settings">设置</button>
  </div>
  <div id="workspace">
    <div id="palette"></div>
    <div id="canvas-wrap">
      <canvas id="circuit-canvas"></canvas>
      <div class="level-badge" id="level-badge"></div>
      <div class="perf-stats" id="perf-stats"></div>
    </div>
    <div id="props-panel">
      <h3>元件属性</h3>
      <div id="props-content"></div>
    </div>
  </div>
  <div id="status-bar">
    <div class="status-item"><div class="dot green" id="sim-dot"></div><span id="sim-status">仿真运行中</span></div>
    <div class="status-item"><span id="fps-display">FPS: --</span></div>
    <div class="status-item"><span id="component-count">元件: 0</span></div>
    <div class="status-item"><span id="level-display">关卡: --</span></div>
    <div class="status-item" style="margin-left:auto"><span style="color:#e94560;font-size:9px">⚠ 本软件仅用于教学演示，非专业工程仿真</span></div>
  </div>
</div>
<div class="overlay" id="overlay-tutorial">
  <div class="overlay-box" id="tutorial-box"></div>
</div>
<div class="overlay" id="overlay-pause">
  <div class="overlay-box">
    <h2>⏸ 已暂停</h2>
    <p>仿真已暂停，你可以安全地修改电路。</p>
    <div class="btn-row">
      <button class="btn-secondary" id="pause-restart">重做本关</button>
      <button class="btn-primary" id="pause-resume">继续</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay-settings">
  <div class="overlay-box">
    <h2>⚙ 设置</h2>
    <div id="settings-content"></div>
    <div class="btn-row">
      <button class="btn-primary" id="settings-close">关闭</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay-settlement">
  <div class="overlay-box" id="settlement-box"></div>
</div>
<script src="dist/bundle.js"></script>
</body>
</html>
