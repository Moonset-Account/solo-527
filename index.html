<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F172A" />
    <title>电路沙盒 Circuit Sandbox · 教育测试版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F172A; }
      #app { width: 100vw; height: 100vh; position: relative; font-family: 'JetBrains Mono', monospace; }
      canvas { display: block; position: absolute; top: 0; left: 0; }
      .ui-root { position: absolute; inset: 0; pointer-events: none; }
      .ui-root > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root" class="ui-root"></div>
    </div>
    <noscript>请启用 JavaScript 以运行电路沙盒</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
