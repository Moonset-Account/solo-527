server:
  port: 8080

spring:
  profiles:
    active: h2
  datasource:
    url: jdbc:h2:mem:rider_analyzer;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

logging:
  level:
    com.rider.analyzer: INFO
    org.hibernate.SQL: WARN
