<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>口腔诊所器械消毒追踪系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>🦷 口腔诊所器械消毒追踪系统</h1>
    </div>
    <div class="header-right">
      <span id="userName" class="user-name"></span>
      <span id="userRole" class="user-role"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline" onclick="logout()">退出</button>
    </div>
  </header>

  <div id="loginOverlay" class="overlay">
    <div class="login-card">
      <h2>系统登录</h2>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名" value="lixd">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" value="sn123">
      </div>
      <button class="btn btn-primary btn-block" onclick="login()">登 录</button>
      <div id="loginError" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <main id="mainContent" class="main-content" style="display:none;">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="showNewPackDialog()">+ 新建器械包</button>
      <button class="btn btn-success" onclick="showNewBatchDialog()">+ 新建灭菌批次</button>
      <button class="btn btn-warning" onclick="showBatchPanel()">📋 批次管理 / 召回</button>
      <input type="text" id="scanInput" placeholder="扫码输入器械包编码" class="scan-input" onkeydown="handleScan(event)">
      <button class="btn btn-accent" onclick="handleScanAction()">扫码回收</button>
    </div>

    <div id="kanban" class="kanban">
      <div class="kanban-column" data-status="new">
        <div class="column-header new-header">
          <span class="column-title">新建</span>
          <span class="column-count" id="count-new">0</span>
        </div>
        <div class="column-body" id="col-new"></div>
      </div>
      <div class="kanban-column" data-status="pending_confirm">
        <div class="column-header pending-header">
          <span class="column-title">待确认</span>
          <span class="column-count" id="count-pending_confirm">0</span>
        </div>
        <div class="column-body" id="col-pending_confirm"></div>
      </div>
      <div class="kanban-column" data-status="in_progress">
        <div class="column-header progress-header">
          <span class="column-title">执行中</span>
          <span class="column-count" id="count-in_progress">0</span>
        </div>
        <div class="column-body" id="col-in_progress"></div>
      </div>
      <div class="kanban-column" data-status="exception_review">
        <div class="column-header exception-header">
          <span class="column-title">异常复核</span>
          <span class="column-count" id="count-exception_review">0</span>
        </div>
        <div class="column-body" id="col-exception_review"></div>
      </div>
      <div class="kanban-column" data-status="archived">
        <div class="column-header archived-header">
          <span class="column-title">已归档</span>
          <span class="column-count" id="count-archived">0</span>
        </div>
        <div class="column-body" id="col-archived"></div>
      </div>
    </div>

    <div id="packDetailPanel" class="detail-panel" style="display:none;">
      <div class="detail-header">
        <h3 id="detailTitle">器械包详情</h3>
        <button class="btn btn-sm" onclick="closeDetail()">✕ 关闭</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
      <div id="detailActions" class="detail-actions"></div>
    </div>
  </main>

  <div id="newPackDialog" class="overlay" style="display:none;">
    <div class="dialog-card">
      <h2>新建器械包</h2>
      <div class="form-group">
        <label>编码</label>
        <input type="text" id="newPackCode" placeholder="如 PK-20240101-009">
      </div>
      <div class="form-group">
        <label>名称</label>
        <input type="text" id="newPackName" placeholder="如 种植器械包">
      </div>
      <div class="form-group">
        <label>类别</label>
        <select id="newPackCategory">
          <option value="内科">内科</option>
          <option value="外科">外科</option>
          <option value="正畸">正畸</option>
          <option value="修复">修复</option>
          <option value="儿童">儿童</option>
        </select>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-primary" onclick="createNewPack()">确认创建</button>
        <button class="btn" onclick="hideDialog('newPackDialog')">取消</button>
      </div>
      <div id="newPackError" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <div id="newBatchDialog" class="overlay" style="display:none;">
    <div class="dialog-card" style="width:460px;">
      <h2>新建灭菌批次</h2>
      <div class="form-group">
        <label>消毒锅</label>
        <select id="batchAutoclave"></select>
      </div>
      <div class="form-group">
        <label>待入批器械包（执行中状态）</label>
        <div id="batchPackCheckboxes" class="checkbox-list"></div>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:1;">
          <label>温度 (°C)</label>
          <input type="number" id="batchTemp" value="134.0" step="0.1">
        </div>
        <div class="form-group" style="flex:1;margin-left:12px;">
          <label>压力 (MPa)</label>
          <input type="number" id="batchPressure" value="0.21" step="0.01">
        </div>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-success" onclick="createNewBatch()">确认创建批次</button>
        <button class="btn" onclick="hideDialog('newBatchDialog')">取消</button>
      </div>
      <div id="newBatchError" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <div id="sterilizeDialog" class="overlay" style="display:none;">
    <div class="dialog-card" style="width:460px;">
      <h2>灭菌放行</h2>
      <div class="form-group">
        <label>选择灭菌批次</label>
        <select id="sterilizeBatchSelect"></select>
      </div>
      <div class="form-group">
        <label>灭菌指示卡编码</label>
        <input type="text" id="sterilizeCardCode" placeholder="如 CARD-001">
      </div>
      <div class="form-group">
        <label>变色情况</label>
        <input type="text" id="sterilizeColorChange" placeholder="如 由蓝变黑" value="由蓝变黑">
      </div>
      <div class="form-group">
        <label>指示卡结果</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="cardResult" value="true" checked> 合格</label>
          <label class="radio-label"><input type="radio" name="cardResult" value="false"> 不合格</label>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-primary" onclick="submitSterilize()">确认放行</button>
        <button class="btn" onclick="hideDialog('sterilizeDialog')">取消</button>
      </div>
      <div id="sterilizeError" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <div id="dispatchDialog" class="overlay" style="display:none;">
    <div class="dialog-card">
      <h2>科室领用</h2>
      <div class="form-group">
        <label>选择领用科室</label>
        <select id="dispatchDeptSelect"></select>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-primary" onclick="submitDispatch()">确认领用</button>
        <button class="btn" onclick="hideDialog('dispatchDialog')">取消</button>
      </div>
      <div id="dispatchError" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <div id="batchPanel" class="side-panel" style="display:none;">
    <div class="detail-header">
      <h3>📋 批次管理 / 异常召回</h3>
      <button class="btn btn-sm" onclick="closeBatchPanel()">✕ 关闭</button>
    </div>
    <div id="batchListBody" class="detail-body"></div>
  </div>

  <div id="recallDialog" class="overlay" style="display:none;">
    <div class="dialog-card">
      <h2>⚠ 标记批次异常 & 召回</h2>
      <div class="form-group">
        <label>批次编码</label>
        <input type="text" id="recallBatchCode" readonly>
      </div>
      <input type="hidden" id="recallBatchId">
      <div class="form-group">
        <label>异常原因</label>
        <textarea id="recallReason" rows="3" placeholder="请详细描述异常原因，如：灭菌温度未达标、生物监测阳性等" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:vertical;"></textarea>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-danger" onclick="submitRecall()">确认标记异常并召回</button>
        <button class="btn" onclick="hideDialog('recallDialog')">取消</button>
      </div>
      <div id="recallError" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
