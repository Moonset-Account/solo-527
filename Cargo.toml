[package]
name = "oas-checker"
version = "0.1.0"
edition = "2021"
authors = ["Platform Engineering Team"]
description = "OpenAPI Spec Contract Change Checker - detects breaking changes between API versions"
license = "MIT OR Apache-2.0"

[[bin]]
name = "oas-checker"
path = "src/main.rs"

[lib]
name = "oas_checker"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
once_cell = "1.19"
indexmap = { version = "2.2", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"
pretty_assertions = "1.4"

[[bench]]
name = "large_files"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
