[package]
name = "license-audit"
version = "0.1.0"
edition = "2021"
description = "Dependency license audit CLI tool for npm, Go, and Cargo projects"
license = "MIT"

[[bin]]
name = "license-audit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rayon = "1.10"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
walkdir = "2.5"
semver = "1.0"
percent-encoding = "2.3"

[dev-dependencies]
tempfile = "3.10"
