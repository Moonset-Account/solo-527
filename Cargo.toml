[package]
name = "note2task"
version = "1.0.0"
edition = "2021"
description = "Markdown笔记转任务命令行工具 - 解析待办、生成任务、去重、同步预览"
license = "MIT"
readme = "README.md"
repository = ""
authors = ["note2task contributors"]

[[bin]]
name = "note2task"
path = "src/main.rs"

[lib]
name = "note2task"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help", "unicode"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
