[package]
name = "nightly-failure-summary"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nightly-failure-summary"
path = "src/main.rs"

[lib]
name = "nightly_failure_summary"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
