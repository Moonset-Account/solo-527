[package]
name = "releasenote"
version = "0.1.0"
edition = "2021"
description = "发布说明拼装 CLI - 从 Git、工单、备注生成结构化的发布报告"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
