[package]
name = "git-brclean"
version = "0.1.0"
edition = "2021"
description = "Git 分支清理助手 - 团队级分支管理工具"
license = "MIT"
repository = "https://github.com/your-org/git-brclean"
readme = "README.md"
keywords = ["git", "branch", "cleanup", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-brclean"
path = "src/main.rs"

[lib]
name = "git_brclean"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dialoguer = "0.11"
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1.10"
walkdir = "2.5"
humansize = "2.1"
dunce = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
urlencoding = "2.1"
clap_complete = "4.5"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1.39", features = ["json", "yaml"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
