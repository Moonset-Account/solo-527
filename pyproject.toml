[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "import-dryrun"
version = "0.1.0"
description = "数据导入 Dry-Run 工具 - 模拟导入、字段映射、错误分组、修复建议"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Data Import Team" }
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
import-dryrun = "import_dryrun.cli:main"

[tool.setuptools.packages.find]
include = ["import_dryrun*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "slow: 标记为慢速测试",
    "unit: 单元测试",
    "integration: 集成测试",
]
