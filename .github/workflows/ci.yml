name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run example parse test
        run: |
          npx tsx src/index.ts parse examples/*.md --format json
          if [ $? -ne 0 ]; then
            echo "❌ Parse command failed"
            exit 1
          fi
          echo "✅ Parse command succeeded"

      - name: Test exit codes
        run: |
          echo "Testing exit code 4 (no input files)..."
          EXIT_CODE=0
          npx tsx src/index.ts parse --format json > /dev/null 2>&1 || EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 4 ]; then
            echo "❌ Expected exit code 4, got $EXIT_CODE"
            exit 1
          fi
          echo "✅ Exit code test passed"

      - name: Test machine-readable report
        run: |
          npx tsx src/index.ts report examples/*.md --report /tmp/report.json
          if [ ! -f /tmp/report.json ]; then
            echo "❌ Report file not created"
            exit 1
          fi
          cat /tmp/report.json | jq .exitCode
          if [ $? -ne 0 ]; then
            echo "❌ Report is not valid JSON"
            exit 1
          fi
          echo "✅ Machine-readable report test passed"

  bun-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build with Bun
        run: bun run build:bun

      - name: Run parse test
        run: |
          bun run src/index.ts parse examples/*.md --format json
          echo "✅ Bun parse test passed"
