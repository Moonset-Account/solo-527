name: i18n-diff CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Verify dist exists
        run: ls -la dist/

      - name: Smoke test with examples
        run: |
          set +e
          node dist/cli.js --config examples/i18n-diff.config.json --json --output /tmp/report.json
          EXIT=$?
          set -e
          echo "CLI exit code: $EXIT (expected 0 or 1 depending on failOn policy in config)"
          if [ $EXIT -eq 0 ] || [ $EXIT -eq 1 ]; then
            echo "✅ Exit code within acceptable range (0=no issues, 1=issues found per failOn)"
          else
            echo "❌ Unexpected exit code: $EXIT"
            exit 1
          fi
          test -f /tmp/report.json && echo "✅ JSON report file created (bytes: $(wc -c < /tmp/report.json))"
          node scripts/ci-smoke-verify.js /tmp/report.json
          node dist/cli.js --version
          node dist/cli.js --help | head -20

  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
