{% extends 'base.html' %}

{% block title %}确认归档 - 科研伦理材料流转系统{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">确认归档</h1>
        <p class="text-gray-600 mb-6">
            您确定要归档课题 <strong>{{ project.project_code }} - {{ project.title }}</strong> 吗？
        </p>
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
            <p class="text-sm text-yellow-800">
                <strong>注意：</strong>归档后课题将变为只读状态，无法再进行任何修改操作。请确保所有评审流程已完成。
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="flex space-x-4">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700">
                    确认归档
                </button>
                <a href="{% url 'ethics:project_detail' project.pk %}" class="border border-gray-300 px-6 py-2 rounded-md hover:bg-gray-50">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
