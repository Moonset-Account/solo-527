{% extends "admin_base.html" %}
{% block title %}退款审批 - 管理后台{% endblock %}
{% block content %}
<div class="toolbar">
  <div><h1 style="font-size:1.5rem">💰 退款审批</h1>
    <p class="text-sm text-gray mt-1">处理用户的退款申请，审核通过后座位回到上座率统计中</p>
  </div>
</div>

<div class="filter-bar">
  <div class="form-group"><label class="form-label">场次</label>
    <select id="f-event" class="form-select" onchange="loadList(1)">
      <option value="">全部</option>
    </select>
  </div>
  <div class="form-group"><label class="form-label">状态</label>
    <select id="f-status" class="form-select" onchange="loadList(1)">
      <option value="">全部</option>
      <option value="pending" selected>待审核</option>
      <option value="approved">已通过</option>
      <option value="rejected">已驳回</option>
      <option value="completed">已完成</option>
      <option value="failed">失败</option>
    </select>
  </div>
  <div class="form-group" style="flex:2;min-width:260px"><label class="form-label">搜索 (退款号/订单号)</label>
    <input type="text" id="keyword" class="form-control" onkeypress="if(event.key==='Enter')loadList(1)">
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="loadList(1)">搜索</button>
  </div>
</div>

<div class="card">
  <div class="card-body" style="padding:0">
    <table class="table" id="refund-table">
      <thead><tr>
        <th>退款号</th><th>订单号</th><th>用户</th><th>场次</th>
        <th>退款金额</th><th>手续费</th><th>实退</th>
        <th>原因</th><th>状态</th><th>时间</th><th>操作</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="pagination" class="card-footer"></div>
</div>

<div id="review-modal" class="modal" style="display:none">
  <div class="modal-dialog" style="max-width:600px">
    <div class="modal-header">
      <h3 class="font-semibold text-lg">💰 审核退款申请</h3>
      <button class="btn btn-outline btn-sm" data-close-modal="review-modal">×</button>
    </div>
    <div class="modal-body" id="review-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close-modal="review-modal">取消</button>
      <button class="btn btn-danger" onclick="submitReview(false)">❌ 驳回</button>
      <button class="btn btn-success" onclick="submitReview(true)">✅ 通过并退款</button>
    </div>
  </div>
</div>

<script>
let currentPage = 1; const pageSize = 20;
let currentList = [];
let currentId = null;

async function loadEvents() {
  try {
    const data = await apiRequest('/admin/events?page=1&page_size=200', { method: 'GET' });
    document.getElementById('f-event').innerHTML = '<option value="">全部</option>' +
      (data.items || []).map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
  } catch(e) {}
}

async function loadList(page = 1) {
  currentPage = page;
  let url = `/business/refunds?page=${page}&page_size=${pageSize}`;
  const ev = document.getElementById('f-event').value;
  const st = document.getElementById('f-status').value;
  const kw = document.getElementById('keyword').value.trim();
  if (ev) url += `&event_id=${ev}`;
  if (st) url += `&status=${st}`;
  if (kw) url += `&keyword=${encodeURIComponent(kw)}`;
  try {
    const data = await apiRequest(url, { method: 'GET' });
    currentList = data.items || [];
    render(data);
  } catch(e) {}
}

function render(data) {
  const tbody = document.querySelector('#refund-table tbody');
  if (!data.items || data.items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11"><div class="empty-state"><div class="empty-state-icon">💰</div><p>暂无退款申请</p></div></td></tr>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  tbody.innerHTML = data.items.map(r => `
    <tr>
      <td class="font-mono text-xs">${r.refund_no}</td>
      <td class="font-mono text-xs">${r.order_no || '-'}</td>
      <td>${escapeHtml(r.user_name || '用户#' + r.user_id)}</td>
      <td>${escapeHtml(r.event_name || '#' + (r.event_id||''))}</td>
      <td class="font-semibold text-danger">${formatCurrency(r.refund_amount)}</td>
      <td class="text-warning">${formatCurrency(r.fee_amount || 0)}</td>
      <td class="font-bold text-primary">${formatCurrency(r.actual_amount || r.refund_amount)}</td>
      <td style="max-width:180px" class="text-xs"><div class="truncate" title="${escapeHtml(r.reason || '')}">${escapeHtml(r.reason || '-')}</div></td>
      <td><span class="badge ${getStatusBadgeClass(r.status)}">${getStatusText(r.status)}</span></td>
      <td class="text-xs">${formatDateTime(r.created_at)}${r.reviewed_at?'<br><span class="text-gray">审:'+formatDate(r.reviewed_at)+'</span>':''}</td>
      <td>
        ${r.status === 'pending' ? `<div class="table-actions">
          <button class="btn btn-sm btn-success" onclick="openReview(${r.id})">审批</button>
        </div>` : `<button class="btn btn-sm btn-outline" onclick="viewDetail(${r.id})">详情</button>`}
      </td>
    </tr>`).join('');
  document.getElementById('pagination').innerHTML = buildPaginationHtml(data.total, data.page, data.page_size, 'loadList');
}

function openReview(id) {
  currentId = id;
  const r = currentList.find(x => x.id === id);
  if (!r) return;
  document.getElementById('review-body').innerHTML = `
    <div class="alert alert-warning text-sm">
      ⚠️ 通过后将立即执行退款，对应座位状态会变更为"已退"，上座率统计会实时更新
    </div>
    <div class="form-row mb-3 text-sm">
      <div><div class="text-xs text-gray">退款号</div><div class="font-mono font-semibold">${r.refund_no}</div></div>
      <div><div class="text-xs text-gray">订单号</div><div class="font-mono">${r.order_no || '-'}</div></div>
      <div><div class="text-xs text-gray">场次</div><div>${escapeHtml(r.event_name || '#' + (r.event_id||''))}</div></div>
    </div>
    <div class="form-group"><label class="form-label">退款原因</label>
      <div class="card" style="box-shadow:none;border:1px solid #e5e7eb"><div class="card-body text-sm">${escapeHtml(r.reason || '-')}</div></div>
    </div>
    <div class="form-row mb-3">
      <div><div class="text-xs text-gray">申请退款金额</div><div class="text-lg font-bold text-danger">${formatCurrency(r.refund_amount)}</div></div>
      <div>
        <div class="text-xs text-gray">退款手续费 (¥)</div>
        <input type="number" id="fee-amount" class="form-control" value="0" step="0.01" min="0" onchange="updateActual()">
        <p class="form-text">系统默认 5%，可手动调整</p>
      </div>
      <div><div class="text-xs text-gray">实际退款</div><div class="text-lg font-bold text-primary" id="actual-amount">${formatCurrency(r.actual_amount || r.refund_amount)}</div></div>
    </div>
    <div class="form-group"><label class="form-label">审核备注</label>
      <textarea id="review-remark" class="form-control" rows="2" placeholder="选填备注（用户可看到）"></textarea>
    </div>`;
  setTimeout(() => {
    const fee = Math.max(2, r.refund_amount * 0.05);
    document.getElementById('fee-amount').value = fee.toFixed(2);
    updateActual();
  }, 50);
  openModal('review-modal');
}

function updateActual() {
  const r = currentList.find(x => x.id === currentId);
  if (!r) return;
  const fee = parseFloat(document.getElementById('fee-amount').value) || 0;
  document.getElementById('actual-amount').textContent = formatCurrency(Math.max(0, r.refund_amount - fee));
}

async function submitReview(approved) {
  if (!currentId) return;
  try {
    const fee = parseFloat(document.getElementById('fee-amount').value) || 0;
    await apiRequest(`/business/refunds/${currentId}/review`, {
      method: 'POST',
      body: {
        approved,
        review_remark: document.getElementById('review-remark').value.trim() || null,
        fee_amount: approved ? fee : 0
      }
    });
    showToast(approved ? '退款已完成' : '已驳回申请', 'success');
    closeModal('review-modal');
    loadList(currentPage);
  } catch(e) {}
}

async function viewDetail(id) {
  try {
    const r = await apiRequest(`/business/refunds/${id}`, { method: 'GET' });
    alert(`退款号：${r.refund_no}\n状态：${getStatusText(r.status)}\n金额：${formatCurrency(r.actual_amount || r.refund_amount)}\n原因：${r.reason}\n备注：${r.review_remark || '-'}\n审核时间：${formatDateTime(r.reviewed_at || '')}`);
  } catch(e) {}
}

loadEvents();
loadList(1);
</script>
{% endblock %}
