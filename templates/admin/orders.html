{% extends "admin_base.html" %}
{% block title %}订单管理 - 管理后台{% endblock %}
{% block content %}
<div class="toolbar">
  <div><h1 style="font-size:1.5rem">📋 订单管理</h1>
    <p class="text-sm text-gray mt-1">查询和管理所有订单（可下钻查看详情）</p>
  </div>
  <div class="toolbar-right">
    <button class="btn btn-outline btn-sm" onclick="exportData()">📥 导出</button>
  </div>
</div>

<div class="filter-bar">
  <div class="form-group" style="flex:1;min-width:260px">
    <label class="form-label">搜索 (编号/姓名/电话)</label>
    <input type="text" id="keyword" class="form-control" placeholder="输入关键字">
  </div>
  <div class="form-group"><label class="form-label">场次</label>
    <select id="f-event" class="form-select"><option value="">全部</option></select>
  </div>
  <div class="form-group"><label class="form-label">状态</label>
    <select id="f-status" class="form-select">
      <option value="">全部</option>
      <option value="pending">待支付</option>
      <option value="confirmed">已确认</option>
      <option value="paid">已支付</option>
      <option value="completed">已完成</option>
      <option value="cancelled">已取消</option>
      <option value="refund_pending">退款中</option>
      <option value="refunded">已退款</option>
    </select>
  </div>
  <div class="form-group"><label class="form-label">开始日期</label>
    <input type="date" id="f-start" class="form-control">
  </div>
  <div class="form-group"><label class="form-label">结束日期</label>
    <input type="date" id="f-end" class="form-control">
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="searchOrders(1)">搜索</button>
    <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
  </div>
</div>

<div class="card">
  <div class="card-body" style="padding:0">
    <table class="table" id="orders-table">
      <thead><tr>
        <th>订单编号</th><th>场次</th><th>用户/联系人</th>
        <th>票数</th><th>座位</th><th>金额</th><th>状态</th>
        <th>下单时间</th><th>操作</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="pagination" class="card-footer"></div>
</div>

<div id="detail-modal" class="modal" style="display:none">
  <div class="modal-dialog" style="max-width:720px">
    <div class="modal-header">
      <h3 class="font-semibold text-lg">📄 订单详情</h3>
      <button class="btn btn-outline btn-sm" data-close-modal="detail-modal">×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer" id="detail-footer"></div>
  </div>
</div>

<script>
let currentPage = 1; const pageSize = 20;

async function loadEvents() {
  try {
    const data = await apiRequest('/admin/events?page=1&page_size=200', { method: 'GET' });
    document.getElementById('f-event').innerHTML = '<option value="">全部</option>' +
      (data.items || []).map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
  } catch(e) {}
}

async function searchOrders(page = 1) {
  currentPage = page;
  let url = `/admin/orders?page=${page}&page_size=${pageSize}`;
  const kw = document.getElementById('keyword').value.trim();
  const ev = document.getElementById('f-event').value;
  const st = document.getElementById('f-status').value;
  const sd = document.getElementById('f-start').value;
  const ed = document.getElementById('f-end').value;
  if (kw) url += `&keyword=${encodeURIComponent(kw)}`;
  if (ev) url += `&event_id=${ev}`;
  if (st) url += `&status=${st}`;
  if (sd) url += `&start_date=${new Date(sd).toISOString()}`;
  if (ed) url += `&end_date=${new Date(ed + 'T23:59:59').toISOString()}`;
  try {
    const data = await apiRequest(url, { method: 'GET' });
    renderOrders(data);
  } catch(e) {}
}

function resetFilter() {
  ['keyword','f-event','f-status','f-start','f-end'].forEach(i => document.getElementById(i).value = '');
  searchOrders(1);
}

function renderOrders(data) {
  const tbody = document.querySelector('#orders-table tbody');
  if (!data.items || data.items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-state-icon">📦</div><p>暂无订单</p></div></td></tr>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  tbody.innerHTML = data.items.map(o => `
    <tr>
      <td class="font-mono text-sm">${o.order_no}</td>
      <td><div class="truncate" style="max-width:180px" title="${escapeHtml(o.event_name || '')}">${escapeHtml(o.event_name || '#' + o.event_id)}</div></td>
      <td>
        <div class="font-semibold text-sm">${escapeHtml(o.contact_name || '用户#' + o.user_id)}</div>
        <div class="text-xs text-gray">${escapeHtml(o.contact_phone || o.contact_email || '')}</div>
      </td>
      <td>${o.ticket_count}</td>
      <td><span class="text-xs">${o.items.map(i => i.seat_code).slice(0,3).join(',')}${o.items.length>3?' +'+(o.items.length-3):''}</span></td>
      <td>
        <div class="font-bold">${formatCurrency(o.pay_amount)}</div>
        ${o.refund_amount > 0 ? `<div class="text-xs text-danger">退 ${formatCurrency(o.refund_amount)}</div>` : ''}
      </td>
      <td><span class="badge ${getStatusBadgeClass(o.status)}">${getStatusText(o.status)}</span></td>
      <td class="text-xs">${formatDateTime(o.created_at)}${o.paid_at?'<br><span class="text-gray">付: '+formatDateTime(o.paid_at)+'</span>':''}</td>
      <td>
        <div class="table-actions">
          <button class="btn btn-sm btn-outline" onclick="showDetail(${JSON.stringify(o).replace(/"/g, '&quot;')})">详情</button>
          ${(o.status === 'pending' || o.status === 'confirmed') ? `<button class="btn btn-sm btn-danger" onclick="cancelOrder(${o.id},'${o.order_no}')">取消</button>` : ''}
        </div>
      </td>
    </tr>
  `).join('');
  document.getElementById('pagination').innerHTML = buildPaginationHtml(data.total, data.page, data.page_size, 'searchOrders');
}

function showDetail(o) {
  const el = document.getElementById('detail-body');
  el.innerHTML = `
    <div class="card mb-3" style="box-shadow:none;border:1px solid #e5e7eb">
      <div class="card-body">
        <div class="form-row mb-2">
          <div><div class="text-xs text-gray">订单号</div><div class="font-mono font-semibold">${o.order_no}</div></div>
          <div><div class="text-xs text-gray">场次</div><div class="font-semibold">${escapeHtml(o.event_name || '#' + o.event_id)}</div></div>
          <div><div class="text-xs text-gray">状态</div><span class="badge ${getStatusBadgeClass(o.status)}">${getStatusText(o.status)}</span></div>
        </div>
        <div class="form-row mb-2 text-sm">
          <div><div class="text-xs text-gray">联系人</div>${escapeHtml(o.contact_name || '-')}</div>
          <div><div class="text-xs text-gray">电话</div>${escapeHtml(o.contact_phone || '-')}</div>
          <div><div class="text-xs text-gray">邮箱</div>${escapeHtml(o.contact_email || '-')}</div>
        </div>
        ${o.remark ? `<div class="text-sm"><div class="text-xs text-gray">备注</div>${escapeHtml(o.remark)}</div>` : ''}
      </div>
    </div>
    <div class="text-sm font-semibold mb-1">🎟️ 票座明细 (${o.items.length}张)</div>
    <div class="card" style="box-shadow:none;border:1px solid #e5e7eb;margin-bottom:1rem">
      <div class="card-body" style="padding:0">
        <table class="table table-sm">
          <thead><tr><th>票号</th><th>座位</th><th>区域</th><th>原价</th><th>售价</th><th>状态</th><th>检票</th></tr></thead>
          <tbody>
            ${o.items.map(i => `
              <tr>
                <td class="font-mono text-xs">${i.ticket_no || '-'}</td>
                <td class="font-semibold">${i.seat_code}</td>
                <td><span class="badge badge-info">${getStatusText(i.area)}</span></td>
                <td>${formatCurrency(i.original_price)}</td>
                <td class="font-semibold">${formatCurrency(i.sale_price)}</td>
                <td><span class="badge ${i.is_refunded?'badge-gray':'badge-success'}">${i.is_refunded?'已退':'有效'}</span></td>
                <td>${i.checked_in ? `<span class="badge badge-success">${formatDateTime(i.checked_in_at).slice(5)}</span>` : '<span class="badge badge-gray">未检</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div style="padding:1rem;background:#f9fafb;border-radius:0.5rem" class="text-sm">
      <div class="d-flex justify-between mb-1"><span class="text-gray">座位总价</span><span>${formatCurrency(o.total_amount)}</span></div>
      <div class="d-flex justify-between mb-1"><span class="text-gray">优惠</span><span>-${formatCurrency(o.discount_amount)}</span></div>
      <div class="d-flex justify-between mb-1"><span class="text-gray">应收</span><span class="font-semibold">${formatCurrency(o.pay_amount)}</span></div>
      ${o.paid_at ? `<div class="d-flex justify-between mb-1"><span class="text-gray">支付方式</span><span>${o.payment_method || '-'}</span></div>` : ''}
      ${o.refund_amount > 0 ? `<div class="d-flex justify-between mb-1"><span class="text-danger">已退款</span><span class="text-danger font-semibold">${formatCurrency(o.refund_amount)}</span></div>` : ''}
      <hr style="margin:0.5rem 0;border-color:#e5e7eb">
      <div class="d-flex justify-between"><span class="font-semibold">实付 / 净收</span><span class="text-lg font-bold text-primary">${formatCurrency(o.pay_amount - (o.refund_amount||0))}</span></div>
      <div class="mt-2 text-xs text-gray">
        下单：${formatDateTime(o.created_at)}
        ${o.paid_at ? ` · 支付：${formatDateTime(o.paid_at)}` : ''}
        ${o.cancelled_at ? ` · 取消：${formatDateTime(o.cancelled_at)}` : ''}
      </div>
      ${o.cancel_reason ? `<div class="mt-1 text-xs text-danger">取消原因：${escapeHtml(o.cancel_reason)}</div>` : ''}
    </div>`;
  const footer = document.getElementById('detail-footer');
  footer.innerHTML = `
    <button class="btn btn-secondary" data-close-modal="detail-modal">关闭</button>
    ${(o.status === 'pending' || o.status === 'confirmed') ? `<button class="btn btn-danger" onclick="cancelOrder(${o.id},'${o.order_no}');closeModal('detail-modal')">取消订单</button>` : ''}
    <a class="btn btn-primary" href="/reports/orders/drilldown?event_id=${o.event_id}" target="_blank">在报表中查看</a>`;
  openModal('detail-modal');
}

async function cancelOrder(id, no) {
  if (!confirm(`确认取消订单 ${no}？`)) return;
  const reason = prompt('取消原因 (可选):', '后台操作取消');
  try {
    await apiRequest(`/admin/orders/${id}/cancel?reason=${encodeURIComponent(reason||'后台取消')}`, { method: 'POST' });
    showToast('订单已取消', 'success');
    searchOrders(currentPage);
  } catch(e) {}
}

function exportData() { showToast('导出功能：在实际部署中可对接Excel导出', 'info'); }

loadEvents();
searchOrders(1);
document.getElementById('keyword').addEventListener('keypress', e => { if (e.key === 'Enter') searchOrders(1); });
</script>
{% endblock %}
