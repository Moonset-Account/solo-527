{% extends "base.html" %}
{% set active_page = 'dashboard' %}
{% block title %}首页 - 采购异常截图归档系统{% endblock %}

{% block content %}
<div id="dashboard-content">
    <h2 style="margin-bottom:20px;">工作台</h2>
    
    <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
            <div class="number" id="stat-total">-</div>
            <div class="label">项目总数</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-pending">-</div>
            <div class="label">待审核</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-archived">-</div>
            <div class="label">已归档</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-rejected">-</div>
            <div class="label">已退回</div>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header">
            <h2>最近项目</h2>
            <a href="/upload" class="btn btn-primary btn-sm">+ 新建项目</a>
        </div>
        <div id="projects-list">
            <p>加载中...</p>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header">
            <h2>我的通知</h2>
        </div>
        <div id="notifications-list">
            <p>加载中...</p>
        </div>
    </div>
</div>

<script>
async function loadDashboard() {
    const user = await checkAuth();
    if (!user) return;
    
    try {
        const res = await fetch('/api/projects', { credentials: 'include' });
        if (res.ok) {
            const projects = await res.json();
            
            document.getElementById('stat-total').textContent = projects.length;
            document.getElementById('stat-pending').textContent = 
                projects.filter(p => ['pending_review', 'first_reviewed'].includes(p.status)).length;
            document.getElementById('stat-archived').textContent = 
                projects.filter(p => p.status === 'archived').length;
            document.getElementById('stat-rejected').textContent = 
                projects.filter(p => p.status === 'rejected').length;
            
            const statusMap = {
                'draft': ['草稿', 'badge-draft'],
                'pending_review': ['待审核', 'badge-pending'],
                'first_reviewed': ['一审通过', 'badge-approved'],
                'archived': ['已归档', 'badge-archived'],
                'rejected': ['已退回', 'badge-rejected']
            };
            
            const recent = projects.slice(0, 10);
            let html = '<table><thead><tr><th>项目编号</th><th>项目名称</th><th>供应商</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody>';
            for (const p of recent) {
                const [statusName, statusClass] = statusMap[p.status] || [p.status, ''];
                html += `
                    <tr>
                        <td>${p.project_code}</td>
                        <td>${p.project_name}</td>
                        <td>${p.supplier_name}</td>
                        <td>¥${p.amount.toLocaleString()}</td>
                        <td><span class="badge ${statusClass}">${statusName}</span></td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick="viewProject(${p.id})">查看</button>
                        </td>
                    </tr>
                `;
            }
            html += '</tbody></table>';
            if (recent.length === 0) html = '<p style="text-align:center;color:#999;">暂无项目</p>';
            document.getElementById('projects-list').innerHTML = html;
        }
        
        const notifRes = await fetch('/api/notifications/my?page_size=5', { credentials: 'include' });
        if (notifRes.ok) {
            const data = await notifRes.json();
            let notifHtml = '';
            for (const n of data.items) {
                notifHtml += `
                    <div style="padding:10px;border-bottom:1px solid #eee;">
                        <div style="font-weight:500;">${n.message}</div>
                        <div style="font-size:12px;color:#999;">${n.created_at}</div>
                    </div>
                `;
            }
            if (data.items.length === 0) notifHtml = '<p style="text-align:center;color:#999;">暂无通知</p>';
            document.getElementById('notifications-list').innerHTML = notifHtml;
        }
    } catch (e) {
        console.error(e);
    }
}

function viewProject(id) {
    window.location.href = `/upload?project_id=${id}`;
}

loadDashboard();
</script>
{% endblock %}
