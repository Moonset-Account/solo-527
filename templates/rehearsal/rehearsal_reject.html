{% extends 'base.html' %}

{% block title %}拒绝排练申请{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">拒绝排练申请</h1>
        
        <div class="mb-6 p-4 bg-gray-50 rounded-lg">
            <p><strong>剧目:</strong> {{ rehearsal.play.title }}</p>
            <p><strong>时间:</strong> {{ rehearsal.date|date:"Y-m-d" }} {{ rehearsal.start_time|time:"H:i" }} - {{ rehearsal.end_time|time:"H:i" }}</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">拒绝理由</label>
                <textarea name="reason" rows="4" required class="w-full border border-gray-300 rounded-lg p-3"></textarea>
            </div>
            
            <div class="flex justify-end space-x-4">
                <a href="{% url 'rehearsal:rehearsal_detail' rehearsal.pk %}" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    取消
                </a>
                <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    确认拒绝
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
