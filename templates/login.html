{% extends "base.html" %}

{% block title %}登录 - 调拨单证据绑定平台{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">📦</div>
            <h1>调拨单证据绑定平台</h1>
            <p>请登录以继续使用系统</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">登 录</button>
        </form>
        
        <div class="tip-box">
            <strong>测试账号：</strong><br>
            值班员: watcher1 / 123456<br>
            主 管: supervisor1 / 123456<br>
            财 务: finance1 / 123456
        </div>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    
    fetch('/api/login', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            window.location.href = data.redirect;
        } else {
            showToast(data.message || '登录失败', 'error');
        }
    })
    .catch(() => showToast('网络错误，请重试', 'error'));
});
</script>
{% endblock %}
