{% extends "base.html" %}
{% block title %}登录 - {{ settings.APP_NAME }}{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div class="card" style="width:100%;max-width:420px">
    <div class="card-header">
      <h2 class="card-title">账号登录</h2>
    </div>
    <div class="card-body">
      <form id="login-form" hx-post="/api/auth/login" hx-ext="json-enc" hx-swap="none">
        <div class="form-group">
          <label class="form-label">用户名 / 邮箱</label>
          <input type="text" name="username" class="form-control" required autofocus placeholder="admin / operator / finance / test001">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" name="password" class="form-control" required placeholder="admin123 / op123456 / fin123456 / test123456">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full">登 录</button>
      </form>
      <div class="mt-3 text-sm text-gray">
        <p>演示账号：</p>
        <p>管理员 admin / admin123 | 运营 operator / op123456</p>
        <p>财务 finance / fin123456 | 用户 test001 / test123456</p>
      </div>
    </div>
  </div>
</div>
<script>
  document.getElementById('login-form').addEventListener('htmx:afterRequest', async (e) => {
    try {
      const data = JSON.parse(e.detail.xhr.responseText);
      if (data.code === 0) {
        showToast('登录成功', 'success');
        setTimeout(() => {
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next') || '/admin';
          window.location.href = next;
        }, 500);
      } else {
        showToast(data.message || '登录失败', 'error');
      }
    } catch (err) {
      showToast('登录失败，请检查账号密码', 'error');
    }
  });
</script>
{% endblock %}
