{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}登录 - 采购异常截图归档系统{% endblock %}

{% block content %}
<div class="login-container">
    <h1>采购异常截图归档系统</h1>
    <form id="login-form" hx-post="/api/auth/login" hx-target="#login-result">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
        <div id="login-result" style="margin-top:15px;"></div>
    </form>
    
    <div style="margin-top:20px; padding:15px; background:#f8f9fa; border-radius:4px; font-size:13px;">
        <p style="font-weight:bold; margin-bottom:8px;">测试账号：</p>
        <p>管理员: admin / admin123</p>
        <p>采购员: buyer01 / buyer123</p>
        <p>审计员: auditor01 / auditor123</p>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('htmx:afterRequest', function(evt) {
    const xhr = evt.detail.xhr;
    if (xhr.status === 200) {
        showToast('登录成功');
        setTimeout(() => window.location.href = '/dashboard', 500);
    } else {
        document.getElementById('login-result').innerHTML = 
            '<div class="alert alert-error">用户名或密码错误</div>';
    }
});
</script>
{% endblock %}
